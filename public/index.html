<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>דוד נאמן</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#2e7d6b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Rubik:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body data-title-key="meta.homeTitle">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-orb" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name" data-biz="name"></span>
          <span class="brand-tagline" data-biz="tagline"></span>
        </span>
      </a>
      <nav class="main-nav" id="main-nav" data-i18n-attr="aria-label:a11y.menu">
        <ul>
          <li><a href="#treatments" data-i18n="nav.treatments"></a></li>
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#gallery" data-i18n="nav.gallery"></a></li>
          <li><a href="#visit" data-i18n="nav.visit"></a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="a11y-toggle" type="button" aria-expanded="false" aria-controls="a11y-panel" data-icon="a11y" data-i18n-attr="aria-label:a11y.menuLabel;title:a11y.menuLabel"></button>
        <button class="icon-btn" id="theme-toggle" type="button"></button>
        <a class="btn btn-primary header-cta" href="/book" data-i18n="nav.book"></a>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-controls="main-nav" aria-expanded="false" data-i18n-attr="aria-label:a11y.menu" data-icon="menu"></button>
      </div>
      <span class="scroll-progress" aria-hidden="true"></span>
    </div>
  </header>

  <main id="main">
    <!-- Intro: a short curtain with the name, once per visit -->
    <div class="intro" aria-hidden="true">
      <span class="intro-orb"></span>
      <span class="intro-name" data-biz="name"></span>
    </div>

    <!-- Hero: big name, then his clinic in a frame that opens up as you scroll -->
    <section class="hero" id="hero">
      <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="container hero-head">
        <p class="pill-label" data-biz="street"></p>
        <h1 class="hero-title">
          <span class="line"><span data-i18n="hero.line1"></span></span>
          <span class="line line-2"><span class="grad" data-i18n="hero.line2"></span></span>
        </h1>
        <div class="hero-ctas">
          <a class="btn btn-primary btn-arrow" href="/book"><span data-i18n="hero.ctaBook"></span><span class="flip-rtl" data-icon="arrow"></span></a>
          <a class="btn btn-soft" href="#treatments" data-i18n="hero.ctaMore"></a>
          <p class="status" data-status hidden></p>
        </div>
      </div>
      <div class="hero-media" id="hero-media">
        <picture>
          <source media="(max-width: 700px)" srcset="images/hero-tall.jpg" width="1080" height="1440">
          <img src="images/hero-wide.jpg" alt="דוד נאמן בקליניקה" width="2400" height="1350" fetchpriority="high">
        </picture>
      </div>
    </section>

    <!-- Techniques: large, slow type that reacts to scrolling -->
    <div class="marquee" role="region" data-i18n-attr="aria-label:techniques.label">
      <div class="marquee-track" id="marquee-track">
        <ul class="marquee-group">
          <li data-i18n="techniques.t1"></li>
          <li data-i18n="techniques.t3"></li>
          <li data-i18n="techniques.t4"></li>
          <li data-i18n="techniques.t5"></li>
        </ul>
        <ul class="marquee-group" aria-hidden="true">
          <li data-i18n="techniques.t1"></li>
          <li data-i18n="techniques.t3"></li>
          <li data-i18n="techniques.t4"></li>
          <li data-i18n="techniques.t5"></li>
        </ul>
        <ul class="marquee-group" aria-hidden="true">
          <li data-i18n="techniques.t1"></li>
          <li data-i18n="techniques.t3"></li>
          <li data-i18n="techniques.t4"></li>
          <li data-i18n="techniques.t5"></li>
        </ul>
      </div>
    </div>

    <!-- Treatments -->
    <section class="section section-alt" id="treatments">
      <div class="container">
        <header class="section-head reveal">
          <div>
            <span class="sec-num" aria-hidden="true">01</span>
            <h2 class="section-title" data-i18n="treatments.title"></h2>
          </div>
          <p class="section-lead" data-i18n="treatments.lead"></p>
        </header>
        <ol class="stack" id="services-list" aria-live="polite"></ol>
      </div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="container">
        <div class="about">
          <figure class="about-photo reveal">
            <div class="blob">
              <img src="images/about.jpg" alt="דוד נאמן בקליניקה" width="900" height="1125" loading="lazy">
            </div>
          </figure>
          <div class="about-text reveal">
            <span class="sec-num" aria-hidden="true">02</span>
            <h2 class="section-title" data-i18n="about.title"></h2>
            <p class="about-lead" data-i18n="about.p1"></p>
            <p data-i18n="about.p2"></p>
            <p data-i18n="about.p3"></p>
          </div>
        </div>
        <figure class="statement">
          <blockquote class="words" data-words="about.quote"></blockquote>
          <figcaption data-biz="name"></figcaption>
        </figure>
      </div>
    </section>

    <!-- Gallery: three columns that drift at different speeds -->
    <section class="section" id="gallery">
      <div class="container">
        <header class="section-head reveal">
          <div>
            <span class="sec-num" aria-hidden="true">03</span>
            <h2 class="section-title" data-i18n="gallery.title"></h2>
          </div>
        </header>
        <div class="mosaic reveal" id="mosaic" role="group" data-i18n-attr="aria-label:gallery.title">
          <div class="mosaic-col" data-speed="0.08">
            <button class="mosaic-item" type="button" data-large="images/large/gal-1.jpg"><img src="images/gal-1.jpg" alt="טיפול בכוסות רוח בקליניקה" width="720" height="900" loading="lazy"></button>
            <button class="mosaic-item" type="button" data-large="images/large/gal-2.jpg"><img src="images/gal-2.jpg" alt="כוסות רוח על הכתפיים" width="720" height="900" loading="lazy"></button>
            <button class="mosaic-item" type="button" data-large="images/large/gal-3.jpg"><img src="images/gal-3.jpg" alt="דיקור בגב" width="720" height="900" loading="lazy"></button>
          </div>
          <div class="mosaic-col" data-speed="-0.1">
            <button class="mosaic-item" type="button" data-large="images/large/gal-4.jpg"><img src="images/gal-4.jpg" alt="טיפול משולב בכוסות רוח לאורך הגב" width="720" height="900" loading="lazy"></button>
            <button class="mosaic-item" type="button" data-large="images/large/gal-5.jpg"><img src="images/gal-5.jpg" alt="כוסות רוח לאורך הגב" width="720" height="900" loading="lazy"></button>
            <button class="mosaic-item" type="button" data-large="images/large/gal-6.jpg"><img src="images/gal-6.jpg" alt="דיקור יבש לאורך הגב" width="720" height="900" loading="lazy"></button>
          </div>
          <div class="mosaic-col" data-speed="0.05">
            <button class="mosaic-item" type="button" data-large="images/large/gal-7.jpg"><img src="images/gal-7.jpg" alt="דיקור וסימני כוסות רוח בגב" width="720" height="900" loading="lazy"></button>
            <button class="mosaic-item" type="button" data-large="images/large/gal-8.jpg"><img src="images/gal-8.jpg" alt="כוסות רוח בגב התחתון" width="720" height="900" loading="lazy"></button>
            <button class="mosaic-item" type="button" data-large="images/large/gal-9.jpg"><img src="images/gal-9.jpg" alt="דיקור לאורך עמוד השדרה" width="720" height="900" loading="lazy"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- Visit -->
    <section class="section section-alt" id="visit">
      <div class="container">
        <header class="section-head reveal">
          <div>
            <span class="sec-num" aria-hidden="true">04</span>
            <h2 class="section-title" data-i18n="visit.title"></h2>
          </div>
        </header>
        <div class="visit">
          <div class="visit-card glass reveal">
            <h3 class="visit-h"><span data-icon="pin"></span><span data-i18n="visit.address"></span></h3>
            <p class="visit-address" data-biz="street"></p>
            <p class="visit-sub"><span data-biz="building"></span> · <span data-i18n="visit.parking"></span></p>
            <div class="visit-actions">
              <a class="btn btn-primary btn-sm" data-biz-href="waze" target="_blank" rel="noopener"><span data-icon="navigate"></span><span data-i18n="visit.waze"></span></a>
              <a class="btn btn-outline btn-sm" data-biz-href="maps" target="_blank" rel="noopener" data-i18n="visit.maps"></a>
            </div>
          </div>
          <div class="visit-card glass reveal delay-1">
            <h3 class="visit-h"><span data-icon="clock"></span><span data-i18n="visit.hours"></span></h3>
            <table class="hours-table">
              <tbody id="hours-body"></tbody>
            </table>
            <p class="visit-note" data-i18n="visit.booking"></p>
            <p class="status" data-status hidden></p>
          </div>
          <div class="visit-card glass reveal delay-2">
            <h3 class="visit-h"><span data-icon="leaf"></span><span data-i18n="visit.prep"></span></h3>
            <ul class="prep">
              <li><span class="prep-icon" data-icon="clock"></span><span data-i18n="visit.prep1"></span></li>
              <li><span class="prep-icon" data-icon="shirt"></span><span data-i18n="visit.prep2"></span></li>
              <li><span class="prep-icon" data-icon="calendarX"></span><span data-i18n="visit.prep3"></span></li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Call to action + contact -->
    <section class="final" id="contact">
      <div class="container">
        <div class="final-card reveal">
          <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <div>
            <span class="sec-num" aria-hidden="true">05</span>
            <h2 class="final-title" data-i18n="contact.title"></h2>
            <a class="btn btn-primary btn-arrow" href="/book"><span data-i18n="cta.button"></span><span class="flip-rtl" data-icon="arrow"></span></a>
            <ul class="final-links">
              <li data-biz-item><span class="bubble" data-icon="phone"></span><a data-biz-href="phone"><bdi data-biz="phone"></bdi></a></li>
              <li data-biz-item><span class="bubble" data-icon="whatsapp"></span><a data-biz-href="whatsapp" target="_blank" rel="noopener" data-i18n="contact.whatsappText"></a></li>
              <li data-biz-item><span class="bubble" data-icon="mail"></span><a data-biz-href="email"><bdi data-biz="email"></bdi></a></li>
              <li data-biz-item><span class="bubble" data-icon="pin"></span><a data-biz-href="maps" target="_blank" rel="noopener" data-biz="address"></a></li>
            </ul>
          </div>
          <div class="contact-card glass">
            <form class="form" id="contact-form" novalidate>
              <div class="field">
                <label for="c-name" data-i18n="contact.formName"></label>
                <input id="c-name" name="name" autocomplete="name" required maxlength="80">
              </div>
              <div class="form-row">
                <div class="field">
                  <label for="c-phone" data-i18n="contact.formPhone"></label>
                  <input id="c-phone" name="phone" type="tel" autocomplete="tel" maxlength="30">
                </div>
                <div class="field">
                  <label for="c-email" data-i18n="contact.formEmail"></label>
                  <input id="c-email" name="email" type="email" autocomplete="email" maxlength="120">
                </div>
              </div>
              <div class="field">
                <label for="c-message" data-i18n="contact.formMessage"></label>
                <textarea id="c-message" name="message" required maxlength="2000"></textarea>
              </div>
              <div class="hp-field" aria-hidden="true">
                <label for="c-website">Website</label>
                <input id="c-website" name="website" tabindex="-1" autocomplete="off">
              </div>
              <div id="contact-status" role="status"></div>
              <button class="btn btn-primary btn-block" type="submit" data-i18n="contact.send"></button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <div class="footer-brand">
          <span class="brand-orb" aria-hidden="true"></span>
          <div>
            <p class="footer-name" data-biz="name"></p>
            <p class="footer-tag" data-biz="tagline"></p>
          </div>
        </div>
        <a class="btn btn-primary btn-arrow" href="/book"><span data-i18n="nav.book"></span><span class="flip-rtl" data-icon="arrow"></span></a>
      </div>
      <div class="footer-grid">
        <div>
          <h4 data-i18n="footer.links"></h4>
          <ul>
            <li><a href="#treatments" data-i18n="nav.treatments"></a></li>
            <li><a href="#about" data-i18n="nav.about"></a></li>
            <li><a href="#gallery" data-i18n="nav.gallery"></a></li>
            <li><a href="#visit" data-i18n="nav.visit"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.contact"></h4>
          <ul>
            <li data-biz-item><a data-biz-href="phone"><bdi data-biz="phone"></bdi></a></li>
            <li data-biz-item><a data-biz-href="whatsapp" target="_blank" rel="noopener">WhatsApp</a></li>
            <li data-biz-item><a data-biz-href="email"><bdi data-biz="email"></bdi></a></li>
            <li data-biz-item><a data-biz-href="instagram" target="_blank" rel="noopener">Instagram</a></li>
            <li data-biz-item><a data-biz-href="facebook" target="_blank" rel="noopener">Facebook</a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.address"></h4>
          <p data-biz="address"></p>
          <a data-biz-href="waze" target="_blank" rel="noopener" data-i18n="visit.waze"></a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span data-biz="year"></span> <span data-biz="name"></span>. <span data-i18n="footer.rights"></span></span>
        <span class="footer-links">
          <button class="linklike" type="button" data-open-statement data-i18n="a11y.statement"></button>
          <a href="#top" data-i18n="a11y.top"></a>
        </span>
      </div>
      <div class="footer-mark" aria-hidden="true"><span data-biz="name"></span></div>
    </div>
  </footer>

  <a class="whatsapp-fab" data-biz-href="whatsapp" target="_blank" rel="noopener" data-i18n-attr="aria-label:a11y.whatsapp" data-icon="whatsapp" hidden></a>
  <nav class="action-bar" data-i18n-attr="aria-label:mobile.bar">
    <a class="btn btn-primary" href="/book" data-i18n="mobile.book"></a>
    <a class="icon-btn" data-biz-href="whatsapp" target="_blank" rel="noopener" data-icon="whatsapp" data-i18n-attr="aria-label:a11y.whatsapp"></a>
    <a class="icon-btn" data-biz-href="phone" data-icon="phone" data-i18n-attr="aria-label:a11y.call"></a>
  </nav>
</body>
</html>
