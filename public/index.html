              <button class="zone" type="button" data-zone="lower" aria-pressed="false" data-i18n="bodymap.zones.lower.name"></button>

    <!-- Treatments -->

            <span class="step-dots" aria-hidden="true"><i></i><i></i></span>

            <span class="step-dots" aria-hidden="true"><i></i><i></i><i></i></span>

            <p data-i18n="process.s3p"></p>

    <!-- Gallery -->

      <div class="container">
        <header class="section-head reveal">

        </header>
        <div class="gallery" id="gallery-grid">

          <button class="gallery-item" type="button" data-large="images/large/gallery-2.jpg"><img src="images/gallery-2.jpg" alt="דיקור יבש לאורך הגב" width="700" height="700" loading="lazy"><span class="cap" data-i18n="gallery.c2"></span></button>
          <button class="gallery-item" type="button" data-large="images/large/gallery-3.jpg"><img src="images/gallery-3.jpg" alt="דיקור וסימני כוסות רוח בגב" width="700" height="700" loading="lazy"><span class="cap" data-i18n="gallery.c3"></span></button>
          <button class="gallery-item is-wide" type="button" data-large="images/large/gallery-4.jpg"><img src="images/gallery-4.jpg" alt="כוסות רוח על הכתפיים" width="1200" height="600" loading="lazy"><span class="cap" data-i18n="gallery.c4"></span></button>

          <button class="gallery-item is-wide" type="button" data-large="images/large/gallery-6.jpg"><img src="images/gallery-6.jpg" alt="טיפול משולב בכוסות רוח לאורך הגב" width="1200" height="600" loading="lazy"><span class="cap" data-i18n="gallery.c6"></span></button>

    <!-- Visit -->

        <header class="section-head reveal">

            <h3 class="visit-h" data-i18n="visit.address"></h3>

            <p class="visit-sub"><span data-biz="building"></span> · <span data-i18n="visit.parking"></span></p>

    <!-- Call to action + contact -->
    <section class="final" id="contact">
      <div class="container final-grid">
        <div>
          <p class="kicker" data-i18n="contact.eyebrow"></p>
          <h2 class="final-title" data-i18n="cta.title"></h2>
          <p class="final-lead" data-i18n="cta.text"></p>
          <a class="btn btn-light btn-arrow" href="/book"><span data-i18n="cta.button"></span><span class="flip-rtl" data-icon="arrow"></span></a>
          <ul class="final-links">
            <li data-biz-item><span data-icon="phone"></span><a data-biz-href="phone"><bdi data-biz="phone"></bdi></a></li>
            <li data-biz-item><span data-icon="whatsapp"></span><a data-biz-href="whatsapp" target="_blank" rel="noopener" data-i18n="contact.whatsappText"></a></li>
            <li data-biz-item><span data-icon="mail"></span><a data-biz-href="email"><bdi data-biz="email"></bdi></a></li>
            <li data-biz-item><span data-icon="pin"></span><a data-biz-href="maps" target="_blank" rel="noopener" data-biz="address"></a></li>
          </ul>
        </div>
        <div class="contact-card">
          <h3 data-i18n="contact.title"></h3>
          <p class="panel-sub" data-i18n="contact.lead"></p>
          <form class="form" id="contact-form" novalidate>
            <div class="field">
              <label for="c-name" data-i18n="contact.formName"></label>
              <input id="c-name" name="name" autocomplete="name" required maxlength="80">
            </div>
            <div class="form-row">
              <div class="field">
                <label for="c-phone" data-i18n="contact.formPhone"></label>
                <input id="c-phone" name="phone" type="tel" autocomplete="tel" maxlength="30">
              </div>
              <div class="field">
                <label for="c-email" data-i18n="contact.formEmail"></label>
                <input id="c-email" name="email" type="email" autocomplete="email" maxlength="120">
              </div>
