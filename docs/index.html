/* ==========================================================================
   David Neeman – acupuncture clinic, Tel Aviv
   Layout concept: an acupuncture chart. Hairline rules, points (red dots)
   and needles (thin lines), tall condensed headlines, round "cup" frames.
   ========================================================================== */

:root {
  /* Color – from the clinic itself: stone-white walls, fig-leaf green,
     the red of a cupping mark / a Japanese seal. */
  --paper: #f3f4ef;
  --paper-2: #e8ebe3;
  --surface: #fbfcf9;
  --ink: #16201a;
  --ink-2: #39453d;
  --muted: #5b675e;
  --line: #d3d9cf;
  --line-strong: #aeb8a9;
  --pine: #1f3d2e;
  --pine-hover: #2a5240;
  --on-pine: #f3f4ef;
  --sage: #dbe5d8;
  --point: #c4432b;
  --point-ink: #a63520;
  --point-soft: #f4ddd4;
  --seal: #c4432b;
  --seal-ink: #fbf8f2;
  --open: #2e9a55;
  --success: #2c6a45;
  --success-soft: #dcebdf;
  --danger: #a63520;
  --danger-soft: #f4ddd4;
  --photo-bg: #d9ded3;
  --band-bg: #1f3d2e;
  --band-ink: #eef1ea;
  --band-muted: #b7c5ba;
  --band-line: rgb(238 241 234 / 0.2);
  --header-bg: rgb(243 244 239 / 0.86);
  --shadow: 0 30px 60px -34px rgb(22 32 26 / 0.45);
  --shadow-sm: 0 1px 2px rgb(22 32 26 / 0.06);

  /* Older component names (booking + admin) map onto the palette above. */
  --bg: var(--paper);
  --bg-alt: var(--paper-2);
  --surface-2: var(--paper-2);
  --text: var(--ink);
  --border: var(--line);
  --primary: var(--pine);
  --primary-hover: var(--pine-hover);
  --on-primary: var(--on-pine);
  --primary-soft: var(--sage);
  --accent: var(--point-ink);
  --accent-soft: var(--point-soft);

  /* Type: Karantina (tall, condensed display) + IBM Plex (precise body, mono labels). */
  --font-display: 'Karantina', 'IBM Plex Sans Hebrew', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Hebrew', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', 'IBM Plex Sans Hebrew', ui-monospace, monospace; /* numbers and times */
  --font-label: var(--font-body); /* small Hebrew labels */
  --fs-xs: 0.78rem;
  --fs-sm: 0.92rem;
  --fs-base: 1.0625rem;
  --fs-md: 1.2rem;
  --fs-lg: 1.5rem;
  --fs-title: clamp(3.4rem, 8vw, 6.2rem);
  --fs-hero: clamp(4.4rem, 11vw, 9.4rem);

  /* Shape & space */
  --radius-sm: 6px;
  --radius: 12px;
  --radius-lg: 22px;
  --container: 1240px;
  --gutter: 20px;
  --header-h: 72px;
  --section: clamp(76px, 10vw, 136px);
  color-scheme: light;
}

:root[data-theme='dark'] {
  --paper: #0e1411;
  --paper-2: #131b17;
  --surface: #17201b;
  --ink: #e7ebe3;
  --ink-2: #c5cdc2;
  --muted: #98a498;
  --line: #27322b;
  --line-strong: #3d4b42;
  --pine: #a3cbb0;

  --on-pine: #0e1411;
  --sage: #1c2a22;
  --point: #ef7355;

  --point-soft: #3a2019;
  --open: #5fd08a;
  --success: #8fd0a6;
  --success-soft: #173123;
  --danger: #f28b70;
  --danger-soft: #3a2019;
  --photo-bg: #1f2923;
  --band-bg: #16251c;
  --band-ink: #e7ebe3;
  --band-muted: #a5b4a8;
  --band-line: rgb(231 235 227 / 0.16);
  --header-bg: rgb(14 20 17 / 0.84);
  --shadow: 0 30px 60px -30px rgb(0 0 0 / 0.7);
  --shadow-sm: none;
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #0e1411;
    --paper-2: #131b17;

    color-scheme: dark;
  }
}

@media (min-width: 720px) {
  :root {
    --gutter: 40px;
  }
}

/* ---------- Accessibility menu modes ---------- */

html.a11y-text-1 {
  font-size: 112.5%;
}

html.a11y-text-2 {
  font-size: 125%;
}

html.a11y-contrast {
  --muted: var(--ink);
  --ink-2: var(--ink);
  --line: var(--line-strong);
  --line-strong: var(--ink);
  --band-muted: var(--band-ink);
}

html.a11y-links a {
  text-decoration: underline !important;
  text-underline-offset: 3px;
}

html.a11y-font {
  --font-display: var(--font-body);
}

html.a11y-still *,
html.a11y-still *::before,
html.a11y-still *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}

/* ==========================================================================
   Base
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 16px);
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 400;
  line-height: 1.1;
  text-wrap: balance;
}

p {
  margin: 0 0 1em;
}

a {
  color: inherit;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

img,
svg {
  display: block;
  max-width: 100%;
}

img {
  height: auto;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--point);
  outline-offset: 3px;
  border-radius: 4px;
}

::selection {
  background: var(--point-soft);
  color: var(--ink);
}

[hidden] {
  display: none !important;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  inset-inline-start: 12px;
  top: -60px;
  z-index: 100;
  background: var(--pine);
  color: var(--on-pine);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  transition: top 0.2s;
}

.skip-link:focus {
  top: 12px;
}

.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

[dir='rtl'] .flip-rtl {
  transform: scaleX(-1);
}

.flip-rtl {
  display: inline-flex;
}

bdi {
  unicode-bidi: isolate;
}

/* The "point": a small red dot used across the site, like an acupuncture point on a chart. */
.pt-dot {
  display: inline-block;
  width: 0.17em;
  height: 0.17em;
  margin-inline-start: 0.07em;
  border-radius: 50%;
  background: var(--point);
  vertical-align: baseline;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 18px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  color: var(--muted);
}

.kicker::before {
  content: '';
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--point);
}

.caption {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  font-family: var(--font-label);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.caption::before {
  content: '';
  width: 28px;
  height: 1px;
  background: var(--line-strong);
}

/* Seal: the red stamp with David's initials. */
.seal {
  display: block;
  width: 64px;
  aspect-ratio: 1;
}

.seal svg {
  width: 100%;
  height: 100%;
}

.seal-bg {
  fill: var(--seal);
}

.seal-ink {
  fill: var(--seal-ink);
}

.seal-frame {
  fill: none;
  stroke: var(--seal-ink);
}

/* ==========================================================================
   Buttons
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6em;
  min-height: 50px;
  padding: 0.7em 1.5em;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
}

.btn:active {
  transform: translateY(1px);
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn-primary {
  background: var(--pine);
  color: var(--on-pine);
}

.btn-primary:hover {
  background: var(--pine-hover);
}

.btn-outline {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--ink);
}

.btn-outline:hover {
  border-color: var(--ink);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  padding-inline: 0.7em;
}

.btn-ghost:hover {
  background: var(--paper-2);
}

.btn-danger {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--danger);
}

.btn-danger:hover {
  background: var(--danger-soft);
  border-color: var(--danger);
}

.btn-light {
  background: var(--band-ink);
  color: var(--band-bg);
}

.btn-light:hover {
  opacity: 0.9;
}

.btn-sm {
  min-height: 38px;
  padding: 0.4em 1em;
  font-size: 0.9rem;
}

.btn-block {
  width: 100%;
}

.btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-arrow .flip-rtl svg {
  transition: transform 0.25s ease;
}

.btn-arrow:hover .flip-rtl svg {
  transform: translateX(4px);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.2s, background-color 0.2s;
}

.icon-btn:hover {
  border-color: var(--ink);
}

.icon-btn[aria-expanded='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

.linklike {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ==========================================================================
   Header
   ========================================================================== */

.site-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  height: var(--header-h);
  background: var(--header-bg);
  backdrop-filter: saturate(140%) blur(14px);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}

.site-header.is-scrolled {
  border-bottom-color: var(--line);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 20px;
  height: 100%;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  color: var(--ink);
  text-decoration: none;
}

.brand-mark {
  flex: none;
  width: 40px;
  height: 40px;
}

.brand-mark svg {
  width: 100%;
  height: 100%;
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.1;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 0.85;
  white-space: nowrap;
}

.brand-tagline {
  margin-top: 4px;
  font-family: var(--font-label);
  font-size: 0.66rem;
  letter-spacing: 0.03em;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.main-nav {
  margin-inline-start: auto;
}

.main-nav ul {
  display: flex;
  gap: 2px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.main-nav a {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  white-space: nowrap;
  transition: color 0.2s;
}

.main-nav a::after {
  content: '';
  position: absolute;
  inset-inline: 12px;
  bottom: 3px;
  height: 1px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.3s ease;
}

[dir='ltr'] .main-nav a::after {
  transform-origin: left;
}

.main-nav a:hover,
.main-nav a.is-current,
.main-nav a[aria-current='page'] {
  color: var(--ink);
}

.main-nav a:hover::after,
.main-nav a.is-current::after,
.main-nav a[aria-current='page']::after {
  transform: scaleX(1);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-toggle {
  display: none;
}

@media (max-width: 1120px) {
  .nav-toggle {
    display: inline-grid;
  }

  .main-nav {
    position: fixed;
    inset: var(--header-h) 0 auto 0;
    max-height: calc(100vh - var(--header-h));
    overflow-y: auto;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 8px var(--gutter) 28px;
    transform: translateY(-8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
  }

  .main-nav.is-open {
    transform: none;
    opacity: 1;
    visibility: visible;
  }

  .main-nav ul {
    flex-direction: column;
    gap: 0;
  }

  .main-nav li + li {
    border-top: 1px solid var(--line);
  }

  .main-nav a {
    padding: 14px 0;
    font-family: var(--font-display);
    font-size: 2.4rem;
    line-height: 1;
    color: var(--ink);
  }

  .main-nav a::after {
    display: none;
  }

  .main-nav a::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line-strong);
  }

  .main-nav a.is-current::before {
    background: var(--point);
  }

  .header-actions {
    margin-inline-start: auto;
  }
}

@media (max-width: 600px) {
  .brand-tagline,
  .header-cta {
    display: none;
  }

  .header-inner {
    gap: 12px;
  }

  .header-actions {
    gap: 6px;
  }
}

/* ==========================================================================
   Sections
   ========================================================================== */

.section {
  padding-block: var(--section);
}

.section-alt {
  background: var(--paper-2);
}

.section-dark {
  background: var(--band-bg);
  color: var(--band-ink);
  --ink: var(--band-ink);
  --ink-2: var(--band-ink);
  --muted: var(--band-muted);
  --line: var(--band-line);
  --line-strong: var(--band-line);
}

.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 24px 48px;
  align-items: end;
  margin-bottom: clamp(40px, 6vw, 72px);
}

.section-title {
  font-family: var(--font-display);
  font-size: var(--fs-title);
  line-height: 0.88;
}

.section-lead {
  margin: 0;
  max-width: 46ch;
  font-size: var(--fs-md);
  line-height: 1.6;
  color: var(--ink-2);
}

@media (max-width: 820px) {
  .section-head {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Hero
   ========================================================================== */

.hero {
  position: relative;
  padding-block: clamp(36px, 6vw, 88px) clamp(64px, 8vw, 112px);
  overflow: hidden;
}

.hero-lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.meridian {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.2;
  stroke-dasharray: 2600;
  stroke-dashoffset: 2600;
  animation: draw 2.6s cubic-bezier(0.6, 0.1, 0.2, 1) 0.2s forwards;
}

.meridian-points circle {
  fill: var(--point);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: pop 0.5s ease-out forwards;
}

.meridian-points circle:nth-child(1) { animation-delay: 0.7s; }
.meridian-points circle:nth-child(2) { animation-delay: 1s; }
.meridian-points circle:nth-child(3) { animation-delay: 1.3s; }
.meridian-points circle:nth-child(4) { animation-delay: 1.6s; }
.meridian-points circle:nth-child(5) { animation-delay: 1.9s; }
.meridian-points circle:nth-child(6) { animation-delay: 2.2s; }

.hero-grid {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
  gap: clamp(40px, 5vw, 80px);
  align-items: center;
}

.hero-text > * {
  animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

.hero-text > :nth-child(2) { animation-delay: 0.08s; }
.hero-text > :nth-child(3) { animation-delay: 0.16s; }
.hero-text > :nth-child(4) { animation-delay: 0.24s; }
.hero-text > :nth-child(5) { animation-delay: 0.32s; }
.hero-text > :nth-child(6) { animation-delay: 0.4s; }

.hero-title {
  margin: 0 0 28px;
  font-family: var(--font-display);
  font-size: var(--fs-hero);
  line-height: 0.84;
  letter-spacing: -0.005em;
}

.hero-title > span {
  display: block;
}

.hero-title .hl {
  color: var(--pine);
}

.hero-lead {
  max-width: 40ch;
  margin-bottom: 32px;
  font-size: var(--fs-md);
  line-height: 1.6;
  color: var(--ink-2);
}

.hero-ctas {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.hero-ctas.center {
  justify-content: center;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 0;
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--ink-2);
  background: var(--surface);
}

.status::before {
  content: '';
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line-strong);
}

.status.is-open::before {
  background: var(--open);
  animation: ping 2s ease-out infinite;
}

.hero-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  list-style: none;
  margin: 36px 0 0;
  padding: 20px 0 0;
  border-top: 1px solid var(--line);
  font-size: var(--fs-sm);
  color: var(--muted);
}

.hero-facts li {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero-facts li::before {
  content: '';
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--point);
}

.hero-visual {
  position: relative;
  justify-self: center;
  width: min(100%, 470px);
  aspect-ratio: 1 / 1.14;
  animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s both;
}

.cup,
.cup-ring {
  position: absolute;
  inset-inline-end: 0;
  top: 0;
  width: 86%;
  aspect-ratio: 1;
  border-radius: 50%;
}

.cup {
  margin: 0;
  overflow: hidden;
  background: var(--photo-bg);
}

.cup img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cup-ring {
  inset-inline-end: -16px;
  top: -16px;
  width: calc(86% + 32px);
  border: 1px solid var(--line-strong);
  pointer-events: none;
}

.portrait-card {
  position: absolute;
  inset-inline-start: 0;
  bottom: 0;
  width: 40%;
  margin: 0;
  padding: 8px 8px 0;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  transform: rotate(-3deg);
}

.portrait-card img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  background: var(--photo-bg);
}

.portrait-card figcaption {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 2px 10px;
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 1;
}

.portrait-card figcaption .pt-dot {
  width: 7px;
  height: 7px;
  margin: 0;
}

.hero-seal {
  position: absolute;
  inset-inline-end: 4%;
  bottom: 22%;
  width: clamp(56px, 7vw, 72px);
  transform: rotate(8deg);
  filter: drop-shadow(0 10px 18px rgb(0 0 0 / 0.18));
}

.hero-annot {
  position: absolute;
  inset-inline-end: 50%;
  top: -2%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-family: var(--font-label);
  font-size: 0.7rem;
  color: var(--muted);
  white-space: nowrap;
  transform: translateX(50%);
}

[dir='ltr'] .hero-annot {
  transform: translateX(-50%);
}

@media (max-width: 900px) {
  .hero-lines {
    display: none;
  }

  .hero-grid {
    grid-template-columns: 1fr;
  }

  .hero-visual {
    width: min(100%, 380px);
    margin-top: 12px;
  }
}

/* ---------- Techniques band ---------- */

.band {
  overflow: hidden;
  padding-block: 20px;
  border-block: 1px solid var(--line);
}

.band-track {
  display: flex;
  width: max-content;
  animation: marquee 48s linear infinite;
}

[dir='ltr'] .band-track {
  animation-name: marquee-ltr;
}

.band:hover .band-track {
  animation-play-state: paused;
}

.band-group {
  display: flex;
  align-items: center;
  gap: 36px;
  margin: 0;
  padding: 0 0 0 36px;
  list-style: none;
}

[dir='rtl'] .band-group {
  padding: 0 0 0 36px;
}

.band-item {
  display: flex;
  align-items: center;
  gap: 36px;
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 4.4vw, 3.4rem);
  line-height: 1;
  white-space: nowrap;
}

.band-item::after {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--point);
}

/* ==========================================================================
   Body map ("what hurts?")
   ========================================================================== */

.bodymap {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
  gap: clamp(32px, 5vw, 80px);
  align-items: center;
}

.bodymap-figure {
  position: relative;
  margin: 0;
  padding: clamp(12px, 2vw, 28px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: center;
}

.bodymap-figure svg {
  width: 100%;
  height: auto;
  max-height: 640px;
  margin-inline: auto;
}

.bodymap-figure figcaption {
  position: absolute;
  inset-inline-start: 20px;
  bottom: 16px;
  margin: 0;
}

.fig-body {
  fill: var(--surface);
  stroke: var(--ink-2);
  stroke-width: 1.3;
  stroke-linejoin: round;
}

.fig-detail {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.1;
  stroke-linecap: round;
}

.fig-spine {
  fill: none;
  stroke: var(--ink-2);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-dasharray: 0.1 9;
  opacity: 0.55;
}

.pt {
  cursor: pointer;
}

.pt .core {
  fill: var(--surface);
  stroke: var(--ink-2);
  stroke-width: 1.4;
  transition: fill 0.2s, stroke 0.2s;
}

.pt .halo {
  fill: var(--point);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.pt:hover .core {
  fill: var(--point-soft);
  stroke: var(--point);
}

.pt.is-active .core {
  fill: var(--point);
  stroke: var(--point);
}

.pt.is-active .halo {
  animation: halo 1.9s ease-out infinite;
}

.annot line {
  stroke: var(--point);
  stroke-width: 1;
}

.annot circle {
  fill: var(--point);
}

.annot text {
  fill: var(--ink);
  font-family: var(--font-label);
  font-size: 14px;
  font-weight: 500;
}

.zones {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 32px;
}

.zone {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 10px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: start;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
}

.zone::before {
  content: '';
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-2);
  transition: background-color 0.2s, border-color 0.2s;
}

.zone:hover {
  border-color: var(--ink);
}

.zone[aria-pressed='true'] {
  border-color: var(--ink);
  background: var(--surface);
}

.zone[aria-pressed='true']::before {
  background: var(--point);
  border-color: var(--point);
}

.match {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 8px 24px;
  align-items: start;
  padding-top: 28px;
  border-top: 1px solid var(--ink);
}

.match-img {
  grid-row: span 4;
  width: 112px;
  height: 112px;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: var(--photo-bg);
}

.match-label {
  margin: 0;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.match-name {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 5vw, 3.6rem);
  line-height: 0.9;
}

.match-desc {
  margin: 4px 0 0;
  color: var(--ink-2);
}

.match-note {
  margin: 0 0 12px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.match .btn {
  grid-column: 2;
  justify-self: start;
}

@media (max-width: 900px) {
  .bodymap {
    grid-template-columns: 1fr;
  }

  .bodymap-figure svg {
    max-height: 460px;
  }
}

@media (max-width: 520px) {
  .match {
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 6px 16px;
  }

  .match-img {
    width: 76px;
    height: 76px;
    grid-row: span 2;
  }

  .match .btn,
  .match-desc,
  .match-note {
    grid-column: 1 / -1;
  }
}

/* ==========================================================================
   Treatments
   ========================================================================== */

.treatments {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--ink);
}

.treatment {
  display: grid;
  grid-template-columns: 56px clamp(120px, 14vw, 176px) minmax(0, 1fr) auto;
  gap: clamp(20px, 3vw, 40px);
  align-items: center;
  padding-block: clamp(24px, 3.5vw, 40px);
  border-bottom: 1px solid var(--line);
}

.treatment-num {
  align-self: start;
  padding-top: 8px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.treatment-img {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
  background: var(--photo-bg);
}

.treatment-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.treatment:hover .treatment-img img {
  transform: scale(1.06);
}

.treatment-name {
  margin-bottom: 12px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 5vw, 4rem);
  line-height: 0.88;
}

.treatment-desc {
  max-width: 62ch;
  margin-bottom: 16px;
  color: var(--ink-2);
}

.treatment-side {
  display: grid;
  justify-items: end;
  gap: 16px;
  text-align: end;
}

.stat {
  display: grid;
  justify-items: end;
  line-height: 1;
}

.stat-value {
  font-family: var(--font-display);
  font-size: clamp(3.4rem, 6vw, 5rem);
  line-height: 0.8;
  color: var(--point-ink);
}

.stat-label {
  margin-top: 6px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tag {
  padding: 3px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  font-family: var(--font-label);
  font-size: 0.74rem;
  color: var(--ink-2);
  white-space: nowrap;
}

.duration {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.duration svg {
  width: 15px;
  height: 15px;
}

.addons {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin: 28px 0 0;
  color: var(--muted);
  font-size: var(--fs-sm);
}

@media (max-width: 900px) {
  .treatment {
    grid-template-columns: 96px minmax(0, 1fr);
    gap: 14px 20px;
    align-items: start;
  }

  .treatment-num {
    display: none;
  }

  .treatment-side {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    text-align: start;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .stat-value {
    font-size: 2.6rem;
  }

  .stat-label {
    margin: 0;
  }

  .treatment-side .btn {
    margin-inline-start: auto;
  }
}

/* ==========================================================================
   About
   ========================================================================== */

.about {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
  gap: clamp(36px, 6vw, 96px);
  align-items: start;
}

.about-photo {
  position: relative;
  margin: 0;
}

.about-photo img {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: 999px 999px var(--radius-lg) var(--radius-lg);
  background: var(--photo-bg);
}

.about-text .section-title {
  margin-bottom: 28px;
}

.about-text p {
  max-width: 60ch;
  color: var(--ink-2);
}

.facts {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  margin: 36px 0 0;
  border-top: 1px solid var(--ink);
}

.facts dt,
.facts dd {
  margin: 0;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.facts dt {
  padding-inline-end: 32px;
  padding-top: 17px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.facts dd {
  font-weight: 500;
}

.quote {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 16px clamp(20px, 4vw, 48px);
  align-items: start;
  margin: clamp(56px, 8vw, 112px) 0 0;
  padding-top: clamp(32px, 4vw, 48px);
  border-top: 1px solid var(--line);
}

.quote .seal {
  width: clamp(56px, 7vw, 84px);
  transform: rotate(-6deg);
}

.quote blockquote {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 6.4vw, 5.2rem);
  line-height: 0.92;
}

.quote figcaption {
  grid-column: 2;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

@media (max-width: 900px) {
  .about {
    grid-template-columns: 1fr;
  }

  .about-photo {
    max-width: 420px;
  }
}

/* ==========================================================================
   Process ("like training")
   ========================================================================== */

.process-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 24px 48px;
  align-items: end;
  margin-bottom: clamp(48px, 7vw, 88px);
}

.process-title {
  font-family: var(--font-display);
  font-size: clamp(4.6rem, 13vw, 10rem);
  line-height: 0.82;
}

.steps {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 32px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.steps::before {
  content: '';
  position: absolute;
  top: 6px;
  inset-inline: 0;
  height: 1px;
  background: var(--line);
}

.step {
  position: relative;
}

.step-dots {
  display: flex;
  gap: 6px;
  height: 13px;
  margin-bottom: 28px;
}

.step-dots i {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--point);
  box-shadow: 0 0 0 5px var(--band-bg);
}

.step-num {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.step h3 {
  margin: 8px 0 14px;
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 4.5vw, 3.6rem);
  line-height: 0.9;
}

.step p {
  max-width: 34ch;
  margin: 0;
  color: var(--muted);
}

@media (max-width: 820px) {
  .process-head {
    grid-template-columns: 1fr;
  }

  .steps {
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .steps::before {
    display: none;
  }
}

/* ==========================================================================
   Gallery + lightbox
   ========================================================================== */

.gallery {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: clamp(150px, 19vw, 270px);
  gap: 12px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: var(--photo-bg);
  cursor: zoom-in;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.7s ease;
}

.gallery-item:hover img {
  transform: scale(1.04);
}

.gallery-item.is-big {
  grid-column: span 2;
  grid-row: span 2;
}

.gallery-item.is-wide {
  grid-column: span 2;
}

.gallery-item .cap {
  position: absolute;
  inset-inline-start: 10px;
  bottom: 10px;
  padding: 4px 9px;
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.7rem;
}

@media (max-width: 720px) {
  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 42vw;
    gap: 8px;
  }
}

.lightbox {
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: rgb(10 14 12 / 0.94);
  color: #eef1ea;
}

.lightbox::backdrop {
  background: rgb(10 14 12 / 0.6);
}

.lightbox-inner {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100%;
  padding: max(12px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
}

.lightbox-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
}

.lightbox figure {
  position: relative;
  min-height: 0;
  margin: 12px 0;
}

.lightbox img {
  position: absolute;
  inset: 0;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  margin: auto;
  border-radius: 8px;
}

.lightbox-nav {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.lightbox .icon-btn {
  border-color: rgb(238 241 234 / 0.35);
  color: #eef1ea;
}

.lightbox .icon-btn:hover {
  border-color: #eef1ea;
}

/* ==========================================================================
   Visit: address, hours, preparation
   ========================================================================== */

.visit {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--ink);
}

.visit-col {
  padding: 28px clamp(20px, 3vw, 40px) 8px;
  border-inline-start: 1px solid var(--line);
}

.visit-col:first-child {
  padding-inline-start: 0;
  border-inline-start: 0;
}

.visit-h {
  margin-bottom: 20px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.visit-address {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: clamp(3rem, 5vw, 4.2rem);
  line-height: 0.88;
}

.visit-sub {
  margin-bottom: 24px;
  color: var(--ink-2);
}

.visit-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hours-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.hours-table th,
.hours-table td {
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-weight: 400;
  text-align: start;
}

.hours-table td {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  text-align: end;
}

.hours-table td span {
  direction: ltr;
  unicode-bidi: isolate;
}

.hours-table tr.is-today th,
.hours-table tr.is-today td {
  font-weight: 600;
  color: var(--ink);
}

.hours-table tr.is-today th::after {
  content: '';
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-inline-start: 8px;
  border-radius: 50%;
  background: var(--point);
  vertical-align: middle;
}

.hours-table .is-closed {
  color: var(--muted);
}

.visit .status {
  margin-top: 20px;
}

.prep {
  display: grid;
  gap: 18px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.prep li {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}

.prep-icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  color: var(--ink);
}

.prep-icon svg {
  width: 19px;
  height: 19px;
}

.prep strong {
  display: block;
  font-weight: 600;
}

.prep span {
  font-size: var(--fs-sm);
  color: var(--ink-2);
}

@media (max-width: 960px) {
  .visit {
    grid-template-columns: 1fr;
  }

  .visit-col {
    padding-inline: 0;
    padding-bottom: 28px;
    border-inline-start: 0;
    border-bottom: 1px solid var(--line);
  }

  .visit-col:last-child {
    border-bottom: 0;
  }
}

/* ==========================================================================
   FAQ
   ========================================================================== */

.faq-wrap {
  display: grid;
  grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.25fr);
  gap: 32px clamp(32px, 6vw, 96px);
  align-items: start;
}

.faq {
  border-top: 1px solid var(--ink);
}

.faq details {
  border-bottom: 1px solid var(--line);
}

.faq summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 22px 0;
  font-size: var(--fs-md);
  font-weight: 500;
  cursor: pointer;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: '';
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background:
    linear-gradient(var(--ink), var(--ink)) center / 11px 1.5px no-repeat,
    linear-gradient(var(--ink), var(--ink)) center / 1.5px 11px no-repeat;
  transition: transform 0.25s ease, background-color 0.25s;
}

.faq details[open] summary::after {
  transform: rotate(45deg);
}

.faq details p {
  max-width: 62ch;
  margin: 0;
  padding: 0 0 24px;
  color: var(--ink-2);
}

@media (max-width: 820px) {
  .faq-wrap {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Final call to action + contact
   ========================================================================== */

.final {
  position: relative;
  overflow: hidden;
  padding-block: var(--section);
  background: var(--band-bg);
  color: var(--band-ink);
}

.final .kicker {
  color: var(--band-muted);
}

.final::before {
  content: '';
  position: absolute;
  width: 560px;
  aspect-ratio: 1;
  inset-inline-start: -180px;
  bottom: -260px;
  border-radius: 50%;
  border: 1px solid var(--band-line);
  box-shadow: 0 0 0 60px rgb(255 255 255 / 0.02), 0 0 0 120px rgb(255 255 255 / 0.015);
  pointer-events: none;
}

.final-grid {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr);
  gap: 48px clamp(32px, 6vw, 96px);
  align-items: center;
}

.final-title {
  margin-bottom: 24px;
  font-family: var(--font-display);
  font-size: clamp(4.2rem, 10vw, 8rem);
  line-height: 0.84;
}

.final-lead {
  max-width: 42ch;
  margin-bottom: 32px;
  font-size: var(--fs-md);
  color: var(--band-muted);
}

.final-links {
  display: grid;
  gap: 10px;
  margin: 40px 0 0;
  padding: 0;
  list-style: none;
}

.final-links li {
  display: flex;
  align-items: center;
  gap: 12px;
}

.final-links svg {
  width: 18px;
  height: 18px;
  color: var(--band-muted);
}

.final-links a {
  color: var(--band-ink);
  text-decoration: none;
  font-weight: 500;
}

.final-links a:hover {
  text-decoration: underline;
}

.contact-card {
  padding: clamp(24px, 3vw, 40px);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.contact-card h3 {
  margin-bottom: 6px;
  font-family: var(--font-display);
  font-size: 3rem;
  line-height: 0.9;
}

.contact-card .panel-sub {
  margin-bottom: 22px;
}

@media (max-width: 900px) {
  .final-grid {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Forms
   ========================================================================== */

.form {
  display: grid;
  gap: 18px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.form-row:has(> .field[hidden]) {
  grid-template-columns: 1fr;
}

@media (max-width: 560px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}

.field {
  display: grid;
  gap: 6px;
}

.field label {
  font-weight: 500;
  font-size: 0.94rem;
}

.field .optional {
  font-weight: 400;
  color: var(--muted);
  font-size: 0.85rem;
}

.input,
.field input,
.field textarea,
.field select {
  width: 100%;
  min-height: 50px;
  padding: 11px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field textarea {
  min-height: 120px;
  resize: vertical;
}

.input:focus,
.field input:focus,
.field textarea:focus,
.field select:focus {
  outline: none;
  border-color: var(--ink);
  box-shadow: 0 0 0 3px var(--point-soft);
}

.field.has-error input,
.field.has-error textarea {
  border-color: var(--danger);
}

.field-error {
  color: var(--danger);
  font-size: 0.85rem;
}

.field input[type='tel'],
.field input[type='email'] {
  direction: ltr;
}

[dir='rtl'] .field input[type='tel'],
[dir='rtl'] .field input[type='email'] {
  text-align: right;
}

.checkbox {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 0.92rem;
  color: var(--muted);
}

.checkbox input {
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 3px;
  accent-color: var(--pine);
}

.checkbox.has-error {
  color: var(--danger);
}

.hp-field {
  position: absolute;
  inset-inline-start: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.alert {
  margin: 0;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
}

.alert a {
  font-weight: 600;
}

.alert-success {
  background: var(--success-soft);
  color: var(--success);
}

.alert-error {
  background: var(--danger-soft);
  color: var(--danger);
}

.panel-sub {
  color: var(--muted);
}

/* ==========================================================================
   Footer, floating buttons, mobile action bar
   ========================================================================== */

.site-footer {
  padding-block: clamp(48px, 7vw, 88px) 28px;
  border-top: 1px solid var(--line);
  font-size: var(--fs-sm);
}

.footer-word {
  display: flex;
  align-items: flex-end;
  margin: 0 0 clamp(28px, 4vw, 48px);
  font-family: var(--font-display);
  font-size: clamp(5.6rem, 21vw, 17rem);
  line-height: 0.74;
  white-space: nowrap;
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
  padding-top: 28px;
  border-top: 1px solid var(--ink);
}

.footer-grid h4 {
  margin-bottom: 14px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.footer-grid ul {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.footer-grid a {
  text-decoration: none;
}

.footer-grid a:hover {
  text-decoration: underline;
}

.footer-grid p {
  margin-bottom: 8px;
}

.footer-bottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px 24px;
  margin-top: 48px;
  color: var(--muted);
}

.footer-bottom.compact {
  margin-top: 0;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.footer-links a {
  color: inherit;
}

@media (max-width: 720px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }

  .footer-grid > :last-child {
    grid-column: 1 / -1;
  }
}

.whatsapp-fab {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  inset-inline-end: 20px;
  z-index: 40;
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #25d366;
  color: #fff;
  box-shadow: 0 10px 28px -8px rgb(0 0 0 / 0.4);
  transition: transform 0.2s;
}

.whatsapp-fab:hover {
  transform: scale(1.06);
}

.whatsapp-fab svg {
  width: 30px;
  height: 30px;
}

.action-bar {
  display: none;
}

@media (max-width: 760px) {
  .whatsapp-fab {
    display: none;
  }

  .action-bar {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    z-index: 45;
    display: flex;
    gap: 8px;
    padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--header-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
  }

  .action-bar .btn {
    flex: 1;
  }

  .action-bar .icon-btn {
    width: 50px;
    height: 50px;
    border-radius: var(--radius-sm);
  }

  body {
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }

  body[data-route='book'] .action-bar .btn-primary {
    display: none;
  }

  body[data-route='book'] .action-bar {
    justify-content: flex-end;
  }
}

/* ==========================================================================
   Accessibility menu + dialogs
   ========================================================================== */

.a11y-panel {
  position: fixed;
  top: calc(var(--header-h) + 8px);
  inset-inline-end: var(--gutter);
  z-index: 60;
  width: min(340px, calc(100vw - 2 * var(--gutter)));
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.a11y-panel h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
}

.a11y-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.a11y-opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 0.85rem;
  line-height: 1.3;
  text-align: center;
  cursor: pointer;
}

.a11y-opt:hover {
  border-color: var(--ink);
}

.a11y-opt[aria-pressed='true'] {
  border-color: var(--pine);
  background: var(--sage);
}

.a11y-opt svg {
  width: 22px;
  height: 22px;
}

.a11y-opt .level {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--muted);
}

.a11y-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  font-size: 0.88rem;
}

.dialog {
  width: min(640px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.dialog::backdrop {
  background: rgb(10 14 12 / 0.55);
}

.dialog-inner {
  position: relative;
  padding: clamp(24px, 4vw, 36px);
}

.dialog h2 {
  margin-bottom: 18px;
  font-family: var(--font-display);
  font-size: 3rem;
  line-height: 0.9;
}

.dialog p {
  color: var(--ink-2);
}

.dialog-close {
  position: absolute;
  top: 16px;
  inset-inline-end: 16px;
}

/* ==========================================================================
   Booking page
   ========================================================================== */

.page-hero {
  padding-block: clamp(40px, 6vw, 80px) 28px;
}

.page-hero h1 {
  margin-bottom: 18px;
  font-family: var(--font-display);
  font-size: clamp(4.2rem, 11vw, 7.6rem);
  line-height: 0.84;
}

.page-hero .lead {
  max-width: 52ch;
  margin: 0;
  font-size: var(--fs-md);
  color: var(--ink-2);
}

.stepper {
  display: flex;
  margin: 0 0 28px;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
}

.stepper li {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: -1px;
  padding: 14px 0;
  border-top: 2px solid transparent;
  color: var(--muted);
  font-weight: 500;
}

.stepper .num {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}

.stepper li.is-active {
  border-top-color: var(--point);
  color: var(--ink);
}

.stepper li.is-done {
  border-top-color: var(--ink);
  color: var(--ink-2);
}

.booking-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 28px;
  align-items: start;
  padding-bottom: var(--section);
}

@media (max-width: 960px) {
  .booking-layout {
    grid-template-columns: 1fr;
  }
}

.panel {
  padding: clamp(20px, 3vw, 36px);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.panel h2 {
  margin-bottom: 10px;
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 5vw, 3.6rem);
  line-height: 0.9;
}

.service-options {
  display: grid;
  gap: 10px;
  margin-top: 24px;
}

.service-option {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 12px 16px 12px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: transparent;
  text-align: start;
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
}

[dir='rtl'] .service-option {
  padding: 12px 12px 12px 16px;
}

.service-option:hover {
  border-color: var(--ink);
}

.service-option[aria-pressed='true'] {
  border-color: var(--ink);
  background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--ink);
}

.service-thumb {
  flex: none;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--photo-bg);
}

.service-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.service-option strong {
  display: block;
  margin-bottom: 2px;
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 400;
  line-height: 1;
}

.service-option .service-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.chip svg {
  width: 14px;
  height: 14px;
}

.chip-accent {
  color: var(--point-ink);
}

.service-option .check-mark {
  margin-inline-start: auto;
  width: 22px;
  height: 22px;
  flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
}

.service-option[aria-pressed='true'] .check-mark {
  border-color: var(--point);
  background: radial-gradient(circle, var(--point) 0 5px, transparent 5.5px);
}

.panel-actions {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.panel-actions .btn-primary {
  margin-inline-start: auto;
}

.schedule-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 32px;
  margin-top: 24px;
}

@media (max-width: 760px) {
  .schedule-grid {
    grid-template-columns: 1fr;
  }
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.calendar-head h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2.2rem;
  line-height: 1;
}

.calendar-head .icon-btn {
  width: 38px;
  height: 38px;
}

.calendar-head .icon-btn[disabled] {
  opacity: 0.35;
  cursor: default;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}

.calendar-grid .dow {
  padding-block: 6px;
  font-family: var(--font-label);
  font-size: 0.72rem;
  color: var(--muted);
}

.day {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-height: 38px;
  border: 1px solid transparent;
  border-radius: 50%;
  background: none;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--muted);
  opacity: 0.45;
  cursor: default;
}

.day.is-available {
  opacity: 1;
  color: var(--ink);
  cursor: pointer;
}

.day.is-available::after {
  content: '';
  position: absolute;
  bottom: 14%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--point);
}

.day.is-available:hover {
  border-color: var(--ink);
}

.day.is-today {
  border-color: var(--line-strong);
}

.day[aria-pressed='true'] {
  background: var(--ink);
  color: var(--paper);
}

.day[aria-pressed='true']::after {
  background: var(--point);
}

.calendar-grid.is-loading {
  opacity: 0.5;
  pointer-events: none;
}

.slots-head {
  margin-bottom: 4px;
  font-size: 1.05rem;
  font-weight: 600;
}

.slots-note {
  margin-bottom: 14px;
  font-family: var(--font-label);
  font-size: var(--fs-xs);
  color: var(--muted);
}

.slots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
}

.slot {
  min-height: 44px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: transparent;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  cursor: pointer;
  direction: ltr;
  transition: border-color 0.2s, background-color 0.2s;
}

.slot:hover {
  border-color: var(--ink);
}

.slot[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.empty-state {
  margin: 0;
  padding: 28px 16px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  text-align: center;
  color: var(--muted);
  font-size: 0.95rem;
}

.summary {
  position: sticky;
  top: calc(var(--header-h) + 20px);
}

.summary h3 {
  margin-bottom: 16px;
  font-family: var(--font-display);
  font-size: 2.4rem;
  line-height: 1;
}

.summary dl {
  display: grid;
  margin: 0;
  border-top: 1px solid var(--ink);
}

.summary dt {
  padding-top: 12px;
  font-family: var(--font-label);
  font-size: 0.72rem;
  color: var(--muted);
}

.summary dd {
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}

.summary .placeholder {
  color: var(--muted);
  font-weight: 400;
}

}

}

/* ==========================================================================
   Motion
   ========================================================================== */

html.js .reveal:not(.is-visible) {
  opacity: 0;
  transform: translateY(18px);
}

.reveal {
  transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
}

@keyframes draw {
  to {
    stroke-dashoffset: 0;
  }
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.2);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes halo {
  0% {
    opacity: 0.5;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(3.2);
  }
}

@keyframes ping {
  0% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--open) 55%, transparent);
  }

  100% {
    box-shadow: 0 0 0 9px transparent;
  }
}

@keyframes marquee {
  to {
    transform: translateX(33.3333%);
  }
}

@keyframes marquee-ltr {
  to {
    transform: translateX(-33.3333%);
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .band-track {
    animation: none;
  }

  html.js .reveal:not(.is-visible) {
    opacity: 1;
    transform: none;
  }
}

html.a11y-still .meridian {
  stroke-dashoffset: 0;
}

html.a11y-still .meridian-points circle {
  opacity: 1;
}

html.a11y-still .band-track {
  transform: none;
}

   Admin
   ========================================================================== */

// Date helpers. All booking dates/times are stored as local wall-clock values
// ("YYYY-MM-DD" + "HH:MM") in the practice's time zone, which keeps slot math
// simple and immune to the server's own time zone.

const DAY_MS = 86_400_000;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

function isValidDate(s) {
  if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
  return new Date(parseDate(s)).toISOString().slice(0, 10) === s;
}

function isValidTime(s) {
  return typeof s === 'string' && TIME_RE.test(s);
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function dayIndex(s) {
  return Math.floor(parseDate(s) / DAY_MS);
}

function addDays(s, n) {
  return new Date(parseDate(s) + n * DAY_MS).toISOString().slice(0, 10);
}

/** 0 = Sunday … 6 = Saturday */
function weekday(s) {
  return new Date(parseDate(s)).getUTCDay();
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function fromMinutes(min) {
  const h = String(Math.floor(min / 60)).padStart(2, '0');
  const m = String(min % 60).padStart(2, '0');
  return `${h}:${m}`;
}

/** Current wall-clock date and minute-of-day in the given IANA time zone. */
function nowInZone(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    date: `${get('year')}-${get('month')}-${get('day')}`,
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}


/**
 * Free start times ("HH:MM") for one day.
 *
 * @param {object} p
 * @param {string} p.date          "YYYY-MM-DD" in the practice's time zone
 * @param {number} p.duration      session length in minutes
 * @param {object} p.schedule      { weeklyHours, slotInterval, bufferMinutes, minNoticeHours, maxDaysAhead }
 * @param {{start:number,end:number}[]} [p.dayBookings]  existing bookings that day, in minutes
 * @param {boolean} [p.blocked]    whole day blocked (vacation, holiday…)
 * @param {{date:string,minutes:number}} p.now  current local date/time
 */
function slotsForDay({ date, duration, schedule, dayBookings = [], blocked = false, now }) {
  if (blocked) return [];

  const today = dayIndex(now.date);
  const day = dayIndex(date);
  if (day < today || day > today + schedule.maxDaysAhead) return [];

  const earliest = today * 1440 + now.minutes + schedule.minNoticeHours * 60;
  const buffer = schedule.bufferMinutes;
  const ranges = schedule.weeklyHours[String(weekday(date))] || [];
  const slots = [];

  for (const [from, to] of ranges) {
    const end = toMinutes(to);
    for (let t = toMinutes(from); t + duration <= end; t += schedule.slotInterval) {
      if (day * 1440 + t < earliest) continue;
      const clash = dayBookings.some((b) => t < b.end + buffer && b.start < t + duration + buffer);
      if (!clash) slots.push(fromMinutes(t));
    }
  }
  return slots;
}

const root = document.documentElement;
const listeners = new Set();

function storageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    /* private mode – ignore */
  }
}

// ---------------------------------------------------------------------------
// Language
// ---------------------------------------------------------------------------

function getLang() {
  return root.lang === 'en' ? 'en' : 'he';
}

function locale() {
  return getLang() === 'he' ? 'he-IL' : 'en-GB';
}

/** Look up "section.key" in the current language; `{name}` placeholders are filled from vars. */
function t(path, vars) {
  const lookup = (lang) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), dictionaries[lang]);
  let str = lookup(getLang()) ?? lookup('he') ?? path;
  if (vars) str = str.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
  return str;
}

/** Pick the current language out of a { he, en } object from the config. */
function pick(obj) {
  if (obj == null || typeof obj === 'string') return obj ?? '';
  return obj[getLang()] ?? obj.he ?? '';
}

function onLangChange(fn) {
  listeners.add(fn);
}

function setLang(lang) {
  root.lang = lang;
  root.dir = lang === 'he' ? 'rtl' : 'ltr';
  storageSet('lang', lang);
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) {
    url.searchParams.delete('lang');
    history.replaceState(null, '', url);
  }
  applyTranslations();
  listeners.forEach((fn) => fn(lang));
}

/**
 * Fill text from the dictionary:
 *   data-i18n="section.key"                     → textContent
 *   data-i18n-attr="placeholder:key;aria-label:key" → attributes
 */
function applyTranslations(scope = document) {
  for (const el of scope.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of scope.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':').map((s) => s.trim());
      if (attr && key) el.setAttribute(attr, t(key));
    }
  }

// ---------------------------------------------------------------------------
// Opening hours: "open now" / "opens tomorrow at…" from the weekly schedule
// ---------------------------------------------------------------------------

const hhmmToMinutes = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};

/** Day of week (0 = Sunday) and minute of the day in the clinic's time zone. */
function clinicNow(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone,
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(get('weekday')),
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}

function dayName(day, style = 'long') {
  return new Intl.DateTimeFormat(locale(), { weekday: style, timeZone: 'UTC' }).format(new Date(Date.UTC(2023, 0, 1 + day)));
}

function clinicStatus(cfg = siteConfig, at = new Date()) {
  if (!cfg?.hours) return null;
  const now = clinicNow(cfg.timezone, at);
  for (const [from, to] of cfg.hours[now.day] || []) {
    if (now.minutes >= hhmmToMinutes(from) && now.minutes < hhmmToMinutes(to)) return { open: true, until: to, today: now.day };
  }
  for (let offset = 0; offset < 8; offset++) {
    const day = (now.day + offset) % 7;
    for (const [from] of cfg.hours[day] || []) {
      if (offset > 0 || hhmmToMinutes(from) > now.minutes) return { open: false, day, offset, at: from, today: now.day };
    }
  }
  return { open: false, today: now.day };
}

function renderStatus() {
  const s = clinicStatus();
  if (!s) return;
  const text = s.open
    ? t('status.open', { time: s.until })
    : s.at == null
      ? ''
      : s.offset === 0
        ? t('status.today', { time: s.at })
        : s.offset === 1
          ? t('status.tomorrow', { time: s.at })
          : t('status.later', { day: dayName(s.day), time: s.at });
  for (const node of document.querySelectorAll('[data-status]')) {
    node.textContent = text;
    node.classList.toggle('is-open', s.open);
    node.hidden = !text;
  }
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v; // only ever used with trusted icon markup
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c);
  return node;
}

async function serverApi(url, { method = 'GET', body } = {}) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/** Mark invalid fields in a form. `fields` are server field names. */
function showFieldErrors(form, fields = []) {
  for (const f of form.querySelectorAll('.has-error')) f.classList.remove('has-error');
  for (const e of form.querySelectorAll('.field-error')) e.remove();
  let first = null;
  for (const name of new Set(fields)) {
    const input = form.elements[name];
    if (!input) continue;
    const wrap = input.closest('.field, .checkbox');
    wrap?.classList.add('has-error');
    input.setAttribute('aria-invalid', 'true');
    if (wrap?.classList.contains('field')) {
      const id = `${input.id}-error`;
      wrap.append(el('span', { class: 'field-error', id, role: 'alert' }, t(`errors.${name}`)));
      input.setAttribute('aria-describedby', id);
    }
    first ??= input;
  }
  first?.focus();
}

function clearFieldErrors(form) {
  showFieldErrors(form, []);
  for (const i of form.querySelectorAll('[aria-invalid]')) {
    i.removeAttribute('aria-invalid');
    i.removeAttribute('aria-describedby');
  }
}

function toast(message) {
  const node = el('div', { class: 'toast', role: 'status' }, message);
  document.body.append(node);
  setTimeout(() => node.remove(), 2600);
}

// Underline the nav link of the section on screen.
function initScrollSpy() {
  const links = [...document.querySelectorAll('.main-nav a[href^="#"]')];
  if (!links.length || !('IntersectionObserver' in window)) return;
  const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (e.isIntersecting) links.forEach((l) => l.classList.toggle('is-current', l === byId.get(e.target.id)));
      }
    },
    { rootMargin: '-45% 0px -50% 0px' },
  );
  for (const id of byId.keys()) {
    const section = document.getElementById(id);
    if (section) io.observe(section);
  }
}

function initReveal() {
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    items.forEach((i) => i.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          io.unobserve(e.target);
        }
      }
    },
    { rootMargin: '0px 0px -8% 0px' },
  );
  items.forEach((i) => io.observe(i));
}
