  <meta charset="utf-8">

  <title>דוד נאמן</title>

  <meta name="theme-color" content="#4f6b55">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>(function () {
  var r = document.documentElement, th = null;
  try { th = localStorage.getItem('theme'); } catch (e) {}
  if (th !== 'light' && th !== 'dark') th = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', th);
  r.lang = 'he';
  r.dir = 'rtl';
})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
/* ==========================================================================
   Design tokens
   ========================================================================== */

:root {
  --bg: #faf7f2;
  --bg-alt: #f3eee6;
  --surface: #ffffff;
  --surface-2: #f6f2ec;
  --text: #2b2a28;
  --muted: #6b665e;
  --border: #e6dfd4;
  --primary: #4f6b55;
  --primary-hover: #435c49;
  --primary-soft: #e3ebe3;
  --on-primary: #ffffff;
  --accent: #b57a4c;
  --accent-soft: #f4e6da;
  --danger: #b0413e;
  --danger-soft: #f8e3e2;
  --success: #3f7a52;
  --success-soft: #e1f0e5;
  --photo-a: #c9d6c6;
  --photo-b: #ecd9c6;
  --shadow-sm: 0 1px 2px rgb(43 42 40 / 0.06), 0 1px 3px rgb(43 42 40 / 0.05);
  --shadow: 0 10px 30px -12px rgb(43 42 40 / 0.18);
  --header-bg: rgb(250 247 242 / 0.82);

  --font-body: 'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-display: 'Frank Ruhl Libre', Georgia, 'Times New Roman', serif;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 28px;
  --container: 1160px;
  --gutter: 16px;
  --header-h: 72px;
  color-scheme: light;
}

:root[data-theme='dark'] {
  --bg: #141715;
  --bg-alt: #1a1e1b;
  --surface: #1f2420;
  --surface-2: #262c28;
  --text: #ece8e1;
  --muted: #a8a399;
  --border: #343b36;
  --primary: #93b598;
  --primary-hover: #a8c7ad;
  --primary-soft: #2a3a2e;
  --on-primary: #10160f;
  --accent: #dba77d;
  --accent-soft: #3a2e24;
  --danger: #e38582;
  --danger-soft: #3d2322;
  --success: #86c59a;
  --success-soft: #1f3526;
  --photo-a: #2f3d31;
  --photo-b: #4a3a2d;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow: 0 12px 34px -12px rgb(0 0 0 / 0.55);
  --header-bg: rgb(20 23 21 / 0.82);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #141715;
    --surface: #1f2420;
    --text: #ece8e1;
    --muted: #a8a399;
    --border: #343b36;
    color-scheme: dark;
  }
}

@media (min-width: 720px) {
  :root {
    --gutter: 24px;
  }
}

/* ==========================================================================
   Base
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 12px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  font-weight: 500;
  line-height: 1.2;
  margin: 0 0 0.5em;
  letter-spacing: -0.01em;
}

p {
  margin: 0 0 1em;
}

a {
  color: var(--primary);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

img,
svg {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}

::selection {
  background: var(--primary-soft);
}

[hidden] {
  display: none !important;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  inset-inline-start: 12px;
  top: -60px;
  z-index: 100;
  background: var(--primary);
  color: var(--on-primary);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  transition: top 0.2s;
}

.skip-link:focus {
  top: 12px;
}

.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* RTL-aware directional icons */
[dir='rtl'] .flip-rtl {
  transform: scaleX(-1);
}

/* ==========================================================================
   Buttons
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  min-height: 46px;
  padding: 0.6em 1.4em;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
  white-space: nowrap;
}

.btn:active {
  transform: translateY(1px);
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
}

.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.btn-ghost {
  background: transparent;
  color: var(--text);
  padding-inline: 0.8em;
}

.btn-ghost:hover {
  background: var(--surface-2);
}

.btn-danger {
  background: transparent;
  border-color: var(--border);
  color: var(--danger);
}

.btn-danger:hover {
  background: var(--danger-soft);
  border-color: var(--danger);
}

.btn-sm {
  min-height: 36px;
  padding: 0.35em 0.95em;
  font-size: 0.9rem;
}

.btn-block {
  width: 100%;
}

.btn[disabled] {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}

.icon-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

/* ==========================================================================
   Header
   ========================================================================== */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--header-h);
  background: var(--header-bg);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.site-header.is-scrolled {
  border-bottom-color: var(--border);
  box-shadow: var(--shadow-sm);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 100%;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  min-width: 0;
}

.brand-mark {
  flex: none;
  width: 40px;
  height: 40px;
  color: var(--primary);
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 500;
  white-space: nowrap;
}

.brand-tagline {
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.main-nav {
  margin-inline-start: auto;
}

.main-nav ul {
  display: flex;
  gap: 4px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.main-nav a {
  display: block;
  padding: 8px 12px;
  border-radius: 999px;
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color 0.2s, color 0.2s;
}

.main-nav a:hover,
.main-nav a[aria-current='page'] {
  color: var(--primary);
  background: var(--primary-soft);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lang-btn {
  width: auto;
  padding-inline: 14px;
  font-weight: 600;
  font-size: 0.9rem;
}

.nav-toggle {
  display: none;
}

@media (max-width: 1140px) {
  .nav-toggle {
    display: inline-grid;
  }

  .main-nav {
    position: fixed;
    inset: var(--header-h) 0 auto 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 12px var(--gutter) 20px;
    transform: translateY(-8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
  }

  .main-nav.is-open {
    transform: none;
    opacity: 1;
    visibility: visible;
  }

  .main-nav ul {
    flex-direction: column;
  }

  .main-nav a {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
  }

  .header-actions {
    margin-inline-start: auto;
  }
}

@media (max-width: 560px) {
  .brand-tagline,
  .header-cta {
    display: none;
  }

  .brand-name {
    font-size: 1.15rem;
  }
}

/* ==========================================================================
   Sections
   ========================================================================== */

.section {
  padding-block: 88px;
}

.section-alt {
  background: var(--bg-alt);
}

@media (max-width: 720px) {
  .section {
    padding-block: 64px;
  }
}

.section-head {
  max-width: 640px;
  margin: 0 auto 48px;
  text-align: center;
}

.eyebrow {
  display: inline-block;
  margin-bottom: 12px;
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.section-title {
  font-size: clamp(2rem, 4vw, 2.75rem);
}

.lead {
  font-size: 1.15rem;
  color: var(--muted);
}

/* ---------- Photo placeholders ---------- */

.photo {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 25% 20%, rgb(255 255 255 / 0.35), transparent 45%),
    linear-gradient(150deg, var(--photo-a), var(--photo-b));
  color: var(--primary);
  display: grid;
  place-items: center;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-leaf {
  width: 42%;
  max-width: 180px;
  opacity: 0.5;
}

.photo-label {
  position: absolute;
  bottom: 16px;
  inset-inline: 0;
  text-align: center;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: var(--text);
  opacity: 0.55;
}

.photo-arch {
  border-radius: 999px 999px var(--radius-lg) var(--radius-lg);
  aspect-ratio: 4 / 5;
}

.photo-round {
  border-radius: var(--radius-lg);
  aspect-ratio: 1 / 1;
}

/* ---------- Hero ---------- */

.hero {
  position: relative;
  padding-block: 64px 96px;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  width: 620px;
  height: 620px;
  inset-inline-end: -220px;
  top: -200px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--primary-soft), transparent 70%);
  pointer-events: none;
}

.hero-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 64px;
  align-items: center;
}

.hero h1 {
  font-size: clamp(2.4rem, 6vw, 4rem);
  margin-bottom: 20px;
}

.hero .lead {
  max-width: 540px;
  margin-bottom: 32px;
}

.hero-ctas {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.hero-points {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 28px;
  list-style: none;
  padding: 0;
  margin: 40px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.hero-points li {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-points svg {
  width: 18px;
  height: 18px;
  color: var(--primary);
}

.hero-visual {
  position: relative;
  max-width: 440px;
  justify-self: center;
  width: 100%;
}

.hero-badge {
  position: absolute;
  bottom: 40px;
  inset-inline-start: -32px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: 0.92rem;
  line-height: 1.35;
}

.hero-badge strong {
  display: block;
}

.hero-badge span {
  color: var(--muted);
}

.hero-badge .badge-icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--primary-soft);
  color: var(--primary);
}

.hero-badge .badge-icon svg {
  width: 20px;
  height: 20px;
}

@media (max-width: 900px) {
  .hero-grid {
    grid-template-columns: 1fr;
    gap: 48px;
  }

  .hero-visual {
    max-width: 360px;
  }

  .hero-badge {
    inset-inline-start: -8px;
  }
}

/* ---------- About ---------- */

.about-grid {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  gap: 64px;
  align-items: center;
}

.about-grid .section-title {
  margin-bottom: 20px;
}

.about-text p {
  color: var(--muted);
}

.about-quote {
  margin: 28px 0 0;
  padding-inline-start: 20px;
  border-inline-start: 3px solid var(--accent);
  font-family: var(--font-display);
  font-size: 1.3rem;
  line-height: 1.5;
}

@media (max-width: 900px) {
  .about-grid {
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .about-grid .photo {
    max-width: 420px;
  }
}

/* ---------- Cards / services ---------- */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  display: flex;
  flex-direction: column;
  padding: 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}

.service-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: transparent;
}

.card-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-bottom: 20px;
  border-radius: 14px;
  background: var(--primary-soft);
  color: var(--primary);
}

.card-icon svg {
  width: 26px;
  height: 26px;
}

.card h3 {
  font-size: 1.4rem;
}

.card p {
  color: var(--muted);
  flex: 1;
}

.service-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 20px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--muted);
}

.chip svg {
  width: 14px;
  height: 14px;
}

.chip-accent {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
  font-weight: 600;
}

/* ---------- Steps ---------- */

.steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  counter-reset: step;
  list-style: none;
  padding: 0;
  margin: 0;
}

.step {
  position: relative;
  padding: 32px 28px 28px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}

.step::before {
  counter-increment: step;
  content: '0' counter(step);
  display: block;
  margin-bottom: 12px;
  font-family: var(--font-display);
  font-size: 2.4rem;
  line-height: 1;
  color: var(--accent);
}

.step h3 {
  font-size: 1.3rem;
}

.step p {
  color: var(--muted);
  margin: 0;
}

/* ---------- Testimonials ---------- */

.quote-card {
  position: relative;
  margin: 0;
}

.quote-card::before {
  content: '”';
  position: absolute;
  top: 8px;
  inset-inline-end: 24px;
  font-family: var(--font-display);
  font-size: 5rem;
  line-height: 1;
  color: var(--primary-soft);
}

.quote-card blockquote {
  margin: 0 0 20px;
  font-size: 1.05rem;
  color: var(--text);
  flex: 1;
}

.quote-card figcaption {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
}

.avatar {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(150deg, var(--photo-a), var(--photo-b));
  color: var(--text);
  font-family: var(--font-display);
}

.quote-card figcaption span {
  display: block;
  font-weight: 400;
  font-size: 0.85rem;
  color: var(--muted);
}

/* ---------- FAQ ---------- */

.faq {
  max-width: 780px;
  margin-inline: auto;
  display: grid;
  gap: 12px;
}

.faq details {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.2s;
}

.faq details[open] {
  border-color: var(--primary);
}

.faq summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  font-weight: 600;
  font-size: 1.08rem;
  cursor: pointer;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: '+';
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 1.2rem;
  transition: transform 0.2s;
}

.faq details[open] summary::after {
  transform: rotate(45deg);
}

.faq details p {
  padding: 0 24px 20px;
  margin: 0;
  color: var(--muted);
}

/* ---------- CTA band ---------- */

.cta-band {
  padding: 56px 40px;
  border-radius: var(--radius-lg);
  background: var(--primary);
  color: var(--on-primary);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.cta-band::after {
  content: '';
  position: absolute;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  inset-inline-start: -120px;
  bottom: -200px;
  background: rgb(255 255 255 / 0.08);
}

.cta-band h2 {
  font-size: clamp(1.8rem, 4vw, 2.4rem);
}

.cta-band p {
  opacity: 0.85;
  max-width: 520px;
  margin: 0 auto 28px;
}

.cta-band .btn {
  background: var(--on-primary);
  color: var(--primary);
  position: relative;
  z-index: 1;
}

.cta-band .btn:hover {
  opacity: 0.92;
}

@media (max-width: 560px) {
  .cta-band {
    padding: 44px 22px;
  }
}

/* ---------- Contact ---------- */

.contact-grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 40px;
  align-items: start;
}

.contact-list {
  list-style: none;
  padding: 0;
  margin: 28px 0 0;
  display: grid;
  gap: 16px;
}

.contact-list li {
  display: flex;
  align-items: center;
  gap: 14px;
}

.contact-list .card-icon {
  margin: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
}

.contact-list .card-icon svg {
  width: 20px;
  height: 20px;
}

.contact-list small {
  display: block;

.day.is-available {
  opacity: 1;

.day.is-available::after {

// Date helpers. All booking dates/times are stored as local wall-clock values
// ("YYYY-MM-DD" + "HH:MM") in the practice's time zone, which keeps slot math
// simple and immune to the server's own time zone.

const DAY_MS = 86_400_000;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

function isValidDate(s) {
  if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
  return new Date(parseDate(s)).toISOString().slice(0, 10) === s;
}

function isValidTime(s) {
  return typeof s === 'string' && TIME_RE.test(s);
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function dayIndex(s) {
  return Math.floor(parseDate(s) / DAY_MS);
}

function addDays(s, n) {
  return new Date(parseDate(s) + n * DAY_MS).toISOString().slice(0, 10);
}

/** 0 = Sunday … 6 = Saturday */
function weekday(s) {
  return new Date(parseDate(s)).getUTCDay();
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function fromMinutes(min) {
  const h = String(Math.floor(min / 60)).padStart(2, '0');
  const m = String(min % 60).padStart(2, '0');
  return `${h}:${m}`;
}

/** Current wall-clock date and minute-of-day in the given IANA time zone. */
function nowInZone(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    date: `${get('year')}-${get('month')}-${get('day')}`,
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}


/**
 * Free start times ("HH:MM") for one day.
 *
 * @param {object} p
 * @param {string} p.date          "YYYY-MM-DD" in the practice's time zone
 * @param {number} p.duration      session length in minutes
 * @param {object} p.schedule      { weeklyHours, slotInterval, bufferMinutes, minNoticeHours, maxDaysAhead }
 * @param {{start:number,end:number}[]} [p.dayBookings]  existing bookings that day, in minutes
 * @param {boolean} [p.blocked]    whole day blocked (vacation, holiday…)
 * @param {{date:string,minutes:number}} p.now  current local date/time
 */
function slotsForDay({ date, duration, schedule, dayBookings = [], blocked = false, now }) {
  if (blocked) return [];

  const today = dayIndex(now.date);
  const day = dayIndex(date);
  if (day < today || day > today + schedule.maxDaysAhead) return [];

  const earliest = today * 1440 + now.minutes + schedule.minNoticeHours * 60;
  const buffer = schedule.bufferMinutes;
  const ranges = schedule.weeklyHours[String(weekday(date))] || [];
  const slots = [];

  for (const [from, to] of ranges) {
    const end = toMinutes(to);
    for (let t = toMinutes(from); t + duration <= end; t += schedule.slotInterval) {
      if (day * 1440 + t < earliest) continue;
      const clash = dayBookings.some((b) => t < b.end + buffer && b.start < t + duration + buffer);
      if (!clash) slots.push(fromMinutes(t));
    }
  }
  return slots;
}

const root = document.documentElement;
const listeners = new Set();

function storageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    /* private mode – ignore */
  }
}

// ---------------------------------------------------------------------------

function getLang() {
  return root.lang === 'en' ? 'en' : 'he';
}

function locale() {
  return getLang() === 'he' ? 'he-IL' : 'en-GB';
}

/** Look up "section.key" in the current language; `{name}` placeholders are filled from vars. */
function t(path, vars) {
  const lookup = (lang) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), dictionaries[lang]);
  let str = lookup(getLang()) ?? lookup('he') ?? path;
  if (vars) str = str.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
  return str;
}

/** Pick the current language out of a { he, en } object from the config. */
function pick(obj) {
  if (obj == null || typeof obj === 'string') return obj ?? '';
  return obj[getLang()] ?? obj.he ?? '';
}

function onLangChange(fn) {
  listeners.add(fn);
}

function setLang(lang) {
  root.lang = lang;
  root.dir = lang === 'he' ? 'rtl' : 'ltr';
  storageSet('lang', lang);
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) {
    url.searchParams.delete('lang');
    history.replaceState(null, '', url);
  }
  applyTranslations();
  listeners.forEach((fn) => fn(lang));
}

/**
 * Fill text from the dictionary:
 *   data-i18n="section.key"                     → textContent
 *   data-i18n-attr="placeholder:key;aria-label:key" → attributes
 */
function applyTranslations(scope = document) {
  for (const el of scope.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of scope.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':').map((s) => s.trim());
      if (attr && key) el.setAttribute(attr, t(key));
    }
  }
  const titleKey = document.body.dataset.titleKey;
  if (titleKey && siteConfig) document.title = `${t(titleKey)} | ${pick(siteConfig.business.name)}`;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.content = t('meta.description');
  updateToggles();
  renderBusiness();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v; // only ever used with trusted icon markup
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c);
  return node;
}

async function serverApi(url, { method = 'GET', body } = {}) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/** Mark invalid fields in a form. `fields` are server field names. */
function showFieldErrors(form, fields = []) {
  for (const f of form.querySelectorAll('.has-error')) f.classList.remove('has-error');
  for (const e of form.querySelectorAll('.field-error')) e.remove();
  let first = null;
  for (const name of new Set(fields)) {
    const input = form.elements[name];
    if (!input) continue;
    const wrap = input.closest('.field, .checkbox');
    wrap?.classList.add('has-error');
    input.setAttribute('aria-invalid', 'true');
    if (wrap?.classList.contains('field')) {
      const id = `${input.id}-error`;
      wrap.append(el('span', { class: 'field-error', id, role: 'alert' }, t(`errors.${name}`)));
      input.setAttribute('aria-describedby', id);
    }
    first ??= input;
  }
  first?.focus();
}

function clearFieldErrors(form) {
  showFieldErrors(form, []);
  for (const i of form.querySelectorAll('[aria-invalid]')) {
    i.removeAttribute('aria-invalid');
    i.removeAttribute('aria-describedby');
  }
}

function toast(message) {
  const node = el('div', { class: 'toast', role: 'status' }, message);
  document.body.append(node);
  setTimeout(() => node.remove(), 2600);
}

function initHeader() {
  const header = document.querySelector('.site-header');
  const nav = document.getElementById('main-nav');
  const toggle = document.getElementById('nav-toggle');

  if (header) {
    const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 8);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  if (nav && toggle) {
    const setOpen = (open) => {
      nav.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.innerHTML = svg(open ? 'close' : 'menu');
    };
    toggle.addEventListener('click', () => setOpen(!nav.classList.contains('is-open')));
    nav.addEventListener('click', (e) => e.target.closest('a') && setOpen(false));
    document.addEventListener('keydown', (e) => e.key === 'Escape' && setOpen(false));
  }

  document.getElementById('theme-toggle')?.addEventListener('click', () =>
    setTheme(getTheme() === 'dark' ? 'light' : 'dark'),
  );
  document.getElementById('lang-toggle')?.addEventListener('click', () =>
    setLang(getLang() === 'he' ? 'en' : 'he'),
  );
}

function initReveal() {
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    items.forEach((i) => i.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          io.unobserve(e.target);
        }
      }
    },
    { rootMargin: '0px 0px -8% 0px' },
  );
  items.forEach((i) => io.observe(i));
}

    state.time = null;
  }
  renderServices();
  renderSummary();
}

// ---------------------------------------------------------------------------
// Step 2 – calendar & slots
// ---------------------------------------------------------------------------

async function loadMonth() {
  const key = `${state.service.id}|${state.month}`;
  renderCalendar();
  if (!cache.has(key)) {
    state.loading = true;
    renderCalendar();
    try {
      const params = new URLSearchParams({ service: state.service.id, from: `${state.month}-01`, to: lastDay(state.month) });
      const { days } = await api(`/api/availability?${params}`);
      cache.set(key, days);
    } catch {
      setAlert('time-alert', 'error', t('common.error'));
    } finally {
      state.loading = false;
    }
  }
  // Pre-select the first open day of the month for a quicker flow.
  const days = cache.get(key) || {};
  const anyOpen = Object.values(days).some((s) => s.length);
  // Near the end of a month there may be no open days left: start on next month instead.
  if (!anyOpen && !state.autoAdvanced && cache.has(key) && state.month === monthOf(state.config.today) && shiftMonth(state.month, 1) <= monthOf(maxDate())) {
    state.autoAdvanced = true;
    state.month = shiftMonth(state.month, 1);
    return loadMonth();
  }
  if (!state.date || monthOf(state.date) !== state.month || !days[state.date]?.length) {
    const first = Object.keys(days).sort().find((d) => days[d].length);
    if (first) {
      state.date = first;
      state.time = null;
    }
  }
  renderCalendar();
  renderSlots();
  renderSummary();
}

function renderCalendar() {
  const cal = $('calendar');
  const days = cache.get(`${state.service?.id}|${state.month}`) || {};
  const start = utc(state.month);
  const offset = start.getUTCDay(); // weeks start on Sunday (Israeli calendar)
  const count = utc(lastDay(state.month)).getUTCDate();

  $('month-label').textContent = new Intl.DateTimeFormat(locale(), { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(start);
  $('prev-month').disabled = state.month <= monthOf(state.config.today);
  $('next-month').disabled = shiftMonth(state.month, 1) > monthOf(maxDate());
  cal.classList.toggle('is-loading', state.loading);

  const dowFmt = new Intl.DateTimeFormat(locale(), { weekday: 'short', timeZone: 'UTC' });
  const cells = [];
  for (let i = 0; i < 7; i++) {
    cells.push(el('span', { class: 'dow', 'aria-hidden': 'true' }, dowFmt.format(new Date(Date.UTC(2023, 0, 1 + i)))));
  }
  for (let i = 0; i < offset; i++) cells.push(el('span'));
  for (let d = 1; d <= count; d++) {
    const date = `${state.month}-${String(d).padStart(2, '0')}`;
    const open = (days[date] || []).length > 0;
    cells.push(
      el(
        'button',
        {
          type: 'button',
          class: ['day', open && 'is-available', date === state.config.today && 'is-today'].filter(Boolean).join(' '),
          disabled: !open,
          'aria-pressed': String(date === state.date),
          'aria-label': fmtDate(date),
          onclick: () => {
            state.date = date;
            state.time = null;
            renderCalendar();
            renderSlots();
            renderSummary();
          },
        },
        String(d),
      ),
    );
  }
  cal.replaceChildren(...cells);
}

function renderSlots() {
  const wrap = $('slots');
  const days = cache.get(`${state.service.id}|${state.month}`);
  const anyOpen = days && Object.values(days).some((s) => s.length);

  if (!state.date || monthOf(state.date) !== state.month) {
    $('slots-title').textContent = '';
    wrap.replaceChildren(
      el('p', { class: 'empty-state' }, state.loading ? t('common.loading') : t(days && !anyOpen ? 'book.noSlotsMonth' : 'book.pickDay')),
    );
  } else {
    const slots = days?.[state.date] || [];
    $('slots-title').textContent = t('book.slotsFor', { date: fmtDate(state.date) });
    wrap.replaceChildren(
      slots.length
        ? el(
            'div',
            { class: 'slots' },
            slots.map((time) =>
              el(
                'button',
                {
                  type: 'button',
                  class: 'slot',
                  'aria-pressed': String(time === state.time),
                  onclick: () => {
                    state.time = time;
                    renderSlots();
                    renderSummary();
                  },
                },
                time,
              ),
            ),
          )
        : el('p', { class: 'empty-state' }, t('book.noSlots')),
    );
  }
  $('to-step-3').disabled = !(state.date && state.time);
}

// ---------------------------------------------------------------------------
// Summary
// ---------------------------------------------------------------------------

function renderSummary() {
  const s = state.service;
  const rows = [
    ['book.service', s && pick(s.name)],
    ['book.date', state.date && fmtDate(state.date)],
    ['book.time', state.time],
    ['book.duration', s && t('common.minutes', { n: s.duration })],
    s?.price != null && ['book.price', formatPrice(s.price)],
  ].filter(Boolean);
  $('summary').replaceChildren(
    ...rows.flatMap(([label, value]) => [
      el('dt', {}, t(label)),
      el('dd', {}, value ? el('bdi', {}, value) : el('span', { class: 'placeholder' }, t('book.notChosen'))),
    ]),
  );
}

// ---------------------------------------------------------------------------
// Step 3 – details & submit
// ---------------------------------------------------------------------------

function setAlert(id, kind, message) {
  $(id).replaceChildren(message ? el('p', { class: `alert alert-${kind}` }, message) : '');
}

// On a static host (GitHub Pages) there's no server: the request is sent to the
// practitioner on WhatsApp instead, and they confirm the time with the client.
const viaWhatsApp = () => state.config?.handoff === 'whatsapp';

function whatsappMessage(data) {
  const lines = [
    t('book.waIntro', { name: data.name.trim() }),
    `${t('book.service')}: ${pick(state.service.name)}`,
    `${t('book.date')}: ${fmtDate(state.date)}`,
    `${t('book.time')}: ${state.time}`,
    `${t('contact.formPhone')}: ${data.phone.trim()}`,
  ];
  if (data.notes?.trim()) lines.push(`${t('book.waNotes')}: ${data.notes.trim()}`);
  return lines.join('\n');
}

function handOffToWhatsApp(data) {
  const href = `https://wa.me/${state.config.business.whatsapp}?text=${encodeURIComponent(whatsappMessage(data))}`;
  window.open(href, '_blank', 'noopener');
  const booking = { date: state.date, time: state.time, duration: state.service.duration, name: data.name.trim() };
  showConfirmation(booking, false, href);
}

const PHONE_RE = /^\+?[\d\s\-()]{7,20}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

async function submit(e) {
  e.preventDefault();
  const form = $('details-form');
  const data = Object.fromEntries(new FormData(form));
  clearFieldErrors(form);
  setAlert('details-alert');

  const bad = [];
  if ((data.name || '').trim().length < 2) bad.push('name');
  if (!PHONE_RE.test((data.phone || '').trim())) bad.push('phone');
  if (data.email && !EMAIL_RE.test(data.email.trim())) bad.push('email');
  if (!data.consent) bad.push('consent');
  if (bad.length) return showFieldErrors(form, bad);
  if (viaWhatsApp()) return handOffToWhatsApp(data);

  const button = $('confirm-btn');
  button.disabled = true;
  button.textContent = t('book.confirming');
  try {
    const { booking } = await api('/api/bookings', {
      method: 'POST',
      body: {
        serviceId: state.service.id,
        date: state.date,
        time: state.time,
        name: data.name,
        phone: data.phone,
        email: data.email,
        notes: data.notes,
        consent: true,
        lang: getLang(),
      },
    });
    showConfirmation(booking, Boolean(data.email));
  } catch (err) {
    if (err.status === 409 || err.data?.fields?.some((f) => ['date', 'time', 'serviceId'].includes(f))) {
      cache.clear();
      state.time = null;
      goTo(2);
      setAlert('time-alert', 'error', t('book.slotTaken'));
    } else if (err.status === 400) {
      showFieldErrors(form, err.data.fields);
    } else {
      setAlert('details-alert', 'error', t(err.status === 429 ? 'errors.rate' : 'common.error'));
    }
  } finally {
    button.disabled = false;
    button.textContent = t(button.dataset.i18n);
  }
}

let confirmed = null;

function renderConfirmation() {
  if (!confirmed) return;
  const { booking, whatsappHref } = confirmed;
  const title = $('confirm-title');
  title.dataset.i18n = whatsappHref ? 'book.waTitle' : 'book.successTitle';
  title.textContent = t(title.dataset.i18n);
  $('confirm-text').textContent = whatsappHref ? t('book.waText') : t('book.successText', { name: booking.name });
  $('confirm-whatsapp').hidden = !whatsappHref;
  if (whatsappHref) $('confirm-whatsapp').href = whatsappHref;
  const rows = [
    booking.ref && ['book.ref', el('span', { class: 'ref' }, booking.ref)],
    ['book.service', pick(state.service.name)],
    ['book.date', fmtDate(booking.date)],
    ['book.time', el('bdi', {}, booking.time)],
    ['book.duration', t('common.minutes', { n: booking.duration })],
  ].filter(Boolean);
  $('confirm-details').replaceChildren(...rows.flatMap(([k, v]) => [el('dt', {}, t(k)), el('dd', {}, v)]));
}

function showConfirmation(booking, emailed, whatsappHref = null) {
  confirmed = { booking, whatsappHref };
  $('booking-flow').hidden = true;
  document.querySelector('.page-hero').hidden = true;
  $('confirmation').hidden = false;
  $('confirm-email').hidden = !emailed;
  renderConfirmation();
  window.scrollTo({ top: 0 });
  $('confirm-title').focus();
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

function renderAll() {
  if (!state.config) return;
  renderServices();
  if (state.service) {
    renderCalendar();
    renderSlots();
  }
  renderSummary();
  renderConfirmation();
}

$('to-step-2').addEventListener('click', () => {
  setAlert('time-alert');
  goTo(2);
});
$('to-step-3').addEventListener('click', () => goTo(3));
for (const b of document.querySelectorAll('[data-go]')) b.addEventListener('click', () => goTo(Number(b.dataset.go)));
$('prev-month').addEventListener('click', () => {
  state.month = shiftMonth(state.month, -1);
  loadMonth();
});
$('next-month').addEventListener('click', () => {
  state.month = shiftMonth(state.month, 1);
  loadMonth();
});
$('details-form').addEventListener('submit', submit);
onLangChange(renderAll);

loadConfig()
  .then((config) => {
    state.config = config;
    state.month = monthOf(config.today);
    if (viaWhatsApp()) {
      $('b-email').closest('.field').hidden = true;
      $('confirm-btn').dataset.i18n = 'book.confirmWhatsapp';
      $('confirm-btn').textContent = t('book.confirmWhatsapp');
    }
    const preset = config.services.find((s) => s.id === null);
    if (preset) state.service = preset;
    renderAll();
    goTo(preset ? 2 : 1, { focus: false });
  })
  .catch(() => {
    $('service-options').replaceChildren(el('p', { class: 'alert alert-error' }, t('common.error')));
  });

window.__bookPreset = (id) => {
  const s = state.config?.services.find((x) => x.id === id);
  if (s) {
    selectService(s);
    goTo(2, { focus: false });
  }
};
window.__bookReset = () => {
  confirmed = null;
  state.service = null;
  state.date = null;
  state.time = null;
  $('details-form').reset();
  $('booking-flow').hidden = false;
  document.querySelector('.page-hero').hidden = false;
  $('confirmation').hidden = true;
  renderAll();
  goTo(1, { focus: false });
};

}

// ---- Router: #book shows the booking page, anything else the home page ----
{
  const home = document.getElementById('page-home');
  const bookPage = document.getElementById('page-book');
  let pendingService = null;
  function route() {
    const h = location.hash.slice(1);
    const isBook = h === 'book';
    home.hidden = isBook;
    bookPage.hidden = !isBook;
    document.body.dataset.titleKey = isBook ? 'meta.bookTitle' : 'meta.homeTitle';
    applyTranslations();
    if (isBook) {
      window.scrollTo({ top: 0 });
      if (pendingService) {
        const id = pendingService;
        pendingService = null;
        loadConfig().then(() => window.__bookPreset(id));
      }
    } else if (h && h !== 'top' && h !== 'main') {
      document.getElementById(h)?.scrollIntoView();
    } else {
      window.scrollTo({ top: 0 });
    }
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href === '#main') return;
    e.preventDefault();
    if (a.id === 'book-another') window.__bookReset();
    if (a.dataset.service) pendingService = a.dataset.service;
    if (location.hash === href) route();
    else location.hash = href;
  });
  window.addEventListener('hashchange', route);
  route();
}

  </script>
