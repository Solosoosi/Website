/* ---------- Accessibility menu modes ---------- */

html.a11y-text-1 {
  font-size: 112.5%;
}

html.a11y-text-2 {
  font-size: 125%;
}

html.a11y-contrast {
  --muted: var(--ink);
  --ink-2: var(--ink);
  --line: var(--line-strong);
  --line-strong: var(--ink);
  --glass: var(--surface);
  --glass-strong: var(--surface);
}

html.a11y-links a {
  text-decoration: underline !important;
  text-underline-offset: 3px;
}

html.a11y-font {
  --font-display: var(--font-body);
}

html.a11y-still *,
html.a11y-still *::before,
html.a11y-still *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}

/* With animations stopped, nothing waits to be revealed. */
html.js.a11y-still .reveal:not(.is-visible) {
  opacity: 1;
  transform: none;
  filter: none;
}

/* ==========================================================================
   Base
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 12px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 400;
  line-height: 1.12;
  text-wrap: balance;
}

p {
  margin: 0 0 1em;
}

a {
  color: inherit;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

img,
svg {
  display: block;
  max-width: 100%;
}

img {
  height: auto;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 10px;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

[hidden] {
  display: none !important;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  inset-inline-start: 12px;
  top: -60px;
  z-index: 100;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  transition: top 0.2s;
}

.skip-link:focus {
  top: 12px;
}

.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

[dir='rtl'] .flip-rtl {
  transform: scaleX(-1);
}

.flip-rtl {
  display: inline-flex;
}

bdi {
  unicode-bidi: isolate;
}

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: var(--shadow-soft);
}

.pill-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px;
  padding: 6px 16px 6px 14px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  font-size: var(--fs-xs);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--accent-ink);
}

.pill-label::before {
  content: '';
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.caption {
  margin-top: 14px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.grad {
  background: linear-gradient(100deg, var(--accent-ink) 10%, var(--accent-2) 55%, var(--accent-ink) 90%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: sheen 9s ease-in-out infinite;
}

/* ==========================================================================
   Buttons
   ========================================================================== */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6em;
  min-height: 52px;
  padding: 0.7em 1.6em;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: transform 0.35s var(--ease), translate 0.5s var(--ease), box-shadow 0.35s var(--ease), background-color 0.25s, border-color 0.25s, color 0.25s;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  color: var(--on-accent);
  box-shadow: 0 14px 30px -14px color-mix(in srgb, var(--accent) 80%, transparent);
}

.btn-primary:hover {
  box-shadow: 0 20px 38px -14px color-mix(in srgb, var(--accent) 90%, transparent);
}

.btn-soft,
.btn-outline {
  background: var(--glass);
  border-color: var(--glass-border);
  color: var(--ink);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow-soft);
}

.btn-outline {
  background: transparent;
  border-color: var(--line-strong);
  box-shadow: none;
  backdrop-filter: none;
}

.btn-outline:hover,
.btn-soft:hover {
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  padding-inline: 0.9em;
}

.btn-ghost:hover {
  background: var(--accent-soft);
  transform: none;
}

.btn-danger {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--danger);
}

.btn-danger:hover {
  background: var(--danger-soft);
  border-color: var(--danger);
}

.btn-light {
  background: var(--surface);
  color: var(--accent-ink);
  box-shadow: var(--shadow-soft);
}

.btn-sm {
  min-height: 40px;
  padding: 0.45em 1.1em;
  font-size: 0.92rem;
}

.btn-block {
  width: 100%;
  white-space: normal;
  text-align: center;
}

.btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-arrow .flip-rtl svg {
  transition: transform 0.35s var(--ease);
}

.btn-arrow:hover .flip-rtl svg {
  transform: translateX(4px);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--glass);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.35s var(--ease), border-color 0.2s, background-color 0.2s, color 0.2s;
}

.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent-ink);
  transform: translateY(-1px);
}

.icon-btn[aria-expanded='true'] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

.icon-btn[disabled] {
  opacity: 0.35;
  cursor: default;
  transform: none;
}

.linklike {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ==========================================================================
   Header: a floating glass bar
   ========================================================================== */

.site-header {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  z-index: 50;
  height: 64px;
  margin-top: 12px;
  padding-inline: var(--gutter);
  transition: transform 0.55s var(--ease);
}

.site-header.is-hidden {
  transform: translateY(calc(-100% - 24px));
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: var(--container);
  height: 100%;
  margin-inline: auto;
  padding: 0 10px 0 22px;
  border-radius: 999px;
  background: var(--header-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: var(--shadow-soft);
  transition: box-shadow 0.3s;
}

[dir='rtl'] .header-inner {
  padding: 0 22px 0 10px;
}

.site-header.is-scrolled .header-inner {
  box-shadow: var(--shadow-lift);
}

.scroll-progress {
  position: absolute;
  inset-inline: 28px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transform: scaleX(var(--progress, 0));
  transform-origin: right;
  pointer-events: none;
}

[dir='ltr'] .scroll-progress {
  transform-origin: left;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  min-height: 44px;
  color: var(--ink);
  text-decoration: none;
}

.brand-orb {
  position: relative;
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--glow-1), var(--glow-2), var(--glow-3), var(--glow-1));
  animation: spin 14s linear infinite;
}

.brand-orb::after {
  content: '';
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--accent-2) 55%, var(--accent));
  box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent);
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.1;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.55rem;
  line-height: 1;
  white-space: nowrap;
}

.brand-tagline {
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.main-nav {
  margin-inline-start: auto;
}

.main-nav ul {
  display: flex;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-nav a {
  display: block;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--ink-2);
  font-size: 0.95rem;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.25s, color 0.25s;
}

.main-nav a:hover,
.main-nav a.is-current,
.main-nav a[aria-current='page'] {
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-actions .btn {
  min-height: 44px;
}

.nav-toggle {
  display: none;
}

@media (max-width: 1140px) {
  .nav-toggle {
    display: inline-grid;
  }

  .main-nav {
    position: absolute;
    top: calc(100% + 10px);
    inset-inline: 0;
    padding: 10px;
    border-radius: var(--radius-lg);
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: var(--shadow-lift);
    transform: translateY(-8px) scale(0.98);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s var(--ease), transform 0.3s var(--ease), visibility 0.3s;
  }

  .main-nav.is-open {
    transform: none;
    opacity: 1;
    visibility: visible;
  }

  .main-nav ul {
    flex-direction: column;
  }

  .main-nav a {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 1.1rem;
  }

  .header-actions {
    margin-inline-start: auto;
  }
}

@media (max-width: 600px) {
  .brand-tagline,
  .header-cta {
    display: none;
  }

  .header-inner,
  [dir='rtl'] .header-inner {
    padding-inline: 16px 8px;
    gap: 10px;
  }

  [dir='rtl'] .header-inner {
    padding-inline: 16px 8px;
  }

  .header-actions {
    gap: 6px;
  }

  .header-actions .icon-btn {
    width: 40px;
    height: 40px;
  }
}

/* Very narrow phones (e.g. a folded Galaxy Fold): keep the name clear of the buttons. */
@media (max-width: 359px) {
  .site-header .brand-orb {
    display: none;
  }

  .brand-name {
    font-size: 1.3rem;
  }

  .header-inner,
  [dir='rtl'] .header-inner {
    padding-inline: 12px 6px;
    gap: 6px;
  }

  .header-actions {
    gap: 4px;
  }

  .header-actions .icon-btn {
    width: 40px;
    height: 40px;
  }
}

/* ==========================================================================
   Sections
   ========================================================================== */

.section {
  position: relative;
  padding-block: var(--section);
}

.section-alt {
  background: linear-gradient(180deg, transparent, var(--bg-2) 18%, var(--bg-2) 82%, transparent);
}

.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 20px 56px;
  align-items: end;
  margin-bottom: clamp(40px, 6vw, 72px);
}

.section-head.center {
  grid-template-columns: 1fr;
  justify-items: center;
  text-align: center;
}

.sec-num {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  font-size: var(--fs-xs);
  font-weight: 500;
  letter-spacing: 0.2em;
  font-variant-numeric: tabular-nums;
  color: var(--accent-ink);
}

.sec-num::after {
  content: '';
  width: 48px;
  height: 1px;
  background: currentColor;
  opacity: 0.45;
}

.section-title {
  font-family: var(--font-display);
  font-size: var(--fs-title);
  line-height: 1.04;
}

.section-lead {
  max-width: 48ch;
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 300;
  line-height: 1.65;
  color: var(--ink-2);
}

@media (max-width: 820px) {
  .section-head {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Drifting light (aurora)
   ========================================================================== */

.aurora {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.aurora span {
  position: absolute;
  width: 52vmax;
  aspect-ratio: 1;
  border-radius: 50%;
  opacity: 0.85;
  animation: drift 28s ease-in-out infinite alternate;
  will-change: transform;
}

.aurora span:nth-child(1) {
  top: -22vmax;
  inset-inline-start: -14vmax;
  background: radial-gradient(circle, var(--glow-1) 0%, transparent 62%);
}

.aurora span:nth-child(2) {
  top: -10vmax;
  inset-inline-end: -18vmax;
  background: radial-gradient(circle, var(--glow-2) 0%, transparent 62%);
  animation-duration: 34s;
  animation-delay: -9s;
}

.aurora span:nth-child(3) {
  bottom: -28vmax;
  inset-inline-start: 22%;
  background: radial-gradient(circle, var(--glow-3) 0%, transparent 60%);
  animation-duration: 40s;
  animation-delay: -16s;
}

.aurora span:nth-child(4) {
  width: 34vmax;
  top: 30%;
  inset-inline-start: 38%;
  background: radial-gradient(circle, var(--glow-4) 0%, transparent 60%);
  animation-duration: 24s;
  animation-delay: -4s;
}

/* ==========================================================================
   Intro: a short curtain with the name (once per visit)
   ========================================================================== */

:root {
  --intro: 1.15s;
}

html.no-intro,
html.a11y-still {
  --intro: 0s;
}

.intro {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 20px;
  background: var(--bg);
  pointer-events: none;
  animation: intro-out 0.95s var(--ease) 1.05s forwards;
}

.intro::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(38vmax 38vmax at 50% 42%, color-mix(in srgb, var(--glow-1) 85%, transparent), transparent 62%),
    radial-gradient(30vmax 30vmax at 64% 66%, color-mix(in srgb, var(--glow-3) 70%, transparent), transparent 60%);
}

.intro-orb {
  position: relative;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--accent-2) 52%, var(--accent));
  box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 10%, transparent), 0 18px 44px -12px var(--accent);
  animation: intro-orb 1.1s var(--ease) both;
}

.intro-name {
  position: relative;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 6vw, 3.6rem);
  line-height: 1;
  animation: intro-name 0.9s var(--ease) 0.18s both;
}

html.no-intro .intro,
html.a11y-still .intro {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --intro: 0s;
  }

  .intro {
    display: none;
  }
}

/* ==========================================================================
   Hero: what he does – the headline, his three treatments, the booking button
   ========================================================================== */

.hero {
  position: relative;
  margin-top: calc(-64px - 12px);
  padding-block: calc(64px + clamp(48px, 8vw, 120px)) clamp(56px, 8vw, 110px);
  overflow: hidden;
  isolation: isolate;
}

.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 40%), var(--cursor-glow), transparent 60%);
  pointer-events: none;
  transition: opacity 0.6s;
}

.hero-inner {
  position: relative;
  z-index: 1;
  display: grid;
  align-content: center;
  min-height: min(62vh, 600px);
}

.hero-head {
  display: grid;
  justify-items: center;
  text-align: center;
}

.hero-head .pill-label {
  margin-bottom: 12px;
  animation: blur-in 1s var(--ease) var(--intro) both;
}

.hero-title {
  margin: 0 0 24px;
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 0.92;
}

.hero-title .line {
  display: block;
  overflow: hidden;
  padding: 0.04em 0.08em 0.16em;
  margin-bottom: -0.12em;
  font-size: clamp(2.6rem, 17vw, 9.5rem);
  letter-spacing: -0.005em;
}

.hero-title .line > span {
  display: inline-block;
  animation: rise 1.3s var(--ease) calc(var(--intro) + 0.06s) both;
}

.hero-title .line > .grad {
  animation:
    rise 1.3s var(--ease) calc(var(--intro) + 0.16s) both,
    sheen 9s ease-in-out infinite;
}

/* The three treatments under the headline */
.hero-treatments {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 12px;
  margin: 0 0 30px;
  padding: 0;
  list-style: none;
  animation: blur-in 1.1s var(--ease) calc(var(--intro) + 0.3s) both;
}

.hero-treatments a {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding-block: 6px;
  padding-inline: 6px 20px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-soft);
  color: var(--ink);
  font-size: 1.05rem;
  font-weight: 500;
  text-decoration: none;
  transition: transform 0.35s var(--ease), border-color 0.25s, color 0.25s;
}

.hero-treatments a:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent-ink);
}

.hero-treatments img {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
}

.hero-treatments .ht-num,
.hero-treatments .ht-go {
  display: none;
}

@media (max-width: 560px) {
  .hero-treatments a {
    padding-inline-end: 16px;
    font-size: 0.98rem;
  }

  .hero-treatments img {
    width: 32px;
    height: 32px;
  }
}

.hero-ctas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px 14px;
  animation: blur-in 1.1s var(--ease) calc(var(--intro) + 0.4s) both;
}

.hero-ctas.center {
  animation: none;
}

.hero-ctas .status {
  margin-inline-start: 4px;
}

.hero-room {
  display: none;
}

/* ==========================================================================
   Treatments: cards that stack as you scroll
   ========================================================================== */

.stack {
  display: grid;
  gap: 28px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.stack-card {
  position: sticky;
  top: calc(var(--header-h) + 20px + var(--i, 0) * 16px);
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(24px, 4vw, 56px);
  align-items: center;
  min-height: 440px;
  padding: clamp(20px, 3vw, 36px);
  border-radius: var(--radius-xl);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-lift);
  overflow: hidden;
  transform: scale(calc(1 - var(--depth, 0) * 0.07));
  transform-origin: 50% 0;
}

/* Cards further down the stack sink back as the next one slides over them. */
.stack-card {
  scroll-margin-top: calc(var(--header-h) + 16px);
}

.stack-card::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 3;
  border-radius: inherit;
  background: var(--bg);
  opacity: calc(var(--depth, 0) * 0.55);
  pointer-events: none;
}

.stack-card:nth-child(3n + 1) {
  background: linear-gradient(140deg, var(--surface) 30%, color-mix(in srgb, var(--glow-1) 70%, var(--surface)));
}

.stack-card:nth-child(3n + 2) {
  background: linear-gradient(140deg, var(--surface) 30%, color-mix(in srgb, var(--glow-2) 70%, var(--surface)));
}

.stack-card:nth-child(3n + 3) {
  background: linear-gradient(140deg, var(--surface) 30%, color-mix(in srgb, var(--glow-3) 70%, var(--surface)));
}

.stack-img {
  position: relative;
  height: 100%;
  min-height: 300px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--photo-bg);
}

.stack-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.1);
  transition: transform 1.8s var(--ease);
}

.stack-card.is-in .stack-img img {
  transform: none;
}

.stack-card.is-in:hover .stack-img img {
  transform: scale(1.04);
}

.stack-num {
  display: block;
  margin-bottom: 10px;
  font-family: var(--font-display);
  font-size: clamp(3.6rem, 6vw, 5.6rem);
  line-height: 0.9;
  color: transparent;
  -webkit-text-stroke: 1.2px color-mix(in srgb, var(--accent-ink) 55%, transparent);
}

html.a11y-contrast .stack-num {
  color: var(--accent-ink);
  -webkit-text-stroke: 0;
}

.stack-name {
  margin-bottom: 14px;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 4.4vw, 3.6rem);
  line-height: 1.04;
}

.stack-desc {
  max-width: 54ch;
  margin-bottom: 18px;
  color: var(--ink-2);
}

.stack-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px 22px;
}

.duration {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.duration svg {
  width: 16px;
  height: 16px;
}

@media (max-height: 699px) {
  .stack-card {
    position: relative;
    top: auto;
  }
}

@media (max-width: 860px) {
  .stack-card {
    position: relative;
    top: auto;
    grid-template-columns: 1fr;
    min-height: 0;
  }

  .stack-img {
    min-height: 0;
    aspect-ratio: 16 / 10;
  }
}

/* ==========================================================================
   About
   ========================================================================== */

.about {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(36px, 6vw, 96px);
  align-items: center;
}

.blob {
  overflow: hidden;
  border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
  background: var(--photo-bg);
  animation: morph 16s ease-in-out infinite;
}

.blob img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.about-photo {
  position: relative;
  margin: 0;
}

.about-photo .blob {
  aspect-ratio: 4 / 5;
  box-shadow: var(--shadow-lift);
  animation-duration: 20s;
}

.about-text .section-title {
  margin-bottom: 26px;
}

.about-text p {
  max-width: 62ch;
  color: var(--ink-2);
}
.about-text .about-lead {
  font-size: var(--fs-md);
  line-height: 1.7;
  color: var(--ink);
}

/* The portrait warms from black and white into color as it appears. */
.about-photo .blob img {
  filter: grayscale(1);
  transition: filter 1.8s var(--ease) 0.35s;
}

.about-photo.is-visible .blob img {
  filter: none;
}

.statement {
  max-width: 1080px;
  margin: clamp(80px, 11vw, 150px) auto 0;
  text-align: center;
}

.words {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.3rem, 5vw, 4.6rem);
  line-height: 1.14;
}

/* Each word lights up as the quote scrolls through the screen. */
.words .w {
  transition: opacity 0.5s var(--ease);
}

html.js .words .w:not(.is-lit) {
  opacity: 0.14;
}

html.a11y-contrast .words .w {
  opacity: 1;
}

.statement figcaption {
  margin-top: 22px;
  font-size: var(--fs-sm);
  letter-spacing: 0.04em;
  color: var(--muted);
}

.statement figcaption::before {
  content: '';
  display: inline-block;
  width: 36px;
  height: 1px;
  margin-inline-end: 12px;
  vertical-align: middle;
  background: currentColor;
  opacity: 0.6;
}

@media (max-width: 900px) {
  .about {
    grid-template-columns: 1fr;
  }

  .about-photo {
    max-width: 440px;
  }
}

/* ==========================================================================
   Gallery: drifting photo columns + full-screen viewer
   ========================================================================== */

.mosaic {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(14px, 2vw, 28px);
  align-items: start;
}

.mosaic-col {
  display: grid;
  gap: clamp(14px, 2vw, 28px);
  transform: translate3d(0, var(--shift, 0px), 0);
}

.mosaic-col:nth-child(2) {
  margin-top: clamp(48px, 9vw, 140px);
}

.mosaic-item {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  isolation: isolate;
  aspect-ratio: 4 / 5;
  background: var(--photo-bg);
  cursor: zoom-in;
}

.mosaic-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1.2s var(--ease);
}

.mosaic-item::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgb(10 30 25 / 0.3));
  opacity: 0;
  transition: opacity 0.5s;
}

.mosaic-item:hover img {
  transform: scale(1.06);
}

.mosaic-item:hover::after {
  opacity: 1;
}

.mosaic-item:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}

@media (max-width: 760px) {
  .mosaic {
    display: flex;
    gap: 12px;
    margin-inline: calc(var(--gutter) * -1);
    padding: 4px var(--gutter) 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }

  .mosaic::-webkit-scrollbar {
    display: none;
  }

  .mosaic-col {
    display: contents;
  }

  .mosaic-item {
    flex: 0 0 74%;
    scroll-snap-align: center;
  }
}

.lightbox {
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: rgb(8 14 12 / 0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #eef4f1;
}

.lightbox[open] {
  animation: fade-in 0.35s var(--ease);
}

.lightbox::backdrop {
  background: transparent;
}

.lightbox-inner {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100%;
  padding: max(14px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
}

.lightbox-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: var(--fs-sm);
}

.lightbox figure {
  position: relative;
  min-height: 0;
  margin: 12px 0;
}

.lightbox img {
  position: absolute;
  inset: 0;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  margin: auto;
  border-radius: 18px;
}

.lightbox-nav {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.lightbox .icon-btn {
  background: rgb(255 255 255 / 0.08);
  border-color: rgb(255 255 255 / 0.2);
  color: #eef4f1;
}

/* ==========================================================================
   Visit
   ========================================================================== */

.visit {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}

.visit-card {
  padding: clamp(22px, 3vw, 32px);
  border-radius: var(--radius-lg);
}

.visit-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--accent-ink);
}

.visit-h svg {
  width: 18px;
  height: 18px;
}

.visit-address {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 3.4vw, 2.8rem);
  line-height: 1.05;
}

.visit-sub {
  margin-bottom: 22px;
  color: var(--ink-2);
}

.visit-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hours-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.hours-table th,
.hours-table td {
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-weight: 400;
  text-align: start;
}

.hours-table tr:last-child th,
.hours-table tr:last-child td {
  border-bottom: 0;
}

.hours-table td {
  text-align: end;
  color: var(--ink-2);
}

.hours-table td span {
  direction: ltr;
  unicode-bidi: isolate;
}

.hours-table tr.is-today th,
.hours-table tr.is-today td {
  font-weight: 500;
  color: var(--accent-ink);
}

.hours-table tr.is-today th::after {
  content: '';
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-inline-start: 8px;
  border-radius: 50%;
  background: var(--accent);
  vertical-align: middle;
}

.hours-table .is-closed {
  color: var(--muted);
}

.visit-note {
  margin: 16px 0 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}

.visit .status {
  margin-top: 18px;
}

.prep {
  display: grid;
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.prep li {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 14px;
  align-items: center;
}

.prep-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.prep-icon svg {
  width: 20px;
  height: 20px;
}

.prep strong {
  display: block;
  font-weight: 500;
}

.prep span {
  font-size: var(--fs-sm);
  color: var(--ink-2);
}

@media (max-width: 980px) {
  .visit {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Final call to action + contact
   ========================================================================== */

.final {
  position: relative;
  padding-block: var(--section);
}

.final-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr);
  gap: 40px clamp(32px, 6vw, 80px);
  align-items: center;
  padding: clamp(28px, 5vw, 64px);
  border-radius: var(--radius-xl);
  overflow: hidden;
  isolation: isolate;
  background: var(--bg-2);
}

.final-card > :not(.aurora) {
  position: relative;
  z-index: 1;
}

.final-title {
  margin-bottom: 20px;
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 6vw, 5rem);
  line-height: 1.02;
}

.final-links {
  display: grid;
  gap: 10px;
  margin: 34px 0 0;
  padding: 0;
  list-style: none;
}

.final-links li {
  display: flex;
  align-items: center;
  gap: 12px;
}

.final-links .bubble {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--glass-strong);
  color: var(--accent-ink);
}

.final-links svg {
  width: 17px;
  height: 17px;
}

.final-links a {
  text-decoration: none;
}

.final-links a:hover {
  color: var(--accent-ink);
}

.contact-card {
  padding: clamp(22px, 3vw, 36px);
  border-radius: var(--radius-lg);
}

@media (max-width: 900px) {
  .final-card {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Forms
   ========================================================================== */

.form {
  display: grid;
  gap: 16px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-row:has(> .field[hidden]) {
  grid-template-columns: 1fr;
}

@media (max-width: 560px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}

.field {
  display: grid;
  gap: 6px;
}

.field label {
  font-size: 0.94rem;
  font-weight: 500;
}

.field .optional {
  font-weight: 400;
  color: var(--muted);
  font-size: 0.85rem;
}

.input,
.field input,
.field textarea,
.field select {
  width: 100%;
  min-height: 52px;
  padding: 12px 18px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  transition: border-color 0.25s, box-shadow 0.25s;
}

.field textarea {
  min-height: 120px;
  resize: vertical;
}

.input:focus,
.field input:focus,
.field textarea:focus,
.field select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.field.has-error input,
.field.has-error textarea {
  border-color: var(--danger);
}

.field-error {
  color: var(--danger);
  font-size: 0.85rem;
}

.field input[type='tel'],
.field input[type='email'] {
  direction: ltr;
}

[dir='rtl'] .field input[type='tel'],
[dir='rtl'] .field input[type='email'] {
  text-align: right;
}

.checkbox {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 0.92rem;
  color: var(--muted);
}

.checkbox input {
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 3px;
  accent-color: var(--accent);
}

.checkbox.has-error {
  color: var(--danger);
}

.hp-field {
  position: absolute;
  inset-inline-start: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.alert {
  margin: 0;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
}

.alert a {
  font-weight: 500;
}

.alert-success {
  background: var(--success-soft);
  color: var(--success);
}

.alert-error {
  background: var(--danger-soft);
  color: var(--danger);
}

.panel-sub {
  color: var(--muted);
}

/* ==========================================================================
   Footer, floating buttons, mobile action bar
   ========================================================================== */

.site-footer {
  position: relative;
  padding-block: clamp(40px, 6vw, 72px) 28px;
  font-size: var(--fs-sm);
}

.footer-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  padding-bottom: 28px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--line);
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.footer-brand .brand-orb {
  width: 46px;
  height: 46px;
}

.footer-brand .brand-orb::after {
  inset: 10px;
}

.footer-name {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2.4rem;
  line-height: 1;
}

.footer-tag {
  margin: 0;
  color: var(--muted);
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
}

.footer-grid h4 {
  margin-bottom: 12px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--accent-ink);
}

.footer-grid ul {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.footer-grid a {
  text-decoration: none;
  color: var(--ink-2);
}

.footer-grid a:hover {
  color: var(--accent-ink);
}

.footer-grid p {
  margin-bottom: 8px;
  color: var(--ink-2);
}

.footer-bottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px 24px;
  margin-top: 40px;
  color: var(--muted);
}
.site-footer:has(.footer-mark) {
  padding-bottom: 0;
}

.footer-mark {
  height: 0.7em;
  margin-top: clamp(36px, 5vw, 64px);
  overflow: hidden;
  font-family: var(--font-display);
  font-size: clamp(5rem, 19vw, 17rem);
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
}

.footer-mark span {
  display: inline-block;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 32%, transparent), transparent 85%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.footer-bottom.compact {
  margin-top: 0;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.footer-links a {
  color: inherit;
}

@media (max-width: 720px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }

  .footer-grid > :last-child {
    grid-column: 1 / -1;
  }
}

/* Phones and tablets: footer links big enough to tap comfortably */
@media (max-width: 760px), (pointer: coarse) {
  .footer-grid ul {
    gap: 2px;
  }

  .footer-grid a,
  .footer-links a,
  .footer-links .linklike {
    display: inline-block;
    padding-block: 7px;
  }
}

/* Very narrow phones: a little less padding so nothing gets squeezed */
@media (max-width: 359px) {
  .panel {
    padding: 18px 12px;
  }

  .final-card {
    padding: 22px 14px;
  }

  .contact-card {
    padding: 18px 14px;
  }
}

.whatsapp-fab {
  position: fixed;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  inset-inline-end: 22px;
  z-index: 40;
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #25d366;
  color: #fff;
  box-shadow: 0 14px 30px -10px rgb(37 211 102 / 0.6);
  transition: transform 0.35s var(--ease);
}

.whatsapp-fab:hover {
  transform: translateY(-3px) scale(1.04);
}

.whatsapp-fab svg {
  width: 30px;
  height: 30px;
}

.action-bar {
  display: none;
}

@media (max-width: 760px) {
  .whatsapp-fab {
    display: none;
  }

  .action-bar {
    position: fixed;
    inset-inline: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 45;
    display: flex;
    gap: 8px;
    padding: 8px;
    border-radius: 999px;
    background: var(--header-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: var(--shadow-lift);
  }

  .action-bar .btn {
    flex: 1;
    min-height: 48px;
  }

  .action-bar .icon-btn {
    width: 48px;
    height: 48px;
  }

  body {
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }

  body[data-route='book'] .action-bar .btn-primary {
    display: none;
  }

  body[data-route='book'] .action-bar {
    inset-inline-start: auto;
  }
}

/* ==========================================================================
   Accessibility menu + dialogs
   ========================================================================== */

.a11y-panel {
  position: fixed;
  top: calc(var(--header-h) + 4px);
  inset-inline-end: var(--gutter);
  z-index: 60;
  width: min(350px, calc(100vw - 2 * var(--gutter)));
  padding: 18px;
  border-radius: var(--radius-lg);
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  color: var(--ink);
  box-shadow: var(--shadow-lift);
  animation: blur-in 0.35s var(--ease);
}

.a11y-panel h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 1.05rem;
  font-weight: 500;
}

.a11y-panel h2 svg {
  width: 20px;
  height: 20px;
}

.a11y-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.a11y-opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 0.86rem;
  line-height: 1.3;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
}

.a11y-opt:hover {
  border-color: var(--accent);
}

.a11y-opt[aria-pressed='true'] {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.a11y-opt svg {
  width: 22px;
  height: 22px;
}

.a11y-opt .level {
  font-size: 0.72rem;
  color: var(--muted);
}

.a11y-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  font-size: 0.88rem;
}

.dialog {
  width: min(640px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px);
  padding: 0;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-lift);
}

.dialog[open] {
  animation: blur-in 0.4s var(--ease);
}

.dialog::backdrop {
  background: rgb(8 14 12 / 0.45);
  backdrop-filter: blur(4px);
}

.dialog-inner {
  position: relative;
  padding: clamp(24px, 4vw, 36px);
}

.dialog h2 {
  margin-bottom: 18px;
  font-family: var(--font-display);
  font-size: 2.6rem;
}

.dialog p {
  color: var(--ink-2);
}

.dialog-close {
  position: absolute;
  top: 16px;
  inset-inline-end: 16px;
}

/* ==========================================================================
   Booking page
   ========================================================================== */

.page-hero {
  position: relative;
  padding-block: clamp(48px, 7vw, 96px) 28px;
}

.page-hero h1 {
  margin-bottom: 14px;
  font-family: var(--font-display);
  font-size: clamp(3rem, 7vw, 5rem);
  line-height: 1.04;
}

.page-hero .lead {
  max-width: 52ch;
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 300;
  color: var(--ink-2);
}

.stepper {
  display: flex;
  gap: 8px;
  margin: 0 0 28px;
  padding: 6px;
  width: max-content;
  max-width: 100%;
  list-style: none;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
}

.stepper li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px 8px 8px;
  border-radius: 999px;
  color: var(--muted);
  font-weight: 500;
  transition: background-color 0.4s var(--ease), color 0.4s;
}

[dir='rtl'] .stepper li {
  padding: 8px 8px 8px 18px;
}

.stepper .num {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface);
  font-size: var(--fs-sm);
}

.stepper li.is-active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-soft);
}

.stepper li.is-active .num,
.stepper li.is-done .num {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  color: var(--on-accent);
}

@media (max-width: 560px) {
  .stepper .label {
    display: none;
  }

  .stepper li,
  [dir='rtl'] .stepper li {
    padding: 6px;
  }
}

.booking-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 24px;
  align-items: start;
  padding-bottom: var(--section);
}

@media (max-width: 960px) {
  .booking-layout {
    grid-template-columns: 1fr;
  }
}

.panel {
  padding: clamp(20px, 3vw, 36px);
  border-radius: var(--radius-lg);
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow-soft);
}

.panel h2 {
  margin-bottom: 8px;
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 4vw, 2.8rem);
  line-height: 1.05;
}

#step-1:not([hidden]),
#step-2:not([hidden]),
#step-3:not([hidden]) {
  animation: blur-in 0.5s var(--ease);
}

.service-options {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}

.service-option {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 10px 20px 10px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  text-align: start;
  cursor: pointer;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s var(--ease);
}

[dir='rtl'] .service-option {
  padding: 10px 10px 10px 20px;
}

.service-option:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.service-option[aria-pressed='true'] {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.service-thumb {
  flex: none;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--photo-bg);
}

.service-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.service-option strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 400;
  line-height: 1.1;
}

.service-option .service-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.chip svg {
  width: 14px;
  height: 14px;
}

.chip-accent {
  color: var(--accent-ink);
}

.service-option .check-mark {
  margin-inline-start: auto;
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  transition: background 0.3s, border-color 0.3s;
}

.service-option[aria-pressed='true'] .check-mark {
  border-color: var(--accent);
  background: radial-gradient(circle, var(--accent) 0 6px, transparent 6.5px);
}

.panel-actions {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.panel-actions .btn-primary {
  margin-inline-start: auto;
}

.schedule-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 32px;
  margin-top: 22px;
}

@media (max-width: 760px) {
  .schedule-grid {
    grid-template-columns: 1fr;
  }
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.calendar-head h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.9rem;
}

.calendar-head .icon-btn {
  width: 38px;
  height: 38px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  text-align: center;
}

.calendar-grid .dow {
  padding-block: 6px;
  font-size: 0.74rem;
  color: var(--muted);
}

.day {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  min-height: 0;
  border: 1px solid transparent;
  border-radius: 50%;
  background: none;
  font-size: 0.95rem;
  color: var(--muted);
  opacity: 0.4;
  cursor: default;
  transition: background-color 0.25s, color 0.25s, border-color 0.25s, transform 0.25s var(--ease);
}

.day.is-available {
  opacity: 1;
  color: var(--ink);
  background: var(--surface);
  cursor: pointer;
}

.day.is-available::after {
  content: '';
  position: absolute;
  bottom: 14%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.day.is-available:hover {
  border-color: var(--accent);
  transform: scale(1.06);
}

.day.is-today {
  border-color: var(--line-strong);
}

.day[aria-pressed='true'] {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  color: var(--on-accent);
}

.day[aria-pressed='true']::after {
  background: var(--on-accent);
}

.calendar-grid.is-loading {
  opacity: 0.5;
  pointer-events: none;
}

.slots-head {
  margin-bottom: 4px;
  font-size: 1.05rem;
  font-weight: 500;
}

.slots-note {
  margin-bottom: 14px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.slots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
}

.slot {
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  direction: ltr;
  transition: border-color 0.25s, background-color 0.25s, color 0.25s, transform 0.25s var(--ease);
}

.slot:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.slot[aria-pressed='true'] {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  border-color: transparent;
  color: var(--on-accent);
}

.empty-state {
  margin: 0;
  padding: 28px 16px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  text-align: center;
  color: var(--muted);
  font-size: 0.95rem;
}

.summary {
  position: sticky;
  top: calc(var(--header-h) + 16px);
}

.summary h3 {
  margin-bottom: 14px;
  font-family: var(--font-display);
  font-size: 2rem;
}

.summary dl {
  display: grid;
  margin: 0;
}

.summary dt {
  padding-top: 12px;
  font-size: 0.78rem;
  color: var(--muted);
}

.summary dd {
  margin: 0;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  font-weight: 500;
}

.summary .placeholder {
  color: var(--muted);
  font-weight: 400;
}

.summary-note {
  margin: 16px 0 0;
  font-size: 0.88rem;
  color: var(--muted);
}

.confirmation {
  max-width: 640px;
  margin-inline: auto;
  margin-bottom: var(--section);
  text-align: center;
}

.confirmation .check {
  display: grid;
  place-items: center;
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--success-soft);
  color: var(--success);
  animation: pop 0.6s var(--ease) both;
}

.confirmation .check svg {
  width: 40px;
  height: 40px;
}

.confirmation h2 {
  font-size: clamp(2.8rem, 6vw, 3.8rem);
}

.confirmation dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 20px;
  margin: 28px auto;
  padding: 20px 24px;
  border-radius: var(--radius);
  background: var(--surface);
  text-align: start;
}

.confirmation dt {
  font-size: var(--fs-xs);
  color: var(--muted);
  padding-top: 3px;
}

.confirmation dd {
  margin: 0;
  font-weight: 500;
}

.confirmation .prep {
  margin: 8px 0 28px;
  padding: 20px 24px;
  border-radius: var(--radius);
  background: var(--surface);
  text-align: start;
}

.confirmation .prep .prep-head {

}

.confirmation .prep-title {
  margin: 0 0 4px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--accent-ink);
}

.ref {
  letter-spacing: 0.1em;
  direction: ltr;
  unicode-bidi: isolate;
}

/* ---------- 404 ---------- */

.not-found {
  min-height: 60vh;
  display: grid;
  place-items: center;
  text-align: center;
}

.not-found h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(7rem, 20vw, 12rem);
  line-height: 0.9;

}

.not-found h2 {
  margin-bottom: 12px;
  font-family: var(--font-display);
  font-size: 2.6rem;
}

/* ==========================================================================
   Design options. The site uses the "natural" family (data-look starting
   with 2 on <html>; 2 is the default). Everything above is the shared base.
   Open the site with ?options to compare the versions.
   ========================================================================== */

/* ---------- Version א (the default): warm paper, terracotta, serif headings ---------- */

:root {
  --start: 0%;
  --fwd: 1;
}

:root[dir='rtl'] {
  --start: 100%;
  --fwd: -1;
}

:root[data-look^='2'] {
  --bg: #f6f1e9;
  --bg-2: #efe7db;
  --surface: #fffdf9;
  --glass: #fffdf9;
  --glass-strong: #fffdf9;
  --glass-border: #e6dccd;
  --ink: #2b2923;
  --ink-2: #4a453b;
  --muted: #736b5e;
  --line: rgb(43 41 35 / 0.12);
  --line-strong: rgb(43 41 35 / 0.24);
  --accent: #a3562f;
  --accent-2: #c07a4f;
  --accent-ink: #8a4524;
  --on-accent: #ffffff;
  --accent-soft: #f1e1d4;
  --spark: var(--accent);
  --glow-1: #eedbc6;
  --glow-2: #e7e1d0;
  --glow-3: #f2d8cc;
  --glow-4: #ece2cd;
  --open: #3f8a5a;
  --photo-bg: #e9dfd0;
  --cursor-glow: rgb(255 249 240 / 0.5);
  --shadow-soft: 0 10px 30px -18px rgb(70 50 25 / 0.25);
  --shadow-lift: 0 26px 60px -30px rgb(70 50 25 / 0.35);
  --header-bg: rgb(246 241 233 / 0.92);
  --font-display: 'Frank Ruhl Libre', 'Times New Roman', serif;
  --font-body: 'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-label: var(--font-body);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
}

:root[data-look^='2'][data-theme='dark'] {
  --bg: #1a1714;
  --bg-2: #211d18;
  --surface: #29241e;
  --glass: #29241e;
  --glass-strong: #29241e;
  --glass-border: #3a332a;
  --ink: #f1e9dc;
  --ink-2: #d6cbbb;
  --muted: #a69a88;
  --line: rgb(241 233 220 / 0.12);
  --line-strong: rgb(241 233 220 / 0.24);
  --accent: #e3a073;
  --accent-2: #ecb58f;
  --accent-ink: #eaa87c;
  --on-accent: #2a1508;
  --accent-soft: #3a2a1e;
  --glow-1: #3a2c1f;
  --glow-2: #2c2a22;
  --glow-3: #3a2522;
  --glow-4: #342d1e;
  --open: #7fc79a;
  --photo-bg: #2e2821;
  --cursor-glow: rgb(227 160 115 / 0.08);
  --shadow-soft: 0 10px 30px -18px rgb(0 0 0 / 0.6);
  --shadow-lift: 0 26px 60px -30px rgb(0 0 0 / 0.7);
  --header-bg: rgb(26 23 20 / 0.92);
}

[data-look^='2'] .aurora,
[data-look^='2'] .hero::after {
  display: none;
}

[data-look^='2'] .glass,
[data-look^='2'] .header-inner {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

[data-look^='2'] .header-inner {
  border-radius: var(--radius-lg);
}

[data-look^='2'] .btn,
[data-look^='2'] .pill-label,
[data-look^='2'] .status {
  border-radius: var(--radius-sm);
}

/* Soft sunlight drifting slowly behind the opening screen */
[data-look^='2'] .hero::before {
  content: '';
  position: absolute;
  z-index: 0;
  top: -22vmax;
  inset-inline-end: -16vmax;
  width: 64vmax;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--glow-1) 90%, transparent) 0%, transparent 66%);
  pointer-events: none;
  animation: sun 24s ease-in-out infinite alternate;
}

[data-look^='2'] .hero-inner {
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: clamp(32px, 6vw, 96px);
  align-items: center;
}

[data-look^='2'] .hero-head {
  justify-items: start;
  text-align: start;
}

[data-look^='2'] .hero-title {
  font-weight: 500;
}

[data-look^='2'] .hero-title .line {
  font-size: clamp(3rem, 8.5vw, 7rem);
}

/* Each word of the headline rises out of its own slot */
[data-look^='2'] .hero-title .line > span {
  animation: word-in 1.3s var(--ease) calc(var(--intro) + 0.06s) both;
}

[data-look^='2'] .hero-title .line > .grad {
  background: none;
  color: var(--accent);
  animation: word-in 1.3s var(--ease) calc(var(--intro) + 0.2s) both;
}

/* The treatments: hairlines draw in, then each row slides up in turn */
[data-look^='2'] .hero-treatments {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  justify-content: stretch;
  gap: 0;
  width: 100%;
  max-width: 520px;
  margin: 6px 0 34px;
  animation: none;
}

[data-look^='2'] .hero-treatments::before,
[data-look^='2'] .hero-treatments li::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  height: 1px;
  background: var(--line-strong);
  transform-origin: var(--start) 50%;
  animation: draw-x 1.2s var(--ease) calc(var(--intro) + 0.3s) both;
  pointer-events: none;
}

[data-look^='2'] .hero-treatments::before {
  top: 0;
}

[data-look^='2'] .hero-treatments li {
  position: relative;
  animation: row-in 0.9s var(--ease) calc(var(--intro) + 0.4s + var(--i, 0) * 0.1s) both;
}

[data-look^='2'] .hero-treatments li::after {
  bottom: 0;
  animation-delay: calc(var(--intro) + 0.45s + var(--i, 0) * 0.1s);
}

[data-look^='2'] .hero-treatments a {
  position: relative;
  isolation: isolate;
  display: flex;
  gap: 16px;
  padding: 14px 2px;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 500;
  transition: padding 0.45s var(--ease), color 0.25s;
}

/* A warm wash sweeps in behind the row you point at (or press) */
[data-look^='2'] .hero-treatments a::before {
  content: '';
  position: absolute;
  inset: 1px 0;
  z-index: -1;
  background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
  transform: scaleX(0);
  transform-origin: var(--start) 50%;
  transition: transform 0.6s var(--ease);
}

[data-look^='2'] .hero-treatments a:hover {
  transform: none;
}

[data-look^='2'] .hero-treatments a:active::before {
  transform: none;
}

[data-look^='2'] .hero-treatments img {
  width: 46px;
  height: 46px;
  transition: transform 0.6s var(--ease);
}

[data-look^='2'] .hero-treatments .ht-go {
  display: inline-flex;
  margin-inline-start: auto;
  color: var(--accent);
  transition: translate 0.45s var(--ease);
}

[data-look^='2'] .hero-treatments .ht-go svg {
  width: 20px;
  height: 20px;
}

@media (hover: hover) {
  [data-look^='2'] .hero-treatments a:hover {
    padding-inline-start: 14px;
  }

  [data-look^='2'] .hero-treatments a:hover::before {
    transform: none;
  }

  [data-look^='2'] .hero-treatments a:hover img {
    transform: scale(1.08) rotate(-5deg);
  }

  [data-look^='2'] .hero-treatments a:hover .ht-go {
    translate: calc(var(--fwd) * 6px) 0;
  }
}

[data-look^='2'] .hero-ctas {
  justify-content: flex-start;
}

/* The room photo in an arch: rises, a curtain lifts, the photo settles and breathes */
[data-look^='2'] .hero-room {
  position: relative;
  display: block;
  margin: 0;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  border-radius: 999px 999px var(--radius-lg) var(--radius-lg);
  background: var(--photo-bg);
  box-shadow: var(--shadow-lift);
  animation: rise-in 1.4s var(--ease) calc(var(--intro) + 0.1s) both;
}

[data-look^='2'] .hero-room::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-soft);
  transform: scaleY(0);
  transform-origin: 50% 0;
  animation: curtain 1.3s var(--ease) calc(var(--intro) + 0.35s) both;
  pointer-events: none;
}

[data-look^='2'] .hero-room img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  scale: 1.08;
  translate: 0 var(--py, 0px);
  animation:
    zoom-settle 2.2s var(--ease) calc(var(--intro) + 0.35s) both,
    breathe-img 18s ease-in-out calc(var(--intro) + 2.6s) infinite alternate;
}

@media (max-width: 900px) {
  [data-look^='2'] .hero-inner {
    grid-template-columns: minmax(0, 1fr);
  }

  [data-look^='2'] .hero-room {
    justify-self: center;
    width: min(100%, 360px);
  }
}

/* Section headings: the number's line draws, the title rises out of a slot */
[data-look^='2'] .section-title {
  clip-path: inset(-15% -6% -30% -6%);
}

[data-look^='2'] .section-head > div > *,
[data-look^='2'] .section-head > .section-lead,
[data-look^='2'] .about-text > * {
  transition: opacity 1s var(--ease), transform 1.1s var(--ease), clip-path 1.2s var(--ease);
}

[data-look^='2'] .section-head .section-title,
[data-look^='2'] .about-text > :nth-child(2) {
  transition-delay: 0.08s;
}

[data-look^='2'] .section-head .section-lead,
[data-look^='2'] .about-text > :nth-child(3) {
  transition-delay: 0.2s;
}

[data-look^='2'] .about-text > :nth-child(4) {
  transition-delay: 0.3s;
}

[data-look^='2'] .about-text > :nth-child(5) {
  transition-delay: 0.4s;
}

[data-look^='2'] .sec-num::after {
  transform-origin: var(--start) 50%;
  transition: transform 1.2s var(--ease) 0.25s;
}

/* Treatments: open rows; the photo is wiped in, the text follows, the line draws */
[data-look^='2'] .stack {
  gap: 0;
  border-top: 1px solid var(--line-strong);
}

[data-look^='2'] .stack-card,
[data-look^='2'] .stack-card:nth-child(n) {
  position: relative;
  top: auto;
  min-height: 0;
  padding: clamp(28px, 4vw, 52px) 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
  transform: none;
}

[data-look^='2'] .stack-card::after {
  inset: auto 0 0;
  height: 1px;
  z-index: 0;
  border-radius: 0;
  background: var(--line-strong);
  opacity: 1;
  transform-origin: var(--start) 50%;
  transition: transform 1.4s var(--ease) 0.1s;
}

[data-look^='2'] .stack-card:nth-child(even) .stack-img {
  order: 2;
}

[data-look^='2'] .stack-img {
  clip-path: inset(0);
  transition: clip-path 1.3s var(--ease) var(--card-d, 0s);
}

[data-look^='2'] .stack-img img {
  scale: 1.08;
  translate: 0 var(--py, 0px);
}

[data-look^='2'] .stack-body > * {
  transition: opacity 0.9s var(--ease), transform 1s var(--ease);
  transition-delay: calc(var(--card-d, 0s) + var(--row-d, 0s));
}

[data-look^='2'] .stack-body > :nth-child(2) {
  --row-d: 0.08s;
}

[data-look^='2'] .stack-body > :nth-child(3) {
  --row-d: 0.16s;
}

[data-look^='2'] .stack-body > :nth-child(4) {
  --row-d: 0.24s;
}

[data-look^='2'] .stack-num {
  margin-bottom: 14px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  color: var(--accent);
  -webkit-text-stroke: 0;
}

[data-look^='2'] .stack-name {
  font-weight: 500;
}

@media (max-width: 860px) {
  [data-look^='2'] .stack-card:nth-child(even) .stack-img {
    order: 0;
  }
}

/* Gallery: the photos arrive one after another */
[data-look^='2'] .mosaic-col {
  transform: none;
}

[data-look^='2'] .mosaic-col:nth-child(2) {
  margin-top: 0;
}

[data-look^='2'] .mosaic-item {
  border-radius: var(--radius);
  transition: opacity 0.9s var(--ease), transform 1.1s var(--ease);
  transition-delay: calc(var(--cd, 0s) + var(--rd, 0s));
}

[data-look^='2'] .mosaic-col:nth-child(2) .mosaic-item {
  --cd: 0.1s;
}

[data-look^='2'] .mosaic-col:nth-child(3) .mosaic-item {
  --cd: 0.2s;
}

[data-look^='2'] .mosaic-item:nth-child(2) {
  --rd: 0.15s;
}

[data-look^='2'] .mosaic-item:nth-child(3) {
  --rd: 0.3s;
}

/* About: an arch; a curtain lifts and the portrait warms into color */
[data-look^='2'] .about-photo .blob {
  position: relative;
  border-radius: 999px 999px var(--radius-lg) var(--radius-lg);
  animation: none;
}

[data-look^='2'] .about-photo .blob::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-soft);
  transform: scaleY(0);
  transform-origin: 50% 0;
  transition: transform 1.3s var(--ease) 0.1s;
  pointer-events: none;
}

[data-look^='2'] .about-photo .blob img {
  scale: 1.08;
  translate: 0 var(--py, 0px);
  transition: filter 1.8s var(--ease) 0.35s, scale 2s var(--ease) 0.1s;
}

[data-look^='2'] .final-card {
  border: 1px solid var(--line);
}

[data-look^='2'] .visit-address {
  text-wrap: balance;
}

[data-look^='2'] .final-card::before {
  content: '';
  position: absolute;
  z-index: 0;
  top: -45%;
  inset-inline-start: -20%;
  width: 70%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--glow-3) 85%, transparent), transparent 65%);
  pointer-events: none;
  animation: sun 22s ease-in-out infinite alternate;
}

/* The big name at the very bottom rises into view */
[data-look^='2'] .footer-mark span {
  transition: transform 1.6s var(--ease);
}

/* Buttons: a darker tone sweeps across on hover; a small press on touch */
[data-look^='2'] .btn-primary {
  isolation: isolate;
  overflow: hidden;
  background: var(--accent);
}

[data-look^='2'] .btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--accent-ink);
  transform: scaleX(0);
  transform-origin: var(--start) 50%;
  transition: transform 0.55s var(--ease);
}

@media (hover: hover) {
  [data-look^='2'] .btn-primary:hover::before {
    transform: none;
  }
}

[data-look^='2'] .btn:not([disabled]):active {
  transform: scale(0.97);
}

/* Desktop menu: a thin underline instead of a pill */
@media (min-width: 1141px) {
  [data-look^='2'] .main-nav a {
    position: relative;
  }

  [data-look^='2'] .main-nav a:hover,
  [data-look^='2'] .main-nav a.is-current,
  [data-look^='2'] .main-nav a[aria-current='page'] {
    background: none;
  }

  [data-look^='2'] .main-nav a::after {
    content: '';
    position: absolute;
    inset-inline: 14px;
    bottom: 5px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: var(--start) 50%;
    transition: transform 0.45s var(--ease);
  }

  [data-look^='2'] .main-nav a:hover::after,
  [data-look^='2'] .main-nav a.is-current::after,
  [data-look^='2'] .main-nav a[aria-current='page']::after {
    transform: none;
  }
}

/* The header slides in as the opening curtain lifts */
:root[data-look^='2']:has(.intro) .site-header {
  animation: header-in 1s var(--ease) calc(var(--intro) + 0.05s) backwards;
}

/* Waiting states for the scroll animations (only when motion is welcome) */
@media (prefers-reduced-motion: no-preference) {
  html.js:not(.a11y-still)[data-look^='2'] .section-head.reveal:not(.is-visible),
  html.js:not(.a11y-still)[data-look^='2'] .about-text.reveal:not(.is-visible),
  html.js:not(.a11y-still)[data-look^='2'] .about-photo.reveal:not(.is-visible),
  html.js:not(.a11y-still)[data-look^='2'] .mosaic.reveal:not(.is-visible),
  html.js:not(.a11y-still)[data-look^='2'] .footer-mark.reveal:not(.is-visible) {
    opacity: 1;
    transform: none;
    filter: none;
  }

  html.js:not(.a11y-still)[data-look^='2'] .reveal:not(.is-visible) .sec-num::after {
    transform: scaleX(0);
  }

  html.js:not(.a11y-still)[data-look^='2'] .reveal:not(.is-visible) .section-title {
    clip-path: inset(100% -6% 0 -6%);
    transform: translateY(0.4em);
  }

  html.js:not(.a11y-still)[data-look^='2'] .section-head.reveal:not(.is-visible) .sec-num,
  html.js:not(.a11y-still)[data-look^='2'] .section-head.reveal:not(.is-visible) .section-lead,
  html.js:not(.a11y-still)[data-look^='2'] .about-text.reveal:not(.is-visible) > :not(.section-title) {
    opacity: 0;
    transform: translateY(18px);
  }

  html.js:not(.a11y-still)[data-look^='2'] .reveal:not(.is-visible) {
    filter: none;
  }

  html.js:not(.a11y-still)[data-look^='2'] .stack-card:not(.is-in)::after {
    transform: scaleX(0);
  }

  html.js:not(.a11y-still)[data-look^='2'] .stack-card:not(.is-in) .stack-img {
    clip-path: inset(0 0 0 100%);
  }

  html.js:not(.a11y-still)[data-look^='2'] .stack-card:nth-child(even):not(.is-in) .stack-img {
    clip-path: inset(0 100% 0 0);
  }

  html.js:not(.a11y-still)[data-look^='2'] .stack-card:not(.is-in) .stack-body > * {
    opacity: 0;
    transform: translateY(22px);
  }

  html.js:not(.a11y-still)[data-look^='2'] .mosaic.reveal:not(.is-visible) .mosaic-item {
    opacity: 0;
    transform: translateY(44px) scale(0.96);
  }

  html.js:not(.a11y-still)[data-look^='2'] .about-photo.reveal:not(.is-visible) .blob::after {
    transform: none;
  }

  html.js:not(.a11y-still)[data-look^='2'] .about-photo.reveal:not(.is-visible) .blob img {
    scale: 1.3;
  }

  html.js:not(.a11y-still)[data-look^='2'] .footer-mark.reveal:not(.is-visible) span {
    transform: translateY(75%);
  }
}

:root[data-look='2b'][data-theme='dark'] {

  --glass: #21261c;
  --glass-strong: #21261c;
  --glass-border: #343b2c;
  --ink: #edf0e4;
  --ink-2: #d0d5c3;
  --muted: #9fa493;
  --line: rgb(237 240 228 / 0.12);

  --accent: #b7c58c;
  --accent-2: #cbd6a5;

html.js .reveal:not(.is-visible) {

  }

  }

  50% {

  }

  100% {

function svg(name, extraClass = '') {
  const body = PATHS[name] || PATHS.sparkle;
  const cls = extraClass ? ` class="${extraClass}"` : '';
  return `<svg${cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
}

/** Replace the contents of every [data-icon] element with its icon. */
function hydrateIcons(root = document) {
  for (const el of root.querySelectorAll('[data-icon]')) {
    el.innerHTML = svg(el.dataset.icon, el.dataset.iconClass || '');
  }
}

// Date helpers. All booking dates/times are stored as local wall-clock values
// ("YYYY-MM-DD" + "HH:MM") in the practice's time zone, which keeps slot math
// simple and immune to the server's own time zone.

const DAY_MS = 86_400_000;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

function isValidDate(s) {
  if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
  return new Date(parseDate(s)).toISOString().slice(0, 10) === s;
}

function isValidTime(s) {
  return typeof s === 'string' && TIME_RE.test(s);
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function dayIndex(s) {
  return Math.floor(parseDate(s) / DAY_MS);
}

function addDays(s, n) {
  return new Date(parseDate(s) + n * DAY_MS).toISOString().slice(0, 10);
}

/** 0 = Sunday … 6 = Saturday */
function weekday(s) {
  return new Date(parseDate(s)).getUTCDay();
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function fromMinutes(min) {
  const h = String(Math.floor(min / 60)).padStart(2, '0');
  const m = String(min % 60).padStart(2, '0');
  return `${h}:${m}`;
}

/** Current wall-clock date and minute-of-day in the given IANA time zone. */
function nowInZone(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    date: `${get('year')}-${get('month')}-${get('day')}`,
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}


/**
 * Free start times ("HH:MM") for one day.
 *
 * @param {object} p
 * @param {string} p.date          "YYYY-MM-DD" in the practice's time zone
 * @param {number} p.duration      session length in minutes
 * @param {object} p.schedule      { weeklyHours, slotInterval, bufferMinutes, minNoticeHours, maxDaysAhead }
 * @param {{start:number,end:number}[]} [p.dayBookings]  existing bookings that day, in minutes
 * @param {boolean} [p.blocked]    whole day blocked (vacation, holiday…)
 * @param {{date:string,minutes:number}} p.now  current local date/time
 */
function slotsForDay({ date, duration, schedule, dayBookings = [], blocked = false, now }) {
  if (blocked) return [];

  const today = dayIndex(now.date);
  const day = dayIndex(date);
  if (day < today || day > today + schedule.maxDaysAhead) return [];

  const earliest = today * 1440 + now.minutes + schedule.minNoticeHours * 60;
  const buffer = schedule.bufferMinutes;
  const ranges = schedule.weeklyHours[String(weekday(date))] || [];
  const slots = [];

  for (const [from, to] of ranges) {
    const end = toMinutes(to);
    for (let t = toMinutes(from); t + duration <= end; t += schedule.slotInterval) {
      if (day * 1440 + t < earliest) continue;
      const clash = dayBookings.some((b) => t < b.end + buffer && b.start < t + duration + buffer);
      if (!clash) slots.push(fromMinutes(t));
    }
  }
  return slots;
}

const root = document.documentElement;
const listeners = new Set();

function storageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    /* private mode – ignore */
  }
}

// ---------------------------------------------------------------------------
// Language
// ---------------------------------------------------------------------------

function getLang() {
  return root.lang === 'en' ? 'en' : 'he';
}

function locale() {
  return getLang() === 'he' ? 'he-IL' : 'en-GB';
}

/** Look up "section.key" in the current language; `{name}` placeholders are filled from vars. */
function t(path, vars) {
  const lookup = (lang) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), dictionaries[lang]);
  let str = lookup(getLang()) ?? lookup('he') ?? path;
  if (vars) str = str.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
  return str;
}

/** Pick the current language out of a { he, en } object from the config. */
function pick(obj) {
  if (obj == null || typeof obj === 'string') return obj ?? '';
  return obj[getLang()] ?? obj.he ?? '';
}

function onLangChange(fn) {
  listeners.add(fn);
}

function setLang(lang) {
  root.lang = lang;
  root.dir = lang === 'he' ? 'rtl' : 'ltr';
  storageSet('lang', lang);
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) {
    url.searchParams.delete('lang');
    history.replaceState(null, '', url);
  }
  applyTranslations();
  listeners.forEach((fn) => fn(lang));
}

/**
 * Fill text from the dictionary:
 *   data-i18n="section.key"                     → textContent
 *   data-i18n-attr="placeholder:key;aria-label:key" → attributes
 */
function applyTranslations(scope = document) {
  for (const el of scope.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of scope.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':').map((s) => s.trim());
      if (attr && key) el.setAttribute(attr, t(key));
    }
  }
  const titleKey = document.body.dataset.titleKey;
  if (titleKey && siteConfig) document.title = `${t(titleKey)} | ${pick(siteConfig.business.name)}`;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.content = t('meta.description');
  updateToggles();
  renderBusiness();
  renderStatus();
}

// ---------------------------------------------------------------------------
// Opening hours: "open now" / "opens tomorrow at…" from the weekly schedule
// ---------------------------------------------------------------------------

const hhmmToMinutes = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};

/** Day of week (0 = Sunday) and minute of the day in the clinic's time zone. */
function clinicNow(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone,
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(get('weekday')),
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}

function dayName(day, style = 'long') {
  return new Intl.DateTimeFormat(locale(), { weekday: style, timeZone: 'UTC' }).format(new Date(Date.UTC(2023, 0, 1 + day)));
}

function clinicStatus(cfg = siteConfig, at = new Date()) {
  if (!cfg?.hours) return null;
  const now = clinicNow(cfg.timezone, at);
  for (const [from, to] of cfg.hours[now.day] || []) {
    if (now.minutes >= hhmmToMinutes(from) && now.minutes < hhmmToMinutes(to)) return { open: true, until: to, today: now.day };
  }
  for (let offset = 0; offset < 8; offset++) {
    const day = (now.day + offset) % 7;
    for (const [from] of cfg.hours[day] || []) {
      if (offset > 0 || hhmmToMinutes(from) > now.minutes) return { open: false, day, offset, at: from, today: now.day };
    }
  }
  return { open: false, today: now.day };
}

function renderStatus() {
  const s = clinicStatus();
  if (!s) return;
  const text = s.open
    ? t('status.open', { time: s.until })
    : s.at == null
      ? ''
      : s.offset === 0
        ? t('status.today', { time: s.at })
        : s.offset === 1
          ? t('status.tomorrow', { time: s.at })
          : t('status.later', { day: dayName(s.day), time: s.at });
  for (const node of document.querySelectorAll('[data-status]')) {
    node.textContent = text;
    node.classList.toggle('is-open', s.open);
    node.hidden = !text;
  }
}

// Small UI helpers

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v; // only ever used with trusted icon markup
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c);
  return node;
}

async function serverApi(url, { method = 'GET', body } = {}) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/** Mark invalid fields in a form. `fields` are server field names. */
function showFieldErrors(form, fields = []) {
  for (const f of form.querySelectorAll('.has-error')) f.classList.remove('has-error');
  for (const e of form.querySelectorAll('.field-error')) e.remove();
  let first = null;
  for (const name of new Set(fields)) {
    const input = form.elements[name];
    if (!input) continue;
    const wrap = input.closest('.field, .checkbox');
    wrap?.classList.add('has-error');
    input.setAttribute('aria-invalid', 'true');
    if (wrap?.classList.contains('field')) {
      const id = `${input.id}-error`;
      wrap.append(el('span', { class: 'field-error', id, role: 'alert' }, t(`errors.${name}`)));
      input.setAttribute('aria-describedby', id);
    }
    first ??= input;
  }
  first?.focus();
}

function clearFieldErrors(form) {
  showFieldErrors(form, []);
  for (const i of form.querySelectorAll('[aria-invalid]')) {
    i.removeAttribute('aria-invalid');
    i.removeAttribute('aria-describedby');
  }
}

function toast(message) {
  const node = el('div', { class: 'toast', role: 'status' }, message);
  document.body.append(node);
  setTimeout(() => node.remove(), 2600);
}

function initHeader() {
  const header = document.querySelector('.site-header');
  const nav = document.getElementById('main-nav');
  const toggle = document.getElementById('nav-toggle');

  if (header) {
    const progress = header.querySelector('.scroll-progress');
    const a11yToggle = document.getElementById('a11y-toggle');
    let queued = false;
    let anchorY = window.scrollY;
    const onScroll = () => {
      queued = false;
      const y = window.scrollY;
      header.classList.toggle('is-scrolled', y > 8);
      // Slide the header away while reading down the page; bring it back on the way up.
      const busy =
        nav?.classList.contains('is-open') ||
        a11yToggle?.getAttribute('aria-expanded') === 'true' ||
        header.contains(document.activeElement);
      if (y < 320 || busy) {
        header.classList.remove('is-hidden');
        anchorY = y;
      } else if (y - anchorY > 12) {
        header.classList.add('is-hidden');
        anchorY = y;
      } else if (anchorY - y > 12) {
        header.classList.remove('is-hidden');
        anchorY = y;
      }
      if (progress) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        progress.style.setProperty('--progress', String(max > 0 ? Math.min(1, window.scrollY / max) : 0));
      }
    };
    onScroll();
    header.addEventListener('focusin', () => header.classList.remove('is-hidden'));
    window.addEventListener(
      'scroll',
      () => {
        if (!queued) {
          queued = true;
          requestAnimationFrame(onScroll);
        }
      },
      { passive: true },
    );
  }

  if (nav && toggle) {
    const setOpen = (open) => {
      nav.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.innerHTML = svg(open ? 'close' : 'menu');
    };
    toggle.addEventListener('click', () => setOpen(!nav.classList.contains('is-open')));
    nav.addEventListener('click', (e) => e.target.closest('a') && setOpen(false));
    document.addEventListener('keydown', (e) => e.key === 'Escape' && setOpen(false));
  }

  // Theme switch: a soft circle that ripples out from the button (where supported).
  document.getElementById('theme-toggle')?.addEventListener('click', (e) => {
    const next = getTheme() === 'dark' ? 'light' : 'dark';
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches || root.classList.contains('a11y-still');
    if (!document.startViewTransition || still) return setTheme(next);
    const x = e.clientX || window.innerWidth / 2;
    const y = e.clientY || 40;
    const radius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    const transition = document.startViewTransition(() => setTheme(next));
    transition.ready
      .then(() =>
        root.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
          { duration: 750, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', pseudoElement: '::view-transition-new(root)' },
        ),
      )
      .catch(() => {});
  });
  document.getElementById('lang-toggle')?.addEventListener('click', () =>
    setLang(getLang() === 'he' ? 'en' : 'he'),
  );
}
