/* ---------- Accessibility menu modes ---------- */

html.a11y-text-1 {
  font-size: 112.5%;
}

html.a11y-text-2 {
  font-size: 125%;
}

html.a11y-contrast {
  --muted: var(--ink);
  --ink-2: var(--ink);
  --line: var(--line-strong);
  --line-strong: var(--ink);
  --glass: var(--surface);
  --glass-strong: var(--surface);
}

html.a11y-links a {
  text-decoration: underline !important;
  text-underline-offset: 3px;
}

html.a11y-font {
  --font-display: var(--font-body);
}

html.a11y-still *,
html.a11y-still *::before,
html.a11y-still *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}

/* ==========================================================================
   Base
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 12px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  font-weight: 400;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 400;
  line-height: 1.12;
  text-wrap: balance;
}

p {
  margin: 0 0 1em;
}

a {
  color: inherit;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

img,
svg {
  display: block;
  max-width: 100%;
}

img {
  height: auto;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 10px;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

[hidden] {
  display: none !important;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  inset-inline-start: 12px;
  top: -60px;
  z-index: 100;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  transition: top 0.2s;
}

.skip-link:focus {
  top: 12px;
}

.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

[dir='rtl'] .flip-rtl {
  transform: scaleX(-1);
}

.flip-rtl {
  display: inline-flex;
}

bdi {
  unicode-bidi: isolate;
}

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: var(--shadow-soft);
}

.kicker,
.pill-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px;
  padding: 6px 16px 6px 14px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  font-size: var(--fs-xs);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--accent-ink);
}

.kicker::before,
.pill-label::before {
  content: '';
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.caption {
  margin-top: 14px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.grad {
  background: linear-gradient(100deg, var(--accent-ink) 10%, var(--accent-2) 55%, var(--accent-ink) 90%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: sheen 9s ease-in-out infinite;
}

/* ==========================================================================
   Buttons
   ========================================================================== */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6em;
  min-height: 52px;
  padding: 0.7em 1.6em;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background-color 0.25s, border-color 0.25s, color 0.25s;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  color: var(--on-accent);
  box-shadow: 0 14px 30px -14px color-mix(in srgb, var(--accent) 80%, transparent);
}

.btn-primary:hover {
  box-shadow: 0 20px 38px -14px color-mix(in srgb, var(--accent) 90%, transparent);
}

.btn-soft,
.btn-outline {
  background: var(--glass);
  border-color: var(--glass-border);
  color: var(--ink);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow-soft);
}

.btn-outline {
  background: transparent;
  border-color: var(--line-strong);
  box-shadow: none;
  backdrop-filter: none;
}

.btn-outline:hover,
.btn-soft:hover {
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  padding-inline: 0.9em;
}

.btn-ghost:hover {
  background: var(--accent-soft);
  transform: none;
}

.btn-danger {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--danger);
}

.btn-danger:hover {
  background: var(--danger-soft);
  border-color: var(--danger);
}

.btn-light {
  background: var(--surface);
  color: var(--accent-ink);
  box-shadow: var(--shadow-soft);
}

.btn-sm {
  min-height: 40px;
  padding: 0.45em 1.1em;
  font-size: 0.92rem;
}

.btn-block {
  width: 100%;
}

.btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-arrow .flip-rtl svg {
  transition: transform 0.35s var(--ease);
}

.btn-arrow:hover .flip-rtl svg {
  transform: translateX(4px);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--glass);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.35s var(--ease), border-color 0.2s, background-color 0.2s, color 0.2s;
}

.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent-ink);
  transform: translateY(-1px);
}

.icon-btn[aria-expanded='true'] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

.icon-btn[disabled] {
  opacity: 0.35;
  cursor: default;
  transform: none;
}

.linklike {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ==========================================================================
   Header: a floating glass bar
   ========================================================================== */

.site-header {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  z-index: 50;
  height: 64px;
  margin-top: 12px;
  padding-inline: var(--gutter);
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: var(--container);
  height: 100%;
  margin-inline: auto;
  padding: 0 10px 0 22px;
  border-radius: 999px;
  background: var(--header-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: var(--shadow-soft);
  transition: box-shadow 0.3s;
}

[dir='rtl'] .header-inner {
  padding: 0 22px 0 10px;
}

.site-header.is-scrolled .header-inner {
  box-shadow: var(--shadow-lift);
}

.scroll-progress {
  position: absolute;
  inset-inline: 28px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transform: scaleX(var(--progress, 0));
  transform-origin: right;
  pointer-events: none;
}

[dir='ltr'] .scroll-progress {
  transform-origin: left;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  color: var(--ink);
  text-decoration: none;
}

.brand-orb {
  position: relative;
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--glow-1), var(--glow-2), var(--glow-3), var(--glow-1));
  animation: spin 14s linear infinite;
}

.brand-orb::after {
  content: '';
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--accent-2) 55%, var(--accent));
  box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent);
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.1;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.55rem;
  line-height: 1;
  white-space: nowrap;
}

.brand-tagline {
  font-size: 0.7rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.main-nav {
  margin-inline-start: auto;
}

.main-nav ul {
  display: flex;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-nav a {
  display: block;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--ink-2);
  font-size: 0.95rem;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.25s, color 0.25s;
}

.main-nav a:hover,
.main-nav a.is-current,
.main-nav a[aria-current='page'] {
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-actions .btn {
  min-height: 44px;
}

.nav-toggle {
  display: none;
}

@media (max-width: 1140px) {
  .nav-toggle {
    display: inline-grid;
  }

  .main-nav {
    position: absolute;
    top: calc(100% + 10px);
    inset-inline: 0;
    padding: 10px;
    border-radius: var(--radius-lg);
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: var(--shadow-lift);
    transform: translateY(-8px) scale(0.98);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s var(--ease), transform 0.3s var(--ease), visibility 0.3s;
  }

  .main-nav.is-open {
    transform: none;
    opacity: 1;
    visibility: visible;
  }

  .main-nav ul {
    flex-direction: column;
  }

  .main-nav a {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 1.1rem;
  }

  .header-actions {
    margin-inline-start: auto;
  }
}

@media (max-width: 600px) {
  .brand-tagline,
  .header-cta {
    display: none;
  }

  .header-inner,
  [dir='rtl'] .header-inner {
    padding-inline: 16px 8px;
    gap: 10px;
  }

  [dir='rtl'] .header-inner {
    padding-inline: 16px 8px;
  }

  .header-actions {
    gap: 6px;
  }

  .header-actions .icon-btn {
    width: 40px;
    height: 40px;
  }
}

/* ==========================================================================
   Sections
   ========================================================================== */

.section {
  position: relative;
  padding-block: var(--section);
}

.section-alt {
  background: linear-gradient(180deg, transparent, var(--bg-2) 18%, var(--bg-2) 82%, transparent);
}

.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 20px 56px;
  align-items: end;
  margin-bottom: clamp(40px, 6vw, 72px);
}

.section-head.center {
  grid-template-columns: 1fr;
  justify-items: center;
  text-align: center;
}

.section-title {
  font-family: var(--font-display);
  font-size: var(--fs-title);
  line-height: 1.04;
}

.section-lead {
  max-width: 48ch;
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 300;
  line-height: 1.65;
  color: var(--ink-2);
}

@media (max-width: 820px) {
  .section-head {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Drifting light (aurora)
   ========================================================================== */

.aurora {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.aurora span {
  position: absolute;
  width: 52vmax;
  aspect-ratio: 1;
  border-radius: 50%;
  opacity: 0.85;
  animation: drift 28s ease-in-out infinite alternate;
  will-change: transform;
}

.aurora span:nth-child(1) {
  top: -22vmax;
  inset-inline-start: -14vmax;
  background: radial-gradient(circle, var(--glow-1) 0%, transparent 62%);
}

.aurora span:nth-child(2) {
  top: -10vmax;
  inset-inline-end: -18vmax;
  background: radial-gradient(circle, var(--glow-2) 0%, transparent 62%);
  animation-duration: 34s;
  animation-delay: -9s;
}

.aurora span:nth-child(3) {
  bottom: -28vmax;
  inset-inline-start: 22%;
  background: radial-gradient(circle, var(--glow-3) 0%, transparent 60%);
  animation-duration: 40s;
  animation-delay: -16s;
}

.aurora span:nth-child(4) {
  width: 34vmax;
  top: 30%;
  inset-inline-start: 38%;
  background: radial-gradient(circle, var(--glow-4) 0%, transparent 60%);
  animation-duration: 24s;
  animation-delay: -4s;
}

/* ==========================================================================
   Hero
   ========================================================================== */

.hero {
  position: relative;
  margin-top: calc(-64px - 12px);
  padding-block: calc(64px + clamp(56px, 8vw, 110px)) clamp(72px, 9vw, 120px);
  overflow: hidden;
  isolation: isolate;
}

.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 40%), var(--cursor-glow), transparent 60%);
  pointer-events: none;
  transition: opacity 0.6s;
}

.hero-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: clamp(40px, 6vw, 96px);
  align-items: center;
}

.hero-title {
  margin: 0 0 26px;
  font-family: var(--font-display);
  font-size: var(--fs-hero);
  line-height: 1.02;
}

.hero-title .line {
  display: block;
  animation: blur-in 1.2s var(--ease) both;
}

.hero-title .line:nth-child(2) {
  animation-delay: 0.15s;
}

.hero-lead {
  max-width: 42ch;
  margin-bottom: 34px;
  font-size: var(--fs-md);
  font-weight: 300;
  line-height: 1.7;
  color: var(--ink-2);
  animation: blur-in 1.2s var(--ease) 0.3s both;
}

.hero-ctas {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  animation: blur-in 1.2s var(--ease) 0.42s both;
}

.hero-ctas.center {
  justify-content: center;
  animation: none;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px 24px;
  margin-top: 34px;
  animation: blur-in 1.2s var(--ease) 0.55s both;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  font-size: var(--fs-sm);
  color: var(--ink-2);
}

.status::before {
  content: '';
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--muted);
  opacity: 0.6;
}

.status.is-open::before {
  background: var(--open);
  opacity: 1;
  animation: ping 2.4s ease-out infinite;
}

.hero-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.hero-facts li {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-facts svg {
  width: 16px;
  height: 16px;
  color: var(--accent);
}

.hero-visual {
  position: relative;
  justify-self: center;
  width: min(100%, 500px);
  aspect-ratio: 1 / 1.08;
  animation: blur-in 1.4s var(--ease) 0.2s both;
}

.blob {
  overflow: hidden;
  border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
  background: var(--photo-bg);
  animation: morph 16s ease-in-out infinite;
}

.blob img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-photo {
  position: absolute;
  inset: 4% 2% 10% 6%;
  box-shadow: var(--shadow-lift);
}

.hero-halo {
  position: absolute;
  inset: 0 0 6% 2%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--glow-1), transparent 66%);
  filter: blur(10px);
  opacity: 0.9;
  animation: breathe-soft 8s ease-in-out infinite;
}

.hero-card {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px 12px 12px;
  border-radius: 999px;
  font-size: var(--fs-sm);
  line-height: 1.3;
  animation: bob 7s ease-in-out infinite;
}

[dir='rtl'] .hero-card {
  padding: 12px 12px 12px 18px;
}

.hero-card strong {
  display: block;
  font-weight: 500;
}

.hero-card span {
  color: var(--muted);
}

.hero-card .avatar {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--surface);
}

.hero-card .bubble {
  display: grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.hero-card .bubble svg {
  width: 22px;
  height: 22px;
}

.card-a {
  inset-inline-start: -6%;
  bottom: 8%;
}

.card-b {
  inset-inline-end: -4%;
  top: 6%;
  animation-delay: -3.5s;
}

@media (max-width: 900px) {
  .hero {
    padding-top: calc(64px + 48px);
  }

  .hero-grid {
    grid-template-columns: 1fr;
  }

  .hero-visual {
    width: min(100%, 420px);
  }

  .card-a {
    inset-inline-start: 0;
  }

  .card-b {
    inset-inline-end: 0;
  }
}

/* ---------- Techniques: a slow, soft stream of pills ---------- */

.stream {
  position: relative;
  overflow: hidden;
  padding-block: 8px 24px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
}

.stream-track {
  display: flex;
  width: max-content;
  animation: marquee 60s linear infinite;
}

[dir='ltr'] .stream-track {
  animation-name: marquee-ltr;
}

.stream:hover .stream-track {
  animation-play-state: paused;
}

.stream-group {
  display: flex;
  gap: 14px;
  margin: 0;
  padding: 0 0 0 14px;
  list-style: none;
}

.stream-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 24px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: var(--shadow-soft);
}

.stream-item::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}

/* ==========================================================================
   Body map
   ========================================================================== */

.bodymap {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
  gap: clamp(24px, 4vw, 56px);
  align-items: center;
  padding: clamp(16px, 3vw, 40px);
  border-radius: var(--radius-xl);
}

.bodymap-figure {
  position: relative;
  margin: 0;
  padding: clamp(8px, 2vw, 24px);
  border-radius: var(--radius-lg);
  background: radial-gradient(circle at 50% 40%, var(--accent-soft), transparent 70%);
}

.bodymap-figure svg {
  width: 100%;
  height: auto;
  max-height: 600px;
  margin-inline: auto;
}

.fig-body {
  fill: url(#body-fill);
  stroke: var(--line-strong);
  stroke-width: 1.4;
  stroke-linejoin: round;
}

.body-stop-1 {
  stop-color: var(--surface);
}

.body-stop-2 {
  stop-color: var(--glow-1);
}

.fig-detail {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.2;
  stroke-linecap: round;
}

.fig-spine {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-dasharray: 0.1 9;
  opacity: 0.45;
}

.pt {
  cursor: pointer;
}

.pt .core {
  fill: var(--surface);
  stroke: var(--accent);
  stroke-width: 1.6;
  transition: fill 0.3s, r 0.3s;
}

.pt .halo {
  fill: var(--accent);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.pt:hover .core {
  fill: var(--accent-soft);
}

.pt.is-active .core {
  fill: var(--accent);
  r: 7px;
}

.pt.is-active .halo {
  animation: halo 2.2s ease-out infinite;
}

.annot line {
  stroke: var(--accent);
  stroke-width: 1.2;
  stroke-dasharray: 3 4;
}

.annot circle {
  fill: var(--accent);
}

.annot text {
  fill: var(--accent-ink);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
}

.zones {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}

.zone {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 8px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--glass);
  font-weight: 400;
  cursor: pointer;
  transition: background-color 0.3s var(--ease), border-color 0.3s, color 0.3s, transform 0.3s var(--ease);
}

.zone:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.zone[aria-pressed='true'] {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  border-color: transparent;
  color: var(--on-accent);
  box-shadow: 0 12px 26px -14px var(--accent);
}

.match {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 6px 22px;
  align-items: start;
  padding: 24px;
  border-radius: var(--radius-lg);
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  animation: blur-in 0.6s var(--ease) both;
}

.match-img {
  grid-row: span 4;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--photo-bg);
}

.match-label {
  margin: 0;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--accent-ink);
}

.match-name {
  font-family: var(--font-display);
  font-size: clamp(2rem, 3.6vw, 2.6rem);
  line-height: 1.05;
}

.match-desc {
  margin: 4px 0 0;
  color: var(--ink-2);
}

.match-note {
  margin: 0 0 14px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.match .btn {
  grid-column: 2;
  justify-self: start;
}

@media (max-width: 900px) {
  .bodymap {
    grid-template-columns: 1fr;
  }

  .bodymap-figure svg {
    max-height: 440px;
  }
}

@media (max-width: 520px) {
  .match {
    grid-template-columns: 72px minmax(0, 1fr);
    padding: 18px;
  }

  .match-img {
    width: 72px;
    height: 72px;
    grid-row: span 2;
  }

  .match .btn,
  .match-desc,
  .match-note {
    grid-column: 1 / -1;
  }
}

/* ==========================================================================
   Treatments: cards that stack as you scroll
   ========================================================================== */

.stack {
  display: grid;
  gap: 28px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.stack-card {
  position: sticky;
  top: calc(var(--header-h) + 20px + var(--i, 0) * 16px);
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(24px, 4vw, 56px);
  align-items: center;
  min-height: 440px;
  padding: clamp(20px, 3vw, 36px);
  border-radius: var(--radius-xl);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-lift);
  overflow: hidden;
}

.stack-card:nth-child(3n + 1) {
  background: linear-gradient(140deg, var(--surface) 30%, color-mix(in srgb, var(--glow-1) 70%, var(--surface)));
}

.stack-card:nth-child(3n + 2) {
  background: linear-gradient(140deg, var(--surface) 30%, color-mix(in srgb, var(--glow-2) 70%, var(--surface)));
}

.stack-card:nth-child(3n + 3) {
  background: linear-gradient(140deg, var(--surface) 30%, color-mix(in srgb, var(--glow-3) 70%, var(--surface)));
}

.stack-img {
  position: relative;
  height: 100%;
  min-height: 300px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--photo-bg);
}

.stack-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1.2s var(--ease);
}

.stack-card:hover .stack-img img {
  transform: scale(1.04);
}

.stack-num {
  display: inline-block;
  margin-bottom: 14px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--accent-ink);
  letter-spacing: 0.1em;
}

.stack-name {
  margin-bottom: 14px;
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 4.4vw, 3.6rem);
  line-height: 1.04;
}

.stack-desc {
  max-width: 54ch;
  margin-bottom: 18px;
  color: var(--ink-2);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 22px;
  padding: 0;
  list-style: none;
}

.tag {
  padding: 5px 14px;
  border-radius: 999px;
  background: var(--glass-strong);
  border: 1px solid var(--line);
  font-size: 0.82rem;
  color: var(--ink-2);
  white-space: nowrap;
}

.stack-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px 22px;
}

.duration {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.duration svg {
  width: 16px;
  height: 16px;
}

.stat {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 0 18px;
}

.stat-value {
  font-family: var(--font-display);
  font-size: clamp(3.4rem, 6vw, 4.6rem);
  line-height: 0.9;
  color: var(--accent-ink);
}

.stat-label {
  font-size: var(--fs-sm);
  color: var(--muted);
}

.addons {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 32px 0 0;
  color: var(--muted);
  font-size: var(--fs-sm);
}

@media (max-width: 860px) {
  .stack-card {
    position: relative;
    top: auto;
    grid-template-columns: 1fr;
    min-height: 0;
  }

  .stack-img {
    min-height: 0;
    aspect-ratio: 16 / 10;
  }
}

/* ==========================================================================
   Breathing exercise
   ========================================================================== */

.breathe {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(32px, 5vw, 72px);
  align-items: center;
  padding: clamp(28px, 5vw, 64px);
  border-radius: var(--radius-xl);
  overflow: hidden;
  isolation: isolate;
}

.breathe .aurora span {
  width: 36vmax;
  opacity: 0.7;
}

.breathe-text {
  position: relative;
  z-index: 1;
}

.breathe-text .section-title {
  margin-bottom: 18px;
}

.breathe-text .section-lead {
  margin-bottom: 28px;
}

.breathe-note {
  margin: 16px 0 0;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.breathe-stage {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  width: min(100%, 420px);
  justify-self: center;
}

.breathe-ring,
.breathe-ring::before {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed var(--line-strong);
}

.breathe-ring::before {
  content: '';
  inset: 22%;
  border-style: solid;
  border-color: var(--line);
}

.breathe-circle {
  position: relative;
  display: grid;
  place-items: center;
  align-content: center;
  width: 78%;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, rgb(255 255 255 / 0.85), transparent 45%),
    radial-gradient(circle, var(--accent-2), var(--accent) 70%);
  color: var(--on-accent);
  text-align: center;
  box-shadow: 0 30px 80px -20px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 -20px 40px rgb(0 0 0 / 0.08);
  transform: scale(var(--breath, 0.62));
  transition: transform var(--breath-time, 1.2s) cubic-bezier(0.45, 0, 0.55, 1);
}

.breathe-circle .phase {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.8rem);
  line-height: 1.1;
}

.breathe-circle .count {
  min-height: 1.6em;
  font-size: 1.1rem;
  font-variant-numeric: tabular-nums;
  opacity: 0.85;
}

.breathe:not(.is-running) .breathe-circle {
  animation: breathe-idle 7s ease-in-out infinite;
}

@media (max-width: 820px) {
  .breathe {
    grid-template-columns: 1fr;
  }

  .breathe-stage {
    width: min(100%, 320px);
  }
}

/* ==========================================================================
   About
   ========================================================================== */

.about {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(36px, 6vw, 96px);
  align-items: center;
}

.about-photo {
  position: relative;
  margin: 0;
}

.about-photo .blob {
  aspect-ratio: 4 / 5;
  box-shadow: var(--shadow-lift);
  animation-duration: 20s;
}

.about-photo .hero-card {
  inset-inline-end: -4%;
  bottom: 10%;
}

.about-text .section-title {
  margin-bottom: 26px;
}

.about-text p {
  max-width: 62ch;
  color: var(--ink-2);
}

.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 32px 0 0;
}

.fact {
  padding: 16px 20px;
  border-radius: var(--radius);
  background: var(--glass);
  border: 1px solid var(--glass-border);
}

.fact dt {
  font-size: var(--fs-xs);
  color: var(--muted);
}

.fact dd {
  margin: 2px 0 0;
  font-weight: 500;
}

.fact.wide {
  grid-column: 1 / -1;
}

.quote {
  position: relative;
  margin: clamp(56px, 8vw, 104px) auto 0;
  max-width: 900px;
  text-align: center;
}

.quote blockquote {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 4.6vw, 3.8rem);
  line-height: 1.15;
}

.quote figcaption {
  margin-top: 18px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

@media (max-width: 900px) {
  .about {
    grid-template-columns: 1fr;
  }

  .about-photo {
    max-width: 440px;
  }

  .facts {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Process: a line that draws itself as you scroll
   ========================================================================== */

.process {
  position: relative;
}

.process-line {
  position: absolute;
  inset-inline: 0;
  top: 0;
  width: 100%;
  height: 120px;
  overflow: visible;
  pointer-events: none;
}

.process-line path {
  fill: none;
  stroke: url(#process-grad);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.process-line .track {
  stroke: var(--line);
}

.process-stop-1 {
  stop-color: var(--accent);
}

.process-stop-2 {
  stop-color: var(--accent-2);
}

.steps {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
  margin: 0;
  padding: 92px 0 0;
  list-style: none;
}

.step {
  position: relative;
  padding: 28px;
  border-radius: var(--radius-lg);
  background: var(--glass);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-soft);
  transition: transform 0.6s var(--ease), box-shadow 0.6s var(--ease);
}

.step-node {
  position: absolute;
  top: -58px;
  inset-inline-start: 28px;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--muted);
  transition: background-color 0.5s var(--ease), color 0.5s, border-color 0.5s, transform 0.5s var(--ease);
}

.step.is-lit .step-node {
  background: linear-gradient(135deg, var(--accent), var(--accent-ink));
  border-color: transparent;
  color: var(--on-accent);
  transform: scale(1.12);
}

.step.is-lit {
  box-shadow: var(--shadow-lift);
}

.step h3 {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 3.2vw, 2.6rem);
}

.step p {
  margin: 0;
  color: var(--ink-2);
}

@media (max-width: 820px) {
  .process-line {
    display: none;
  }

  .steps {
    grid-template-columns: 1fr;
    gap: 18px;
    padding: 0;
    padding-inline-start: 56px;
  }

  .steps::before {
    content: '';
    position: absolute;
    top: 8px;
    bottom: 8px;
    inset-inline-start: 19px;
    width: 2px;
    border-radius: 2px;
    background: linear-gradient(var(--accent), var(--accent-2)) top / 100% calc(var(--p, 0) * 100%) no-repeat, var(--line);
  }

  .step-node {
    top: 24px;
    inset-inline-start: -56px;
  }
}

/* ==========================================================================
   Gallery: a swipeable carousel + full-screen viewer
   ========================================================================== */

.carousel-wrap {
  position: relative;
}

.carousel {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  padding: 8px max(var(--gutter), calc((100vw - var(--container)) / 2 + var(--gutter))) 24px;
  cursor: grab;
}

.carousel::-webkit-scrollbar {
  display: none;
}

.carousel.is-dragging {
  scroll-snap-type: none;
  scroll-behavior: auto;
  cursor: grabbing;
}

.carousel-item {
  position: relative;
  flex: 0 0 clamp(240px, 30vw, 380px);
  aspect-ratio: 4 / 5;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--photo-bg);
  scroll-snap-align: center;
  cursor: zoom-in;
  box-shadow: var(--shadow-soft);
  transition: transform 0.6s var(--ease), box-shadow 0.6s var(--ease);
}

.carousel-item:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lift);
}

.carousel-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.carousel-item .cap {
  position: absolute;
  inset-inline: 12px;
  bottom: 12px;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--glass-strong);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--ink);
  font-size: 0.82rem;
  text-align: center;
}

.carousel-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 8px;
}

.carousel-progress {
  flex: 1;
  height: 3px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}

.carousel-progress span {
  display: block;
  height: 100%;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transform: scaleX(var(--p, 0.15));
  transform-origin: right;
  transition: transform 0.3s var(--ease);
}

[dir='ltr'] .carousel-progress span {
  transform-origin: left;
}

.lightbox {
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: rgb(8 14 12 / 0.9);

.lightbox[open] {

.lightbox::backdrop {

}

.lightbox-inner {

}

.lightbox-top {

.lightbox figure {

.hours-table {

.prep {

/* ==========================================================================
   FAQ: answers open smoothly
   ========================================================================== */

.faq-wrap {
  display: grid;

.faq {

.faq details {
  border-radius: var(--radius);

}

}

.faq summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding: 20px 24px;
  font-size: 1.08rem;
  font-weight: 500;
  cursor: pointer;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: '';
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background:
    linear-gradient(var(--accent-ink), var(--accent-ink)) center / 11px 1.6px no-repeat,
    linear-gradient(var(--accent-ink), var(--accent-ink)) center / 1.6px 11px no-repeat,
    var(--accent-soft);
  transition: transform 0.45s var(--ease);
}

.faq details[open] summary::after {

}

.faq details::details-content {

}

.faq details p {

/* ==========================================================================
   Motion
   ========================================================================== */

html.js .reveal:not(.is-visible) {
  opacity: 0;
  transform: translateY(26px);
  filter: blur(6px);
}

.reveal {
  transition: opacity 1s var(--ease), transform 1s var(--ease), filter 1s var(--ease);
  transition-delay: var(--delay, 0s);
}

.delay-1 {
  --delay: 0.12s;
}

.delay-2 {
  --delay: 0.24s;
}

::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}

@keyframes blur-in {
  from {
    opacity: 0;
    transform: translateY(18px);
    filter: blur(8px);
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
}

@keyframes drift {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }

  50% {
    transform: translate3d(7vmax, 4vmax, 0) scale(1.14);
  }

  100% {
    transform: translate3d(-5vmax, -3vmax, 0) scale(0.92);
  }
}

@keyframes morph {
  0%,
  100% {
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
  }

  33% {
    border-radius: 63% 37% 41% 59% / 55% 61% 39% 45%;
  }

  66% {
    border-radius: 37% 63% 52% 48% / 38% 36% 64% 62%;
  }
}

@keyframes bob {
  50% {
    transform: translateY(-10px);
  }
}

@keyframes breathe-soft {
  50% {
    transform: scale(1.05);
  }
}

@keyframes breathe-idle {
  0%,
  100% {
    transform: scale(0.62);
  }

  50% {
    transform: scale(0.68);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes sheen {
  50% {
    background-position: 100% 0;
  }
}

@keyframes halo {
  0% {
    opacity: 0.45;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(3.4);
  }
}

@keyframes ping {
  0% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--open) 55%, transparent);
  }

  100% {
    box-shadow: 0 0 0 10px transparent;
  }
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
}

@keyframes marquee {
  to {
    transform: translateX(33.3333%);
  }
}

@keyframes marquee-ltr {
  to {
    transform: translateX(-33.3333%);
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .stream-track,
  .aurora span {
    animation: none;
  }

  html.js .reveal:not(.is-visible) {
    opacity: 1;
    transform: none;
    filter: none;
  }
}

// Date helpers. All booking dates/times are stored as local wall-clock values
// ("YYYY-MM-DD" + "HH:MM") in the practice's time zone, which keeps slot math
// simple and immune to the server's own time zone.

const DAY_MS = 86_400_000;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

function isValidDate(s) {
  if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
  return new Date(parseDate(s)).toISOString().slice(0, 10) === s;
}

function isValidTime(s) {
  return typeof s === 'string' && TIME_RE.test(s);
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function dayIndex(s) {
  return Math.floor(parseDate(s) / DAY_MS);
}

function addDays(s, n) {
  return new Date(parseDate(s) + n * DAY_MS).toISOString().slice(0, 10);
}

/** 0 = Sunday … 6 = Saturday */
function weekday(s) {
  return new Date(parseDate(s)).getUTCDay();
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function fromMinutes(min) {
  const h = String(Math.floor(min / 60)).padStart(2, '0');
  const m = String(min % 60).padStart(2, '0');
  return `${h}:${m}`;
}

/** Current wall-clock date and minute-of-day in the given IANA time zone. */
function nowInZone(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    date: `${get('year')}-${get('month')}-${get('day')}`,
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}


/**
 * Free start times ("HH:MM") for one day.
 *
 * @param {object} p
 * @param {string} p.date          "YYYY-MM-DD" in the practice's time zone
 * @param {number} p.duration      session length in minutes
 * @param {object} p.schedule      { weeklyHours, slotInterval, bufferMinutes, minNoticeHours, maxDaysAhead }
 * @param {{start:number,end:number}[]} [p.dayBookings]  existing bookings that day, in minutes
 * @param {boolean} [p.blocked]    whole day blocked (vacation, holiday…)
 * @param {{date:string,minutes:number}} p.now  current local date/time
 */
function slotsForDay({ date, duration, schedule, dayBookings = [], blocked = false, now }) {
  if (blocked) return [];

  const today = dayIndex(now.date);
  const day = dayIndex(date);
  if (day < today || day > today + schedule.maxDaysAhead) return [];

  const earliest = today * 1440 + now.minutes + schedule.minNoticeHours * 60;
  const buffer = schedule.bufferMinutes;
  const ranges = schedule.weeklyHours[String(weekday(date))] || [];
  const slots = [];

  for (const [from, to] of ranges) {
    const end = toMinutes(to);
    for (let t = toMinutes(from); t + duration <= end; t += schedule.slotInterval) {
      if (day * 1440 + t < earliest) continue;
      const clash = dayBookings.some((b) => t < b.end + buffer && b.start < t + duration + buffer);
      if (!clash) slots.push(fromMinutes(t));
    }
  }
  return slots;
}

const root = document.documentElement;
const listeners = new Set();

function storageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    /* private mode – ignore */
  }
}

// ---------------------------------------------------------------------------
// Language
// ---------------------------------------------------------------------------

function getLang() {
  return root.lang === 'en' ? 'en' : 'he';
}

function locale() {
  return getLang() === 'he' ? 'he-IL' : 'en-GB';
}

/** Look up "section.key" in the current language; `{name}` placeholders are filled from vars. */
function t(path, vars) {
  const lookup = (lang) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), dictionaries[lang]);
  let str = lookup(getLang()) ?? lookup('he') ?? path;
  if (vars) str = str.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
  return str;
}

/** Pick the current language out of a { he, en } object from the config. */
function pick(obj) {
  if (obj == null || typeof obj === 'string') return obj ?? '';
  return obj[getLang()] ?? obj.he ?? '';
}

function onLangChange(fn) {
  listeners.add(fn);
}

function setLang(lang) {
  root.lang = lang;
  root.dir = lang === 'he' ? 'rtl' : 'ltr';
  storageSet('lang', lang);
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) {
    url.searchParams.delete('lang');
    history.replaceState(null, '', url);
  }
  applyTranslations();
  listeners.forEach((fn) => fn(lang));
}

/**
 * Fill text from the dictionary:
 *   data-i18n="section.key"                     → textContent
 *   data-i18n-attr="placeholder:key;aria-label:key" → attributes
 */
function applyTranslations(scope = document) {
  for (const el of scope.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of scope.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':').map((s) => s.trim());
      if (attr && key) el.setAttribute(attr, t(key));
    }
  }
  const titleKey = document.body.dataset.titleKey;
  if (titleKey && siteConfig) document.title = `${t(titleKey)} | ${pick(siteConfig.business.name)}`;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.content = t('meta.description');
  updateToggles();
  renderBusiness();
  renderStatus();
}

// ---------------------------------------------------------------------------
// Opening hours: "open now" / "opens tomorrow at…" from the weekly schedule
// ---------------------------------------------------------------------------

const hhmmToMinutes = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};

/** Day of week (0 = Sunday) and minute of the day in the clinic's time zone. */
function clinicNow(timeZone, at = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone,
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(at);
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(get('weekday')),
    minutes: Number(get('hour')) * 60 + Number(get('minute')),
  };
}

function dayName(day, style = 'long') {
  return new Intl.DateTimeFormat(locale(), { weekday: style, timeZone: 'UTC' }).format(new Date(Date.UTC(2023, 0, 1 + day)));
}

function clinicStatus(cfg = siteConfig, at = new Date()) {
  if (!cfg?.hours) return null;
  const now = clinicNow(cfg.timezone, at);
  for (const [from, to] of cfg.hours[now.day] || []) {
    if (now.minutes >= hhmmToMinutes(from) && now.minutes < hhmmToMinutes(to)) return { open: true, until: to, today: now.day };
  }
  for (let offset = 0; offset < 8; offset++) {
    const day = (now.day + offset) % 7;
    for (const [from] of cfg.hours[day] || []) {
      if (offset > 0 || hhmmToMinutes(from) > now.minutes) return { open: false, day, offset, at: from, today: now.day };
    }
  }
  return { open: false, today: now.day };
}

function renderStatus() {
  const s = clinicStatus();
  if (!s) return;
  const text = s.open
    ? t('status.open', { time: s.until })
    : s.at == null
      ? ''
      : s.offset === 0
        ? t('status.today', { time: s.at })
        : s.offset === 1
          ? t('status.tomorrow', { time: s.at })
          : t('status.later', { day: dayName(s.day), time: s.at });
  for (const node of document.querySelectorAll('[data-status]')) {
    node.textContent = text;
    node.classList.toggle('is-open', s.open);
    node.hidden = !text;
  }
}

// Small UI helpers
// ---------------------------------------------------------------------------

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v; // only ever used with trusted icon markup
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c);
  return node;
}

async function serverApi(url, { method = 'GET', body } = {}) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/** Mark invalid fields in a form. `fields` are server field names. */
function showFieldErrors(form, fields = []) {
  for (const f of form.querySelectorAll('.has-error')) f.classList.remove('has-error');
  for (const e of form.querySelectorAll('.field-error')) e.remove();
  let first = null;
  for (const name of new Set(fields)) {
    const input = form.elements[name];
    if (!input) continue;
    const wrap = input.closest('.field, .checkbox');
    wrap?.classList.add('has-error');
    input.setAttribute('aria-invalid', 'true');
    if (wrap?.classList.contains('field')) {
      const id = `${input.id}-error`;
      wrap.append(el('span', { class: 'field-error', id, role: 'alert' }, t(`errors.${name}`)));
      input.setAttribute('aria-describedby', id);
    }
    first ??= input;
  }
  first?.focus();
}

function clearFieldErrors(form) {
  showFieldErrors(form, []);
  for (const i of form.querySelectorAll('[aria-invalid]')) {
    i.removeAttribute('aria-invalid');
    i.removeAttribute('aria-describedby');
  }
}

function toast(message) {
  const node = el('div', { class: 'toast', role: 'status' }, message);
  document.body.append(node);
  setTimeout(() => node.remove(), 2600);
}

function initScrollSpy() {
  const links = [...document.querySelectorAll('.main-nav a[href^="#"]')];
  if (!links.length || !('IntersectionObserver' in window)) return;
  const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (e.isIntersecting) links.forEach((l) => l.classList.toggle('is-current', l === byId.get(e.target.id)));
      }
    },
    { rootMargin: '-45% 0px -50% 0px' },
  );
  for (const id of byId.keys()) {
    const section = document.getElementById(id);
    if (section) io.observe(section);
  }
}

function initReveal() {
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    items.forEach((i) => i.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          io.unobserve(e.target);
        }
      }
    },
    { rootMargin: '0px 0px -8% 0px' },
  );
  items.forEach((i) => io.observe(i));
}

function countUp(node) {
  const target = Number(node.dataset.count);
  if (reducedMotion()) {
    node.textContent = String(target);
    return;
  }
  const start = performance.now();
  const tick = (now) => {
    const k = Math.min(1, (now - start) / 1400);
    node.textContent = String(Math.round(target * (1 - (1 - k) ** 3)));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

  'IntersectionObserver' in window
    ? new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            if (e.isIntersecting) {
              counterObserver.unobserve(e.target);
              countUp(e.target);
            }
          }
        },
        { threshold: 0.6 },
      )
    : null;

// ---------------------------------------------------------------------------
// Breathing exercise: inhale 4s, hold 4s, exhale 6s, four rounds
// ---------------------------------------------------------------------------

function initBreathing() {
  const box = $('breathe-box');
  if (!box) return;
  const circle = $('breathe-circle');
  const phaseEl = $('breathe-phase');
  const countEl = $('breathe-count');
  const button = $('breathe-toggle');
  const label = button.querySelector('[data-i18n]');
  const PHASES = [
    { key: 'inhale', secs: 4, scale: 1 },
    { key: 'hold', secs: 4, scale: 1 },
    { key: 'exhale', secs: 6, scale: 0.62 },
  ];
  const ROUNDS = 4;
  let running = false;
  let timer = null;

  const setText = (node, key, vars) => {
    node.dataset.i18n = key;
    node.textContent = t(key, vars);
  };

  function stop(finished = false) {
    running = false;
    clearTimeout(timer);
    box.classList.remove('is-running');
    circle.style.setProperty('--breath-time', '1.6s');
    circle.style.setProperty('--breath', '0.62');
    setText(phaseEl, finished ? 'breathe.done' : 'breathe.ready');
    countEl.textContent = '';
    setText(label, 'breathe.start');
  }

  function runPhase(round, index) {
    if (!running) return;
    if (index === PHASES.length) {
      round += 1;
      index = 0;
    }
    if (round > ROUNDS) return stop(true);
    const phase = PHASES[index];
    circle.style.setProperty('--breath-time', `${phase.secs}s`);
    circle.style.setProperty('--breath', String(phase.scale));
    setText(phaseEl, `breathe.${phase.key}`);
    let left = phase.secs;
    countEl.textContent = `${left} · ${t('breathe.cycle', { n: round, total: ROUNDS })}`;
    const tick = () => {
      if (!running) return;
      left -= 1;
      if (left <= 0) return runPhase(round, index + 1);
      countEl.textContent = `${left} · ${t('breathe.cycle', { n: round, total: ROUNDS })}`;
      timer = setTimeout(tick, 1000);
    };
    timer = setTimeout(tick, 1000);
  }

  button.addEventListener('click', () => {
    if (running) return stop();
    running = true;
    box.classList.add('is-running');
    setText(label, 'breathe.stop');
    runPhase(1, 0);
  });
}

// ---------------------------------------------------------------------------
// Process: a line that draws itself through the three steps as you scroll
// ---------------------------------------------------------------------------

function initProcess() {
  const flow = $('process-flow');
  if (!flow) return;
  const line = flow.querySelector('.process-line');
  const track = line.querySelector('.track');
  const draw = line.querySelector('.draw');
  const stepList = flow.querySelector('.steps');
  const steps = [...flow.querySelectorAll('.step')];
  let fractions = steps.map((_, i) => i / (steps.length - 1));

  function layout() {
    const box = flow.getBoundingClientRect();
    if (!box.width) return;
    line.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    line.style.height = `${box.height}px`;
    const nodes = steps.map((s) => {
      const r = s.querySelector('.step-node').getBoundingClientRect();
      return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top];
    });
    const startX = isRtl() ? box.width : 0;
    const endX = isRtl() ? 0 : box.width;
    const pts = [[startX, nodes[0][1]], ...nodes, [endX, nodes.at(-1)[1]]];
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      const mid = (x0 + x1) / 2;
      // Gentle waves between the steps; straight lead-in and lead-out at the edges.
      const wave = i === 1 || i === pts.length - 1 ? 0 : (i % 2 ? -1 : 1) * 36;
      d += ` C${mid},${y0 + wave} ${mid},${y1 + wave} ${x1},${y1}`;
    }
    track.setAttribute('d', d);
    draw.setAttribute('d', d);
    fractions = nodes.map(([x]) => Math.abs(x - startX) / box.width);
    update();
  }

  function update() {
    const r = flow.getBoundingClientRect();
    const vh = window.innerHeight;
    const p = Math.min(1, Math.max(0, (vh * 0.85 - r.top) / (r.height + vh * 0.25)));
    const shown = reducedMotion() ? 1 : p;
    draw.setAttribute('stroke-dashoffset', String(1 - shown));
    stepList.style.setProperty('--p', String(shown));
    const vertical = getComputedStyle(line).display === 'none';
    steps.forEach((s, i) => {
      const at = vertical ? i / (steps.length - 1) : fractions[i];
      s.classList.toggle('is-lit', shown >= at - 0.02);
    });
  }

  let queued = false;
  window.addEventListener(
    'scroll',
    () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        update();
      });
    },
    { passive: true },
  );
  if ('ResizeObserver' in window) new ResizeObserver(layout).observe(flow);
  document.fonts?.ready.then(layout);
  layout();
}

function initCarousel() {
  const strip = $('carousel');
  if (!strip) return;
  const items = [...strip.querySelectorAll('.carousel-item')];
  const bar = document.querySelector('.carousel-progress span');
  const prev = $('carousel-prev');
  const next = $('carousel-next');

  const update = () => {
    const max = strip.scrollWidth - strip.clientWidth;
    const pos = Math.abs(strip.scrollLeft);
    bar.style.setProperty('--p', String(max > 0 ? 0.12 + 0.88 * (pos / max) : 1));
    prev.disabled = pos < 4;
    next.disabled = pos > max - 4;
  };
  const stepSize = () => items[0].getBoundingClientRect().width + 18;
  next.addEventListener('click', () => strip.scrollBy({ left: (isRtl() ? -1 : 1) * stepSize(), behavior: 'smooth' }));
  prev.addEventListener('click', () => strip.scrollBy({ left: (isRtl() ? 1 : -1) * stepSize(), behavior: 'smooth' }));
  strip.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });

  // Drag with the mouse (touch screens scroll natively).
  let drag = null;
  let dragged = false;
  strip.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, left: strip.scrollLeft };
    dragged = false;
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!dragged && Math.abs(dx) > 6) {
      dragged = true;
      strip.classList.add('is-dragging');
    }
    if (dragged) strip.scrollLeft = drag.left - dx;
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return;
    drag = null;
    if (dragged) {
      strip.classList.remove('is-dragging');
      // Let snapping settle on the nearest photo.
      const center = strip.getBoundingClientRect().left + strip.clientWidth / 2;
      const nearest = items.reduce((a, b) => {
        const da = Math.abs(a.getBoundingClientRect().left + a.offsetWidth / 2 - center);
        const db = Math.abs(b.getBoundingClientRect().left + b.offsetWidth / 2 - center);
        return db < da ? b : a;
      });
      nearest.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });
  strip.addEventListener(
    'click',
    (e) => {
      if (dragged) {
        e.preventDefault();
        e.stopPropagation();
        dragged = false;
      }
    },
    true,
  );
  update();
  initLightbox(items);
}

    img.src = item.dataset.large;
    img.alt = item.querySelector('img').alt;
    caption.textContent = item.querySelector('.cap')?.textContent || '';
    counter.textContent = t('gallery.count', { n: index + 1, total: items.length });
  }

  items.forEach((item, i) =>
    item.addEventListener('click', () => {
      show(i);
      dialog.showModal();
    }),
  );
  dialog.addEventListener('click', (e) => e.target === dialog && dialog.close());
  dialog.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') show(index + (isRtl() ? 1 : -1));
    if (e.key === 'ArrowRight') show(index + (isRtl() ? -1 : 1));
  });
  let touchX = null;
  dialog.addEventListener('touchstart', (e) => (touchX = e.touches[0].clientX), { passive: true });
  dialog.addEventListener('touchend', (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 40) show(index + ((dx > 0) === isRtl() ? 1 : -1));
  });
}

// ---------------------------------------------------------------------------
// Soft light that follows the mouse across the hero
// ---------------------------------------------------------------------------

function initCursorGlow() {
  const hero = document.querySelector('.hero');
  if (!hero || !window.matchMedia('(pointer: fine)').matches) return;
  let tx = 50;
  let ty = 40;
  let x = 50;
  let y = 40;
  let frame = null;
  const loop = () => {
    x += (tx - x) * 0.1;
    y += (ty - y) * 0.1;
    hero.style.setProperty('--mx', `${x}%`);
    hero.style.setProperty('--my', `${y}%`);
    frame = Math.abs(tx - x) + Math.abs(ty - y) > 0.05 ? requestAnimationFrame(loop) : null;
  };
  hero.addEventListener('pointermove', (e) => {
    if (reducedMotion()) return;
    const r = hero.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width) * 100;
    ty = ((e.clientY - r.top) / r.height) * 100;
    frame ??= requestAnimationFrame(loop);
  });
}

// ---------------------------------------------------------------------------
// Opening hours table
// ---------------------------------------------------------------------------

function renderHours() {
  const body = $('hours-body');
  if (!body || !config?.hours) return;
  const today = clinicNow(config.timezone).day;
  const range = (from, to) => el('span', {}, `${from}–${to}`);
  body.replaceChildren(
    ...[0, 1, 2, 3, 4, 5, 6].map((day) => {
      const ranges = config.hours[day] || [];
      return el(
        'tr',
        { class: day === today ? 'is-today' : null },
        el('th', { scope: 'row' }, dayName(day)),
        el(
          'td',
          { class: ranges.length ? null : 'is-closed' },
          ...(ranges.length
            ? ranges.flatMap(([from, to], i) => (i ? [', ', range(from, to)] : [range(from, to)]))
            : [t('visit.closed')]),
        ),
      );
    }),
  );
}

// ---------------------------------------------------------------------------
// Contact form
// ---------------------------------------------------------------------------

const form = $('contact-form');
const status = $('contact-status');

function setStatus(kind, message) {
  status.replaceChildren(message ? el('p', { class: `alert alert-${kind}` }, message) : '');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  clearFieldErrors(form);
  setStatus();

  if (config?.handoff === 'whatsapp') {
    const missing = [];
    if (data.name.trim().length < 2) missing.push('name');
    if (data.message.trim().length < 2) missing.push('message');
    if (missing.length) return showFieldErrors(form, missing);
    const text = `${t('contact.waIntro', { name: data.name.trim() })}\n${data.message.trim()}`;
    const href = `https://wa.me/${config.business.whatsapp}?text=${encodeURIComponent(text)}`;
    window.open(href, '_blank', 'noopener');
    status.replaceChildren(
      el(
        'p',
        { class: 'alert alert-success' },
        `${t('contact.waSuccess')} `,
        el('a', { href, target: '_blank', rel: 'noopener' }, t('contact.waLink')),
      ),
    );
    return;
  }

  const bad = [];
  if (data.name.trim().length < 2) bad.push('name');
  if (!data.phone.trim() && !data.email.trim()) {
    bad.push('phone');
    setStatus('error', t('contact.needContact'));
  }
  if (data.message.trim().length < 2) bad.push('message');
  if (bad.length) return showFieldErrors(form, bad);

  const button = form.querySelector('[type="submit"]');
  button.disabled = true;
  button.textContent = t('contact.sending');
  try {
    await api('/api/contact', { method: 'POST', body: { ...data, lang: getLang() } });
    form.reset();
    setStatus('success', t('contact.success'));
  } catch (err) {
    if (err.status === 400) showFieldErrors(form, err.data.fields);
    else setStatus('error', t(err.status === 429 ? 'errors.rate' : 'common.error'));
  } finally {
    button.disabled = false;
    button.textContent = t(button.dataset.i18n);
  }
});

// Boot
// ---------------------------------------------------------------------------

function renderAll() {

}

initBreathing();
initProcess();
initCarousel();

loadConfig()

onLangChange(renderAll);

{

const $ = (id) => document.getElementById(id);

const state = {
  config: null,
  step: 1,
  service: null,
  month: null, // "YYYY-MM"
  date: null,
  time: null,
  loading: false,
  autoAdvanced: false,
};
const cache = new Map(); // `${serviceId}|${month}` → { "YYYY-MM-DD": ["HH:MM"] }

// ---------------------------------------------------------------------------
// Date helpers (plain strings, no time-zone surprises)
// ---------------------------------------------------------------------------

const utc = (s) => {
  const [y, m, d = 1] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
};
const iso = (date) => date.toISOString().slice(0, 10);
const monthOf = (dateStr) => dateStr.slice(0, 7);
function shiftMonth(month, n) {
  const d = utc(month);
  d.setUTCMonth(d.getUTCMonth() + n);
  return iso(d).slice(0, 7);
}
function lastDay(month) {
  const d = utc(month);
  return iso(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)));
}
function maxDate() {
  const d = utc(state.config.today);
  d.setUTCDate(d.getUTCDate() + state.config.maxDaysAhead);
  return iso(d);
}
function fmtDate(dateStr, opts = { weekday: 'long', day: 'numeric', month: 'long' }) {
  return new Intl.DateTimeFormat(locale(), { ...opts, timeZone: 'UTC' }).format(utc(dateStr));
}

// ---------------------------------------------------------------------------
// Steps
// ---------------------------------------------------------------------------

function goTo(step, { focus = true } = {}) {
  state.step = step;
  for (let i = 1; i <= 3; i++) $(`step-${i}`).hidden = i !== step;
  for (const li of $('stepper').children) {
    const n = Number(li.dataset.step);
    li.classList.toggle('is-active', n === step);
    li.classList.toggle('is-done', n < step);
    if (n === step) li.setAttribute('aria-current', 'step');
    else li.removeAttribute('aria-current');
  }
  if (step === 2) loadMonth();
  if (focus) {
    $(`step-${step}-title`).focus({ preventScroll: true });
    $('stepper').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ---------------------------------------------------------------------------
// Step 1 – service
// ---------------------------------------------------------------------------

function renderServices() {
  $('service-options').replaceChildren(
    ...state.config.services.map((s) =>
      el(
        'button',
        {
          type: 'button',
          class: 'service-option',
          'aria-pressed': String(state.service?.id === s.id),
          onclick: () => selectService(s),
        },
        s.image
          ? el('span', { class: 'service-thumb' }, el('img', { src: s.image, alt: '', width: 700, height: 700 }))
          : el('span', { class: 'card-icon', html: svg(s.icon) }),
        el(
          'span',
          {},
          el('strong', {}, pick(s.name)),
          el(
            'span',
            { class: 'service-meta' },
            el('span', { class: 'chip', html: svg('clock') }, t('common.minutes', { n: s.duration })),
            s.price == null ? null : el('span', { class: 'chip chip-accent' }, formatPrice(s.price)),
          ),
        ),
        el('span', { class: 'check-mark', 'aria-hidden': 'true' }),
      ),
    ),
  );
  $('to-step-2').disabled = !state.service;
}

function selectService(service) {
  if (state.service?.id !== service.id) {
    state.service = service;
    state.date = null;
    state.time = null;
  }
  renderServices();
  renderSummary();
}

// ---------------------------------------------------------------------------
// Step 2 – calendar & slots
// ---------------------------------------------------------------------------

async function loadMonth() {
  const key = `${state.service.id}|${state.month}`;
  renderCalendar();
  if (!cache.has(key)) {
    state.loading = true;
    renderCalendar();
    try {
      const params = new URLSearchParams({ service: state.service.id, from: `${state.month}-01`, to: lastDay(state.month) });
      const { days } = await api(`/api/availability?${params}`);
      cache.set(key, days);
    } catch {
      setAlert('time-alert', 'error', t('common.error'));
    } finally {
      state.loading = false;
    }
  }
  // Pre-select the first open day of the month for a quicker flow.
  const days = cache.get(key) || {};
  const anyOpen = Object.values(days).some((s) => s.length);
  // Near the end of a month there may be no open days left: start on next month instead.
  if (!anyOpen && !state.autoAdvanced && cache.has(key) && state.month === monthOf(state.config.today) && shiftMonth(state.month, 1) <= monthOf(maxDate())) {
    state.autoAdvanced = true;
    state.month = shiftMonth(state.month, 1);
    return loadMonth();
  }
  if (!state.date || monthOf(state.date) !== state.month || !days[state.date]?.length) {
    const first = Object.keys(days).sort().find((d) => days[d].length);
    if (first) {
      state.date = first;
      state.time = null;
    }
  }
  renderCalendar();
  renderSlots();
  renderSummary();
}

function renderCalendar() {
  const cal = $('calendar');
  const days = cache.get(`${state.service?.id}|${state.month}`) || {};
  const start = utc(state.month);
  const offset = start.getUTCDay(); // weeks start on Sunday (Israeli calendar)
  const count = utc(lastDay(state.month)).getUTCDate();

  $('month-label').textContent = new Intl.DateTimeFormat(locale(), { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(start);
  $('prev-month').disabled = state.month <= monthOf(state.config.today);
  $('next-month').disabled = shiftMonth(state.month, 1) > monthOf(maxDate());
  cal.classList.toggle('is-loading', state.loading);

  const dowFmt = new Intl.DateTimeFormat(locale(), { weekday: 'short', timeZone: 'UTC' });
  const cells = [];
  for (let i = 0; i < 7; i++) {
    cells.push(el('span', { class: 'dow', 'aria-hidden': 'true' }, dowFmt.format(new Date(Date.UTC(2023, 0, 1 + i)))));
  }
  for (let i = 0; i < offset; i++) cells.push(el('span'));
  for (let d = 1; d <= count; d++) {
    const date = `${state.month}-${String(d).padStart(2, '0')}`;
    const open = (days[date] || []).length > 0;
    cells.push(
      el(
        'button',
        {
          type: 'button',
          class: ['day', open && 'is-available', date === state.config.today && 'is-today'].filter(Boolean).join(' '),
          disabled: !open,
          'aria-pressed': String(date === state.date),
          'aria-label': fmtDate(date),
          onclick: () => {
            state.date = date;
            state.time = null;
            renderCalendar();
            renderSlots();
            renderSummary();
          },
        },
        String(d),
      ),
    );
  }
  cal.replaceChildren(...cells);
}

function renderSlots() {
  const wrap = $('slots');
  const days = cache.get(`${state.service.id}|${state.month}`);
  const anyOpen = days && Object.values(days).some((s) => s.length);

  if (!state.date || monthOf(state.date) !== state.month) {
    $('slots-title').textContent = '';
    wrap.replaceChildren(
      el('p', { class: 'empty-state' }, state.loading ? t('common.loading') : t(days && !anyOpen ? 'book.noSlotsMonth' : 'book.pickDay')),
    );
  } else {
    const slots = days?.[state.date] || [];
    $('slots-title').textContent = t('book.slotsFor', { date: fmtDate(state.date) });
    wrap.replaceChildren(
      slots.length
        ? el(
            'div',
            { class: 'slots' },
            slots.map((time) =>
              el(
                'button',
                {
                  type: 'button',
                  class: 'slot',
                  'aria-pressed': String(time === state.time),
                  onclick: () => {
                    state.time = time;
                    renderSlots();
                    renderSummary();
                  },
                },
                time,
              ),
            ),
          )
        : el('p', { class: 'empty-state' }, t('book.noSlots')),
    );
  }
  $('to-step-3').disabled = !(state.date && state.time);
}

// ---------------------------------------------------------------------------
// Summary
// ---------------------------------------------------------------------------

function renderSummary() {
  const s = state.service;
  const rows = [
    ['book.service', s && pick(s.name)],
    ['book.date', state.date && fmtDate(state.date)],
    ['book.time', state.time],
    ['book.duration', s && t('common.minutes', { n: s.duration })],

  $('summary').replaceChildren(
    ...rows.flatMap(([label, value]) => [
      el('dt', {}, t(label)),
      el('dd', {}, value ? el('bdi', {}, value) : el('span', { class: 'placeholder' }, t('book.notChosen'))),
    ]),
  );
}

// ---------------------------------------------------------------------------
// Step 3 – details & submit
// ---------------------------------------------------------------------------

function setAlert(id, kind, message) {
  $(id).replaceChildren(message ? el('p', { class: `alert alert-${kind}` }, message) : '');
}

// On a static host (GitHub Pages) there's no server: the request is sent to the
// practitioner on WhatsApp instead, and they confirm the time with the client.
const viaWhatsApp = () => state.config?.handoff === 'whatsapp';

function whatsappMessage(data) {
  const lines = [
    t('book.waIntro', { name: data.name.trim() }),
    `${t('book.service')}: ${pick(state.service.name)}`,
    `${t('book.date')}: ${fmtDate(state.date)}`,
    `${t('book.time')}: ${state.time}`,
    `${t('contact.formPhone')}: ${data.phone.trim()}`,
  ];
  if (data.notes?.trim()) lines.push(`${t('book.waNotes')}: ${data.notes.trim()}`);
  return lines.join('\n');
}

function handOffToWhatsApp(data) {
  const href = `https://wa.me/${state.config.business.whatsapp}?text=${encodeURIComponent(whatsappMessage(data))}`;
  window.open(href, '_blank', 'noopener');
  const booking = { date: state.date, time: state.time, duration: state.service.duration, name: data.name.trim() };
  showConfirmation(booking, false, href);
}

const PHONE_RE = /^\+?[\d\s\-()]{7,20}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

async function submit(e) {
  e.preventDefault();
  const form = $('details-form');
  const data = Object.fromEntries(new FormData(form));
  clearFieldErrors(form);
  setAlert('details-alert');

  const bad = [];
  if ((data.name || '').trim().length < 2) bad.push('name');
  if (!PHONE_RE.test((data.phone || '').trim())) bad.push('phone');
  if (data.email && !EMAIL_RE.test(data.email.trim())) bad.push('email');
  if (!data.consent) bad.push('consent');
  if (bad.length) return showFieldErrors(form, bad);
  if (viaWhatsApp()) return handOffToWhatsApp(data);

  const button = $('confirm-btn');
  button.disabled = true;
  button.textContent = t('book.confirming');
  try {
    const { booking } = await api('/api/bookings', {
      method: 'POST',
      body: {
        serviceId: state.service.id,
        date: state.date,
        time: state.time,
        name: data.name,
        phone: data.phone,
        email: data.email,
        notes: data.notes,
        consent: true,
        lang: getLang(),
      },
    });
    showConfirmation(booking, Boolean(data.email));
  } catch (err) {
    if (err.status === 409 || err.data?.fields?.some((f) => ['date', 'time', 'serviceId'].includes(f))) {
      cache.clear();
      state.time = null;
      goTo(2);
      setAlert('time-alert', 'error', t('book.slotTaken'));
    } else if (err.status === 400) {
      showFieldErrors(form, err.data.fields);
    } else {
      setAlert('details-alert', 'error', t(err.status === 429 ? 'errors.rate' : 'common.error'));
    }
  } finally {
    button.disabled = false;
    button.textContent = t(button.dataset.i18n);
  }
}

let confirmed = null;

function renderConfirmation() {
  if (!confirmed) return;
  const { booking, whatsappHref } = confirmed;
  const title = $('confirm-title');
  title.dataset.i18n = whatsappHref ? 'book.waTitle' : 'book.successTitle';
  title.textContent = t(title.dataset.i18n);
  $('confirm-text').textContent = whatsappHref ? t('book.waText') : t('book.successText', { name: booking.name });
  $('confirm-whatsapp').hidden = !whatsappHref;
  if (whatsappHref) $('confirm-whatsapp').href = whatsappHref;
  const rows = [
    booking.ref && ['book.ref', el('span', { class: 'ref' }, booking.ref)],
    ['book.service', pick(state.service.name)],
    ['book.date', fmtDate(booking.date)],
    ['book.time', el('bdi', {}, booking.time)],
    ['book.duration', t('common.minutes', { n: booking.duration })],
  ].filter(Boolean);
  $('confirm-details').replaceChildren(...rows.flatMap(([k, v]) => [el('dt', {}, t(k)), el('dd', {}, v)]));
}

function showConfirmation(booking, emailed, whatsappHref = null) {
  confirmed = { booking, whatsappHref };
  $('booking-flow').hidden = true;
  document.querySelector('.page-hero').hidden = true;
  $('confirmation').hidden = false;
  $('confirm-email').hidden = !emailed;
  renderConfirmation();
  window.scrollTo({ top: 0, behavior: 'instant' });
  $('confirm-title').focus({ preventScroll: true });
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

function renderAll() {
  if (!state.config) return;
  renderServices();
  if (state.service) {
    renderCalendar();
    renderSlots();
  }
  renderSummary();
  renderConfirmation();
}

$('to-step-2').addEventListener('click', () => {
  setAlert('time-alert');
  goTo(2);
});
$('to-step-3').addEventListener('click', () => goTo(3));
for (const b of document.querySelectorAll('[data-go]')) b.addEventListener('click', () => goTo(Number(b.dataset.go)));
$('prev-month').addEventListener('click', () => {
  state.month = shiftMonth(state.month, -1);

$('next-month').addEventListener('click', () => {

});
$('details-form').addEventListener('submit', submit);
onLangChange(renderAll);

loadConfig()
  .then((config) => {

    if (viaWhatsApp()) {
      $('b-email').closest('.field').hidden = true;

window.__bookPreset = (id) => {

    goTo(2, { focus: false });

};
window.__bookReset = () => {
  confirmed = null;
  state.service = null;
  state.date = null;
  state.time = null;
  $('details-form').reset();
  $('booking-flow').hidden = false;

// ---- Router: #book shows the booking page, anything else the home page ----
{
  const home = document.getElementById('page-home');
  const bookPage = document.getElementById('page-book');
  let pendingService = null;
  function route() {
    const h = location.hash.slice(1);
    const isBook = h === 'book';
    home.hidden = isBook;
    bookPage.hidden = !isBook;
    document.body.dataset.titleKey = isBook ? 'meta.bookTitle' : 'meta.homeTitle';
    document.body.dataset.route = isBook ? 'book' : 'home';
    applyTranslations();
    if (isBook) {
      window.scrollTo({ top: 0, behavior: 'instant' });
      if (pendingService) {
        const id = pendingService;
        pendingService = null;
        loadConfig().then(() => window.__bookPreset(id));
      }
    } else if (h && h !== 'top' && h !== 'main') {
      document.getElementById(h)?.scrollIntoView();
    } else {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href === '#main') return;
    e.preventDefault();
    if (a.id === 'book-another') window.__bookReset();
    if (a.dataset.service) pendingService = a.dataset.service;
    if (location.hash === href) route();
    else location.hash = href;
  });
  window.addEventListener('hashchange', route);
  route();
}
